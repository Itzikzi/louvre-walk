גי של אישה שמחזיקה את מכתב דוד ושוקלת את גורלה. האריס וצוקר מראים את הצבעים החמים, משיכות המכחול בסדין, ואת הדוגמנית, הנדריקיה בת זוגו של רמברנדט.","elab":[{"tm":"0:14","txt":"הסיפור משמואל ב': דוד רואה את בת שבע רוחצת, מזמן אותה אף שהיא אשת אוריה, שולח את אוריה למות בקרב, והילד הראשון שלהם מת.","vid":"wsL4Uh0BrQw","sec":14},{"tm":"0:58","txt":"זה ציור על פסיכולוגיה: רגע של התלבטות. היא מחזיקה את המכתב ויודעת מה מחכה לה.","vid":"wsL4Uh0BrQw","sec":58},{"tm":"1:46","txt":"תחושת אסון: הראש מוטה, המבט מושפל והעפעפיים כבדים.","vid":"wsL4Uh0BrQw","sec":106},{"tm":"2:19","txt":"רקע כהה, אבל צבעים חמים של זהב, אדום וכתום, כמעט ונציאניים. המשרתת למטה מנגבת את רגליה.","vid":"wsL4Uh0BrQw","sec":139},{"tm":"2:34","txt":"משיכות המכחול חופשיות ונמרצות בסדין הלבן, והעור מצויר בגוונים עדינים של ורוד, ירוק ולבן.","vid":"wsL4Uh0BrQw","sec":154},{"tm":"3:21","txt":"הדוגמנית היא הנדריקיה, בת זוגו של רמברנדט. זו לא אלה קלאסית אידיאלית אלא אישה אמיתית.","vid":"wsL4Uh0BrQw","sec":201}],"esrc":"Smarthistory · כתוביות הסרטון"}],"rembrandt_emmaus":[{"l":"FR","show":"Artcothèque","ep":"Le souper à Emmaüs de Rembrandt : analyse","len":"14 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=fUT9kp2JiA0",0]],"tr":null,"at":"כל הסרטון (בצרפתית)","sum":"ניתוח מפורט בצרפתית של \"הצליינים באמאוס\" של רמברנדט (1648): רגע ההתגלות כשישו בוצע את הלחם, החדר הריק והאור סביב הפנים החיוורות. המרצה מסביר את הטכניקה של רמברנדט ואת ההשערה שהדוגמן לישו היה צעיר יהודי מאמסטרדם.","elab":[{"tm":"0:55","txt":"ברשימת הנכסים של רמברנדט מופיע \"ישו מצויר מהחיים\". מה זה אומר?","vid":"fUT9kp2JiA0","sec":55},{"tm":"2:53","txt":"הסיפור מלוקס: שני צליינים מזמינים זר לארוחה, וכשהוא בוצע את הלחם הם מזהים את ישו.","vid":"fUT9kp2JiA0","sec":173},{"tm":"3:49","txt":"חדר נקי מקישוטים, כמעט ריק, שבו מתרחשת תעלומה עליונה.","vid":"fUT9kp2JiA0","sec":229},{"tm":"4:47","txt":"קיר ניטרלי, פנים חיוורות, והילה שהיא רצף של צל ואור סביב הפנים.","vid":"fUT9kp2JiA0","sec":287},{"tm":"6:41","txt":"הטכניקה: שתי שכבות הכנה לבנות, שכבת חום מעליהן, ואז משיכות צבע.","vid":"fUT9kp2JiA0","sec":401},{"tm":"7:38","txt":"הצליינים קופאים: הם כבר לא מביטים בלחם, ומתחילים להבין את מי הם אירחו.","vid":"fUT9kp2JiA0","sec":458},{"tm":"8:34","txt":"הדוגמן לישו היה כנראה צעיר יהודי מאמסטרדם, מהשכונה של רמברנדט.","vid":"fUT9kp2JiA0","sec":514},{"tm":"10:31","txt":"הרבה תיקונים ושינויים ישירות על הבד, דבר חדש יחסית בזמנו.","vid":"fUT9kp2JiA0","sec":631}],"esrc":"Artcothèque · כתוביות הסרטון"}],"la_tour_cheat":[{"l":"EN","show":"The History Guy","ep":"The 400-Year-Old Art Scam: Georges de La Tour’s Masterpiece","len":"8 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=30AQ1t6mmpw",0]],"tr":null,"at":"כל הסרטון","sum":"קריאה בלשית של \"הרמאי עם אס היהלום\" של ז'ורז' דה לה טור: צעיר עשיר ותמים ליד שולחן קלפים, ושלושה נוכלים שעובדים בתיאום מושלם. הסרטון עוקב אחרי הידיים והמבטים ומסביר את המוסר: הונאה מגיעה עם קסם ועבודת צוות, בלי אלימות.","elab":[{"tm":"0:00","txt":"ארבעה אנשים, משחק קלפים וערמת זהב. אחד מהם עומד להפסיד הכול, וכל השאר כבר יודעים.","vid":"30AQ1t6mmpw","sec":0},{"tm":"1:20","txt":"לה טור מלוריין היה צייר המלך לואי ה-13, נשכח למשך כ-300 שנה, והתגלה מחדש במאה ה-20.","vid":"30AQ1t6mmpw","sec":80},{"tm":"1:56","txt":"המסר המוסרי: צעיר טיפש וחמדן שנופל בידי נוכלים, הד למשל הבן האובד.","vid":"30AQ1t6mmpw","sec":116},{"tm":"2:35","txt":"לא מסבאה מבולגנת אלא במה מוארת וקפואה. מימין הקורבן בבגדי משי ובכובע נוצות.","vid":"30AQ1t6mmpw","sec":155},{"tm":"3:16","txt":"משמאל הרמאי שולף את אס היהלום מהחגורה מאחורי הגב. בגדיו פשוטים וכפפותיו כהות.","vid":"30AQ1t6mmpw","sec":196},{"tm":"3:51","txt":"במרכז הקורטיזנה בכובע אדום מנהלת את המשחק.","vid":"30AQ1t6mmpw","sec":231},{"tm":"4:27","txt":"המשרתת עם כוס היין מסיחה את דעתו. שרשרת מבטים: הקורטיזנה מביטה במשרתת, המשרתת ביד, והרמאי מחכה.","vid":"30AQ1t6mmpw","sec":267},{"tm":"7:01","txt":"לה טור מקפיא את השנייה שלפני הנפילה: הצעיר עוד מאמין במזלו.","vid":"30AQ1t6mmpw","sec":421}],"esrc":"The History Guy · כתוביות הסרטון"}],"watteau_cythera":[{"l":"EN","show":"Smarthistory","ep":"Antoine Watteau, Pilgrimage to Cythera","len":"5 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=8ZlH2JswO3Q",10]],"tr":["Transcript","https://smarthistory.org/watteau-pilgrimage-to-cythera/"],"at":"כל הסרטון","sum":"הסבר על \"עלייה לרגל לאי קיתרה\" של ואטו, יצירת המופת של הרוקוקו: זוגות מאוהבים באי של אפרודיטה. האריס וצוקר מתלבטים אם הם מגיעים לאי או עוזבים אותו, ומספרים שהאקדמיה המציאה בשבילו ז'אנר חדש, ה\"פט גאלאנט\".","elab":[{"tm":"0:20","txt":"קיתרה הוא אי יווני שנחשב למקום הולדתה של אפרודיטה, אלת האהבה. מימין פסל שלה עטור ורדים, וקופידון קטן מושך בשמלה של צעירה.","vid":"8ZlH2JswO3Q","sec":20},{"tm":"1:02","txt":"הזוגות יורדים במדרון, וככל שמתקדמים הם קרובים יותר זה לזה, כמו ריקוד של חיזור.","vid":"8ZlH2JswO3Q","sec":62},{"tm":"1:15","txt":"היסטוריונים של אמנות מתווכחים כבר מאות שנים: האם הם מפליגים אל האי או עוזבים אותו בנוסטלגיה?","vid":"8ZlH2JswO3Q","sec":75},{"tm":"1:39","txt":"הסירה המוזהבת עם משוטאים, זרי פרחים וקופידונים מעופפים מחכה לזוגות.","vid":"8ZlH2JswO3Q","sec":99},{"tm":"3:02","txt":"זו עבודת הקבלה של ואטו לאקדמיה המלכותית. לא הייתה לה קטגוריה, אז המציאו אחת חדשה: \"פט גאלאנט\".","vid":"8ZlH2JswO3Q","sec":182},{"tm":"3:43","txt":"באקדמיה התנהל ויכוח בין חסידי פוסן (הקו) לחסידי רובנס (הצבע). ואטו בבירור במחנה הצבע.","vid":"8ZlH2JswO3Q","sec":223},{"tm":"4:50","txt":"זה עולם האצולה של המשטר הישן, פחות ממאה שנה לפני שהמהפכה הצרפתית תמחק אותו.","vid":"8ZlH2JswO3Q","sec":290}],"esrc":"Smarthistory · כתוביות הסרטון"}],"chardin_ray":[{"l":"EN","show":"ZCZ Films (Waldemar Januszczak)","ep":"Rococo: Chardin and the Ray","len":"8 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=YhWOFDJ4Yz8",0]],"tr":null,"at":"כל הסרטון. על \"הטריגון\" עצמו מ-3:34","sum":"ולדמר יאנושצ'אק (BBC) בסצנה מסדרת הרוקוקו שלו: שרדן כצד האפל של הרוקוקו. הוא מספר על חייו העצובים, ומפרש את \"הטריגון\" כטבע דומם עם משמעות דתית נסתרת: הדג התלוי כמו צלוב, הכלים כמו כלי קודש והסכין כאיזון השברירי של החיים.","elab":[{"tm":"0:00","txt":"עידן הרוקוקו היה אובססיבי לאוכל. זה סרט על הלב האפל שלו.","vid":"YhWOFDJ4Yz8","sec":0},{"tm":"0:45","txt":"\"ג'ני הניבר\": טריגון מיובש שמלחים באנטוורפן מכרו לתיירים כשרידי מפלצת ים.","vid":"YhWOFDJ4Yz8","sec":45},{"tm":"1:29","txt":"הטבע הדומם של שרדן חום, אפור וקפוא, וגם האנשים שלו לא \"רוקוקו\": נערים קודרים וטבחיות צנועות.","vid":"YhWOFDJ4Yz8","sec":89},{"tm":"2:53","txt":"חיים בודדים: שתי נשים ושתי בנות מתו, ובנו התאבד בוונציה.","vid":"YhWOFDJ4Yz8","sec":173},{"tm":"3:34","txt":"\"הטריגון\", היצירה המפורסמת שלו, הייתה עבודת הקבלה שלו לאקדמיה הצרפתית.","vid":"YhWOFDJ4Yz8","sec":214},{"tm":"4:14","txt":"טבע דומם נחשב לז'אנר הנמוך ביותר, אבל כאן יש משמעות עמוקה יותר.","vid":"YhWOFDJ4Yz8","sec":254},{"tm":"4:56","txt":"הטריגון תלוי כמו צלוב, הקרביים נשפכים, וה\"פנים\" שלו עצובות.","vid":"YhWOFDJ4Yz8","sec":296},{"tm":"5:41","txt":"הכלים כמו כלי קודש, הסכין על קצה השולחן היא האיזון השברירי של החיים, והצדפות הן החטא.","vid":"YhWOFDJ4Yz8","sec":341}],"esrc":"ZCZ Films (Waldemar Januszczak) · כתוביות הסרטון"}]};

const INFO_HTML="<div class=\"info\" style=\"display:flex;flex-direction:column;gap:12px\">\n<h3>שעות וכניסה</h3>\n<dl class=\"kv\">\n<dt>שעות</dt><dd>9:00–18:00. ברביעי ובשישי עד 21:00. כניסה אחרונה שעה לפני הסגירה; פינוי האולמות מתחיל חצי שעה לפני.</dd>\n<dt>סגור</dt><dd>כל יום שלישי, וב-1.1, 1.5 ו-25.12.</dd>\n<dt>קומה 2</dt><dd>ברביעי ובשישי חדרי קומה 2 (ריבלייה 800, סולי 900) נפתחים רק ב-10:30.</dd>\n<dt>כרטיס</dt><dd>‏32 € למי שאינו אזרח האיחוד (כולל ישראלים). מומלץ להזמין שעת כניסה ב-<a href=\"https://ticket.louvre.fr/en\" target=\"_blank\" rel=\"noopener\">ticket.louvre.fr</a>; בין 19.12 ל-4.1 זו חובה. להיזהר מאתרי מכירה חוזרת.</dd>\n<dt>חינם</dt><dd>מתחת לגיל 18. ביום שישי הראשון בחודש אחרי 18:00 (למשל 4.12) הכניסה חינם לכולם.</dd>\n<dt>כניסות</dt><dd>הפירמידה (הראשית). <span class=\"ltr\">Porte des Lions</span>: לבעלי כרטיס בלבד, בדרך כלל התור הקצר ביותר, נסגרת ב-18:00. מעבר ריבלייה: לקבוצות בלבד.</dd>\n<dt>תחבורה</dt><dd>מטרו <span class=\"ltr\">Palais-Royal / Musée du Louvre</span> (קווים 1, 7), עם גישה תת-קרקעית דרך הקרוסל.</dd>\n<dt>תיקים</dt><dd>לוקרים חינם מתחת לפירמידה (עד ‎55×35×20 ס\"מ). מזוודות אסורות.</dd>\n<dt>צילום</dt><dd>מותר לשימוש אישי, בלי פלאש ובלי מקל סלפי.</dd>\n<dt>אוכל</dt><dd>Café Mollien (דנון 1, ליד חדר 700), Café Richelieu-Angelina (ריבלייה 1), בתי הקפה באולם נפוליאון.</dd>\n<dt>אודיוגייד</dt><dd>‏6 € ובלי עברית. אין אפליקציית ביקור רשמית; יש <a href=\"https://collections.louvre.fr/plan\" target=\"_blank\" rel=\"noopener\">מפה אינטראקטיבית</a>.</dd>\n</dl>\n<h3>סגור עכשיו (לפי אתר הלובר, 21.11.2026)</h3>\n<ul>\n<li>אמנות האסלאם (דנון ‎-1/‎-2), עתיקות רומיות (דנון 0), גלריית קמפאנה (סולי 1), גלריית מדיצ'י של רובנס (ריבלייה 2), הציור הספרדי 720–734, חדרים 400–402.</li>\n<li>חדר 709 סגור עד סוף נובמבר. <b>חדר 700</b> (רפסודת המדוזה, החירות) סגור 1–15 בדצמבר.</li>\n<li>גלריית אפולו (705) נפתחה מחדש ביולי 2026, אבל תכשיטי הכתר לא מוצגים מאז השוד באוקטובר 2025. אפשר להציץ בה בדרך מהניקה (703).</li>\n<li>המונה ליזה עדיין בחדר 711. ההעבר record: 'non exposé'. Was in the Schongauer exhibition (Sully room 130) until 20 Jul 2026.</li><li>דיוקן עצמי עם קוץ (דירר) – <a href=\"https://collections.louvre.fr/ark:/53355/cl010065609\" target=\"_blank\" rel=\"noopener\">Louvre</a>: Collection record: 'non exposé'.</li></ul>\n<h3>רקע: המקרא בלובר</h3>\n<p><b>המזרח הקדום (ריבלייה וסולי 0):</b> חמורבי (המאה ה-18 לפנה\"ס) ומשפט \"עין תחת עין\"; סרגון השני, שכבש את שומרון (ישעיהו כ); תגלת-פלאסר השלישי, שהגלה את צפון ישראל (מלכים ב טו); מישע מלך מואב (מלכים ב ג) – המצבה עם השם יהוה ואולי \"בית דוד\".</p>\n<p><b>פרס:</b> ארמון דריווש בשושן – הרקע לסיפורי אסתר, נחמיה (\"ואני הייתי בשושן הבירה\") ודניאל.</p>\n<p><b>מצרים:</b> שישק (הספינקס של טניס), רעמסס השני ופיתום ורעמסס, תהרקה מלך כוש שיצא נגד סנחריב (מלכים ב יט:9).</p>\n<p><b>הברית החדשה בציור:</b> החתונה בקנה (יוחנן ב), יוחנן המטביל, הצליבה וההובלה לקבר, הסעודה באמאוס (לוקס כד), מות הבתולה.</p>\n<p><b>התנ\"ך בציור:</b> בת שבע של רמברנדט (שמואל ב יא), ארבע העונות של פוסן (גן עדן, רות ובועז, אשכול המרגלים, המבול), משפט שלמה, המן במדבר, אליעזר ורבקה.</p>\n<p><b>נפוליאון וארץ ישראל:</b> \"בונפרטה מבקר את חולי המגפה ביפו\" (חדר 700) – תעמולה על המצור על יפו ב-1799.</p>\n<h3>הסתייגויות</h3>\n<ul><li>מספרי החדרים והסטטוס לקוחים מרשומת כל פריט באתר האוסף של הלובר. הסיכות על המפה מסמנות את אזור החדר בקירוב.</li><li>המפה: תוכנית המוזיאון הרשמית, מאי 2026 (Dream On / Service de la médiation graphique et numérique, musée du Louvre), לשימוש אישי.</li><li>הקשרים המקראיים לפי הדעה המחקרית המקובלת. הקריאה \"בית דוד\" במצבת מישע שנויה במחלוקת.</li></ul>\n</div>";

let prefs=Object.assign({apple:false,spotify:false},LS.get('lv-prefs',{}));
const isApple=([lb,u])=>/podcasts\.apple\.com/.test(u), isSpot=([lb,u])=>/spotify\.com/.test(u);
const shownListen=p=>p.listen.filter(l=>(prefs.apple||!isApple(l))&&(prefs.spotify||!isSpot(l)));
const openPanels=new Set();

const $=s=>document.querySelector(s);

const route=()=>ROUTES[routeKey].filter(r=>!r.lunch);
const stopDone=id=>STOPS[id].items.every(i=>seen.has(i));
const stopProg=id=>STOPS[id].items.filter(i=>seen.has(i)).length;

const routeIdx=id=>route().findIndex(r=>r[0]===id);

/* Paris time & gallery status (louvre.fr, 21.11.2026): 9:00–18:00, Wed/Fri to 21:00, closed Tuesday; level 2 opens 10:30 on Wed/Fri */
function paris(){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {wd:p.weekday,min:(+p.hour)*60+(+p.minute),hm:p.hour+':'+p.minute,ymd:`${p.year}-${p.month}-${p.day}`};
}
const lateDay=L=>L.wd==='Wed'||L.wd==='Fri';
function museumOpen(L){if(L.wd==='Tue')return false;const close=lateDay(L)?21*60:18*60;return L.min>=540&&L.min<close}
function closedNow(s,L){return (s.closed||[]).find(([from,to])=>L.ymd>=from&&L.ymd<=to)}
const dm=d=>d.slice(8).replace(/^0/,'')+'.'+d.slice(5,7).replace(/^0/,'');
function status(id){
  const s=STOPS[id],L=paris();
  const c=closedNow(s,L); if(c) return {cls:'bad',t:`סגור עד ${dm(c[1])}`};
  if(!museumOpen(L)) return null;
  if(s.floor===2&&lateDay(L)&&L.min<630) return {cls:'bad',t:'קומה 2 נפתחת ב-10:30'};
  return null;
}
function limitChip(id){const s=STOPS[id];return (s.closed||[]).map(([f,t,why])=>`<span class="chip info">${esc(why)}: ${dm(f)}–${dm(t)}</span>`).join('')}
const LEVEL_NAME={'-1':'מפלס ‎-1','0':'קומה 0','1':'קומה 1','2':'קומה 2'};

/* ---------- render ---------- */
function renderClock(){
  const L=paris();
  $('#clock').textContent=`פריז ${L.hm}${museumOpen(L)?'':' · המוזיאון סגור'}`;
  const a=[];
  if(L.wd==='Tue') a.push('היום יום שלישי: הלובר סגור.');
  if(lateDay(L)) a.push('היום פתוח עד 21:00. חדרי קומה 2 (ריבלייה 800, סולי 900) נפתחים רק ב-10:30.');
  if(L.ymd>='2026-12-19'&&L.ymd<='2027-01-04') a.push('19.12–4.1: חובה להזמין כרטיס עם שעת כניסה מראש.');
  route().forEach(([id])=>{const c=closedNow(STOPS[id],L);if(c)a.push(`${STOPS[id].title}: ${c[2]} עד ${dm(c[1])}.`)});
  $('#alert').innerHTML=a.map(t=>`<div class="alert glass">${I.warn}<span>${esc(t)}</span></div>`).join('');
}

function renderMap(){
  const P=PLAN[floor],svg=$('#map'),[vx,vy,vw,vh]=P.vb;
  svg.setAttribute('viewBox',P.vb.join(' '));
  const r=route(), nx=nextStop(), L=paris();
  let h=`<image href="${P.img}" x="0" y="0" width="${P.w}" height="${P.h}"/>`;
  const pts=[];
  r.forEach(([id],i)=>{const s=STOPS[id];if(s.floor===floor)pts.push({id,i,c:s.pos})});
  Object.entries(STOPS).forEach(([id,s])=>{if(s.floor!==floor||routeIdx(id)<0)return;
    const cl=['zone'];if(stopDone(id))cl.push('done');if(closedNow(s,L))cl.push('closed');
    h+=`<circle class="${cl.join(' ')}" data-stop="${id}" cx="${s.pos[0]}" cy="${s.pos[1]}" r="24"><title>${esc(s.title)}</title></circle>`});
  for(let k=1;k<pts.length;k++) if(pts[k].i===pts[k-1].i+1) h+=`<line class="route" x1="${pts[k-1].c[0]}" y1="${pts[k-1].c[1]}" x2="${pts[k].c[0]}" y2="${pts[k].c[1]}"/>`;
  pts.forEach(({id,i,c})=>{const cl=['pin'];if(stopDone(id))cl.push('done');else if(id===nx)cl.push('next');
    h+=`<g class="${cl.join(' ')}" data-stop="${id}"><circle cx="${c[0]}" cy="${c[1]-26}" r="14"/><text x="${c[0]}" y="${c[1]-26}">${i+1}</text></g>`});
  svg.innerHTML=h;
  const focus=(pts.find(p=>p.id===nx)||pts[0]);
  if(focus){const sc=$('#mapscroll'),k=960/vw;cancelAnimationFrame(renderMap.raf);renderMap.raf=requestAnimationFrame(()=>{sc.scrollLeft=Math.max(0,(focus.c[0]-vx)*k-sc.clientWidth/2)})}
}

function renderList(){
  const r=ROUTES[routeKey], nx=nextStop();
  let h='', lastFloor=null, n=0;
  const total=route().reduce((a,[id])=>a+STOPS[id].items.length,0), done=route().reduce((a,[id])=>a+stopProg(id),0);
  $('#progTtl').textContent=`המסלול · ${done}/${total} פריטים נראו`;

    if(e.lunch){h+=`<div class="lunch glass">${I.food}<div><b>${e.lunch}</b> · ${esc(e.txt)}</div></div>`;return}
    const [id,t,m]=e, s=STOPS[id]; n++;
    if(s.floor!==lastFloor){h+=`<div class="secttl">${LEVEL_NAME[s.floor]} · ${esc(s.wing)}</div>`;lastFloor=s.floor}
    const st=status(id), d=stopDone(id);
    h+=`<button class="stop glass${d?' done':''}${id===nx?' next':''}" data-stop="${id}">
      <span class="num">${d?I.check.replace('<svg','<svg width="18" height="18"'):n}</span>

        <span class="peek">${s.items.map(i=>esc(ITEMS[i].t)).join(' · ')}</span>

  else{fab.hidden=false;fab.innerHTML=`<span class="num" style="background:var(--ok)">${I.check.replace('<svg','<svg width="18" height="18"')}</span><span class="txt"><small>סיימתם את המסלול</small><span>כל הכבוד</span></span>`;fab.dataset.stop=''}
}
const PODS_COUNT={};Object.entries(STOPS).forEach(([id,s])=>PODS_COUNT[id]=s.items.reduce((a,i)=>a+(PODS[i]||[]).length,0));

function linkHtml([label,url],pri){return `<a class="lk${pri?' pri':''}" href="${esc(url)}" target="_blank" rel="noopener"><span dir="auto">${esc(label)}</span>${I.ext}</a>`}

function itemHtml(k){
  const it=ITEMS[k], on=seen.has(k), ps=PODS[k]||[];
  const hasInfo=!!(it.more||it.ext||it.rules);
  const pOpen=openPanels.has(k+':pods'), iOpen=openPanels.has(k+':info');
  const info=hasInfo?[
    it.more?`<div class="h4">תקציר בעברית</div><ul class="plain">${it.more.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="src">מקור: ${esc(it.msrc)}</div>`:'',
    it.ext?`<div class="h4">${esc(it.ext.title)}</div><ol class="ext">${it.ext.parts.map(x=>`<li><b>${esc(x.t)}.</b> ${esc(x.p)}${x.link?` <i>${esc(x.link)}</i>`:''}<div class="links" style="margin-top:4px"><a class="lk" href="${esc(it.ext.url+frag(x.q))}" target="_blank" rel="noopener">${I.doc}לקטע בטקסט</a>${x.yt?`<a class="lk pri" href="https://www.youtube.com/watch?v=${x.yt[0]}&t=${x.yt[1]}s" target="_blank" rel="noopener">${I.play}YouTube · מ-${fmt(x.yt[1])}</a>`:''}</div></li>`).join('')}</ol>`:'',
    it.rules?`<div class="h4">חוקי המשחק</div><p class="small">${esc(it.rules.intro)}</p><ol class="plain">${it.rules.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''
  ].join(''):'';
  return `<article class="item${on?' seen':''}">
    <div class="hd">
      <button class="check" role="checkbox" aria-checked="${on}" data-item="${k}" aria-label="ראיתי: ${esc(it.t)}"><span>${I.check}</span></button>
      <div class="t"><h3>${esc(it.t)}</h3>
        <div class="sub">${it.sub.map(x=>`<span dir="auto">${esc(x)}</span>`).join('<span>·</span>')}${it.star?'<span class="chip star">★ חובה לראות</span>':''}${it.warn?'<span class="chip bad">⚠ מיקום לא אומת</span>':''}${it.off?'<span class="chip bad">לא מוצג כרגע</span>':''}</div></div>
    </div>
    ${it.note?`<div class="note">${I.warn}<span>${esc(it.note)}</span></div>`:''}
    <p>${esc(it.p)}</p>
    ${it.b?`<div class="bible"><b>מקרא:</b> ${esc(it.b)}</div>`:''}
    <div class="links">${it.l.map(l=>linkHtml(l)).join('')}${ps.length?`<button class="lk tg${pOpen?' on':''}" data-panel="${k}:pods" aria-expanded="${pOpen}">${I.head}האזנה ותמלולים (${ps.length})</button>`:''}${hasInfo?`<button class="lk tg${iOpen?' on':''}" data-panel="${k}:info" aria-expanded="${iOpen}">${I.doc}מידע נוסף</button>`:''}</div>
    ${ps.length?`<div class="panel pods" ${pOpen?'':'hidden'} data-for="${k}:pods">${ps.map(podHtml).join('')}</div>`:''}
    ${hasInfo?`<div class="panel info" ${iOpen?'':'hidden'} data-for="${k}:info">${info}</div>`:''}
  </article>`;
}
/* Spotify: a search for the episode (opens the Spotify app); skipped for videos and when a direct Spotify link exists */
const SHOW_FULL={'100 Objects':'A History of the World in 100 Objects'};
function spotifyUrl(p){
  if(p.sp) return p.t?`${p.sp}?t=${p.t}`:p.sp;
  if(p.listen.some(([,u])=>/youtube\.com|ted\.com|spotify\.com/.test(u))) return null;
  const clean=x=>x.replace(/#[\d–-]+/g,'').replace(/\([^)]*\)/g,'').replace(/⚠️?/g,'').trim();
  const show=clean(p.show); const q=`${SHOW_FULL[show]||show} ${clean(p.ep)}`.replace(/\s+/g,' ');
  return 'https://open.spotify.com/search/'+encodeURIComponent(q);
}
/* Hebrew transcript: Google Translate of the English transcript page */
const heUrl=u=>'https://translate.google.com/translate?sl=en&tl=iw&u='+encodeURIComponent(u);
const fmt=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=String(t%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const frag=q=>'#:~:text='+encodeURIComponent(q).replace(/-/g,'%2D');
const ytSec=(l,p)=>/youtube\.com\/watch/.test(l[1])?(l[2]!=null?l[2]:(p.ytT!=null?p.ytT:null)):null;
function podHtml(p){
  const sp=(prefs.spotify||!shownListen(p).length)?spotifyUrl(p):null, heTr=p.tr&&p.l==='EN'?heUrl(p.tr[1]):null;
  return `<div class="pod">
    <div class="hd"><span class="lang">${p.l}</span><div class="ttl"><bdi>${esc(p.show)}</bdi> · <span class="ep"><bdi>${esc(p.ep)}</bdi></span></div></div>
    <div class="m">${p.len?`<span>⏱ <span dir="auto">${esc(p.len)}</span></span>`:''}${p.at?`<span class="chip star">מאיפה: ${esc(p.at)}</span>`:''}</div>
    ${p.cue?`<div class="bible"><b>להקשיב למשפט:</b> ${esc(p.cue)}</div>`:''}
    <p>${esc(p.sum)}</p>
    ${p.elab?`<details class="more"><summary>תקציר מורחב</summary><ul class="elab">${p.elab.map(x=>x.hdr?`<li class="hdr"><b>${esc(x.hdr)}</b></li>`:`<li>${x.tm?(x.vid&&x.sec!=null?`<a class="tm" href="https://www.youtube.com/watch?v=${esc(x.vid)}&t=${x.sec}s" target="_blank" rel="noopener">${esc(x.tm)}</a> `:`<span class="tm">${esc(x.tm)}</span> `):''}${esc(x.txt)}</li>`).join('')}</ul><div class="src">מקור: ${esc(p.esrc||'')}</div></details>`:(p.more&&p.more.length?`<details class="more"><summary>תקציר מורחב</summary><ul>${p.more.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${p.src?`<div class="src">מקור התקציר: ${esc(p.src)}</div>`:''}</details>`:'')}
    <div class="links">${shownListen(p).map(l=>{const sec=ytSec(l,p);return `<a class="lk pri${/youtube/.test(l[1])?' yt':''}" href="${esc(sec?`${l[1]}&t=${sec}s`:l[1])}" target="_blank" rel="noopener">${I.play}<span dir="auto">${esc(l[0])}${sec?` · מ-${fmt(sec)}`:''}</span></a>`}).join('')}${sp?`<a class="lk pri" href="${esc(sp)}" target="_blank" rel="noopener">${I.play}<span>Spotify${p.t?` · מ-${fmt(p.t)}`:''}</span></a>`:''}${p.tr?`<a class="lk" href="${esc(p.tr[1]+(p.trq?frag(p.trq):''))}" target="_blank" rel="noopener">${I.doc}תמלול ${esc(p.tr[0])}${p.trq?' · לקטע':''}</a>`:''}${heTr?`<a class="lk" href="${esc(heTr)}" target="_blank" rel="noopener">${I.doc}תמלול בעברית</a>`:''}</div>
  </div>`;
}

function renderSheet(id){
  const s=STOPS[id], r=route(), i=routeIdx(id), e=i>=0?r[i]:null, st=status(id), d=stopDone(id);
  $('#shNum').innerHTML=`<span class="num" style="${d?'background:var(--ok)':(id===nextStop()?'background:var(--carnelian)':'')}">${i>=0?i+1:'–'}</span>`;
  $('#shTitle').textContent=`${s.title} · ${s.name}`;
  $('#shMeta').innerHTML=`${e?`<span class="ltr">${e[1]}</span><span>· ${e[2]} דק'</span>`:'<span>לא במסלול הזה</span>'}<span>· ${esc(s.wing)}, ${LEVEL_NAME[s.floor]}</span>${st?`<span class="chip ${st.cls}">${esc(st.t)}</span>`:''}${limitChip(id)}`;
  let h=`<div class="way">${I.walk}<span>${esc(s.way)}</span></div>`;
  h+=`<div class="h4">${I.pillar}פריטים בחדר (${stopProg(id)}/${s.items.length})</div>`;
  h+=s.items.map(itemHtml).join('');
  $('#shBody').innerHTML=h;
  const prev=i>0?r[i-1][0]:null, next=i>=0&&i<r.length-1?r[i+1][0]:null;
  $('#shFoot').innerHTML=`<button class="glass" ${prev?`data-go="${prev}"`:'disabled'}><span>→ הקודם</span><small>${prev?esc(STOPS[prev].title):''}</small></button>
    <button class="nx" ${next?`data-go="${next}"`:'disabled'}><span>הבא ←</span><small>${next?esc(STOPS[next].title+' · '+STOPS[next].name):'סוף המסלול'}</small></button>`;
}

function renderPrefs(){
  $('#shNum').innerHTML='';
  $('#shTitle').textContent='הגדרות';
  $('#shMeta').innerHTML='<span>נשמר בטלפון הזה</span>';
  $('#shBody').innerHTML=`<div style="display:flex;flex-direction:column;gap:10px"><label class="pref glass"><span class="t"><b>קישורי Apple Podcasts</b><small>הצגת כפתורי Apple ליד כל פרק. באנדרואיד הם לא קופצים לדקה הנכונה.</small></span><input type="checkbox" id="pref-apple" role="switch" ${prefs.apple?'checked':''}></label><label class="pref glass"><span class="t"><b>קישורי Spotify</b><small>הצגת כפתורי Spotify. Spotify לא תמיד קופץ לדקה הנכונה; YouTube כן.</small></span><input type="checkbox" id="pref-spotify" role="switch" ${prefs.spotify?'checked':''}></label></div>`;
  $('#pref-spotify').onchange=e=>{prefs.spotify=e.target.checked;LS.set('lv-prefs',prefs)};
  $('#shFoot').innerHTML=`<button class="nx" data-close="1"><span>סיום</span></button>`;
  $('#pref-apple').onchange=e=>{prefs.apple=e.target.checked;LS.set('lv-prefs',prefs)};
}
function renderInfo(){
  $('#shNum').innerHTML='';
  $('#shTitle').textContent='מידע מעשי, רקע ופלייליסט';
  $('#shMeta').innerHTML='<span>מידע מעשי, נכון ל-21.11.2026</span>';
  $('#shBody').innerHTML=INFO_HTML;
  $('#shFoot').innerHTML=`<button class="nx" data-close="1"><span>חזרה למפה</span></button>`;
}

/* ---------- sheet open/close via hash (Android back button closes it) ---------- */
function openFromHash(){
  const h=location.hash.slice(1);
  const sheet=$('#sheet');
  if(h==='info'||h==='prefs'||STOPS[h]){
    openId=h;
    if(h==='info')renderInfo();else if(h==='prefs')renderPrefs();else{renderSheet(h);if(STOPS[h].floor!==floor)setFloor(STOPS[h].floor)}
    sheet.hidden=false;requestAnimationFrame(()=>{if(openId!==h)return;sheet.classList.add('on');$('#scrim').classList.add('on')});
    $('#shBody').scrollTop=0;
    $('#shClose').focus({preventScroll:true});
  }else if(openId){
    openId=null;sheet.classList.remove('on');$('#scrim').classList.remove('on');
    setTimeout(()=>{if(!openId)sheet.hidden=true},380);
  }
}
const go=id=>{location.hash=id};
const close=()=>{if(location.hash){history.length>1&&openId?location.hash='':location.hash='';}};

function setFloor(f){floor=f;document.querySelectorAll('#floors button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.floor===f));renderMap()}
function setRoute(k){routeKey=k;LS.set('lv-route',k);$('#rt-full').setAttribute('aria-pressed',k==='full');$('#rt-short').setAttribute('aria-pressed',k==='short');renderAll()}
function renderAll(){renderClock();renderMap();renderList();if(STOPS[openId])renderSheet(openId)}

document.addEventListener('click',e=>{
  const c=e.target.closest('[data-item]');
  if(c){const k=c.dataset.item;seen.has(k)?seen.delete(k):seen.add(k);LS.set('lv-seen',[...seen]);
    const sc=$('#shBody').scrollTop;renderAll();$('#shBody').scrollTop=sc;return}
  const tg=e.target.closest('[data-panel]');
  if(tg){const id=tg.dataset.panel, open=!openPanels.has(id);open?openPanels.add(id):openPanels.delete(id);tg.setAttribute('aria-expanded',open);tg.classList.toggle('on',open);const pn=document.querySelector(`[data-for="${id}"]`);if(pn)pn.hidden=!open;return}
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  if(e.target.closest('[data-close]')){close();return}
  const s=e.target.closest('[data-stop]'); if(s&&s.dataset.stop){go(s.dataset.stop);return}
});
$('#scrim').onclick=close; $('#shClose').onclick=close; $('#infoBtn').onclick=()=>go('info'); $('#prefsBtn').onclick=()=>go('prefs');
$('#floors').innerHTML=[2,1,0,-1].map(f=>`<button data-floor="${f}" aria-pressed="false">${LEVEL_NAME[f]}</button>`).join('');
document.querySelectorAll('#floors button').forEach(b=>b.onclick=()=>setFloor(+b.dataset.floor));
$('#rt-full').onclick=()=>setRoute('full'); $('#rt-short').onclick=()=>setRoute('short');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId)close()});
window.addEventListener('hashchange',openFromHash);
// swipe down on the sheet header to close
(()=>{let y0=null;const hd=$('.sh-head'),gr=$('.grab');[hd,gr].forEach(el=>{el.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>70)close();y0=null})})})();

/* ---------- info content ---------- */
/* ---------- boot ---------- */
setRoute(routeKey);
const nx0=nextStop(); setFloor(nx0?STOPS[nx0].floor:1);
openFromHash();
window.addEventListener('load',renderMap);
setInterval(()=>{renderClock();renderList()},60000);
</script>
