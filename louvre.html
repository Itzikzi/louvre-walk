לם. זה אזכור קצר, לא ניתוח מלא.","elab":[{"tm":"3:00","txt":"הכותרת עשויה בפרטים עדינים – אוזניים ותלתלי פרווה – אבל נועדה להפחיד: הכול בארמון נבנה כדי להרשים.","vid":"mjxCTApdX3Q","sec":180},{"tm":"3:08","txt":"לבני הזיגוג של הארמון: גריפונים ושומרים.","vid":"mjxCTApdX3Q","sec":188},{"tm":"3:20","txt":"השומרים מחזיקים חניתות וקשתות כרוכות על הכתף – אפשר לראות את פרטי הלבוש.","vid":"mjxCTApdX3Q","sec":200},{"tm":"3:38","txt":"הצטברות הדימויים בדרך אל המלך נועדה להבהיר את כוחו על חלק עצום מהמזרח הקרוב.","vid":"mjxCTApdX3Q","sec":218}],"esrc":"Smarthistory · כתוביות הסרטון"}],"eshmunazar_sarcophagus":[{"l":"EN","show":"Tony Habboub","ep":"King Eshmunazar Phoenician Inscription, Sidon, 5th century BC","len":"15 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=bTMah9SZ1f4",619]],"tr":null,"at":"מ-10:19 – התרגום לאנגלית (כ-4.5 דק'). לפני כן: קריאה בפיניקית ובצרפתית","sum":"הקראה של הכתובת הפיניקית הארוכה שעל מכסה הארון, ומ-10:19 – תרגום מלא לאנגלית. שומעים את המלך אשמנעזר מקלל את מי שיפתח את קברו, את שושלת מלכי צידון, ואת המשפט שמעניין במיוחד ישראלים: 'אדון המלכים' (מלך פרס) נתן לצידון את דאר ואת יפו, 'ארצות הדגן האדירות אשר בשדה שרון'.","elab":[{"tm":"0:01","txt":"פתיחה: אחת הכתובות הפיניקיות הארוכות שנמצאו בלבנון, על ארון הקבורה של אשמנעזר (מכאן הקריאה בפיניקית ובצרפתית; קפצו ל-10:19).","vid":"bTMah9SZ1f4","sec":1},{"tm":"10:19","txt":"'בחודש בול, בשנת 14 למלכו' – אשמנעזר מלך צידונים, בן המלך תבנית: 'נגזלתי בטרם עתי'.","vid":"bTMah9SZ1f4","sec":619},{"tm":"11:09","txt":"האזהרה: כל מלך או אדם – אל תפתח את משכבי ואל תחפש בו דבר, כי אין בו דבר.","vid":"bTMah9SZ1f4","sec":669},{"tm":"11:57","txt":"הקללה: מי שיפתח – לא יהיה לו משכב עם המתים, לא בן ולא זרע, והאלים הקדושים יסגירו אותו.","vid":"bTMah9SZ1f4","sec":717},{"tm":"12:46","txt":"'יתום בן אלמנה': אמו עמעשתרת, כוהנת עשתרת, ויחד בנו מקדשים לעשתרת ולאשמון.","vid":"bTMah9SZ1f4","sec":766},{"tm":"13:33","txt":"מקדשים לבעל צידון – ו'אדון המלכים' נתן להם את דאר ויפו, 'ארצות הדגן האדירות אשר בשדה שרון'.","vid":"bTMah9SZ1f4","sec":813},{"tm":"14:21","txt":"הקללה חוזרת בסוף: שלא יפתחו ולא יישאו את הארון למקום אחר.","vid":"bTMah9SZ1f4","sec":861}],"esrc":"Tony Habboub · כתוביות הסרטון"}],"venus_de_milo":[{"l":"EN","show":"Vox","ep":"The conspiracy behind this famous statue","len":"5.5 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=gs1VWuQEd7Y",1]],"tr":null,"at":"כל הסרטון (5.5 דק') על ונוס ממילו","sum":"סרטון של Vox שמסביר איך פסל בלי ידיים מאי יווני קטן הפך לאייקון עולמי: מציאתו ב-1820, הנזקים והחלקים החסרים, והמצב של הלובר אחרי שנאלץ להחזיר את שלל נפוליאון. החלק המרתק: הבסיס עם חתימת הפסל תארך אותה לתקופה ההלניסטית, והבסיס הזה 'נעלם' כדי שאפשר יהיה להציג אותה כיצירה קלאסית.","elab":[{"tm":"0:01","txt":"השאלה: איך פסל עתיק בלי ידיים, שאבד באי יווני קטן, הפך לאייקון בינלאומי – וסיפור של כיסוי אפשרי.","vid":"gs1VWuQEd7Y","sec":1},{"tm":"0:35","txt":"הסיפור חבוי בתפר שבאמצע הפסל. ב-1820 איכר יווני מצא את החלקים ומכר אותם לצרפתים בכ-1,000 פרנק.","vid":"gs1VWuQEd7Y","sec":35},{"tm":"1:11","txt":"מה היה חסר: הידיים, תנוכי האוזניים (כנראה נבזזו), כף רגל, ובסיס נפרד (פלינת) שנשבר.","vid":"gs1VWuQEd7Y","sec":71},{"tm":"1:41","txt":"שני החצאים חוברו ביתדות ברזל. גובהה כ-2 מטרים, עם כף רגל של כ-32 ס\"מ.","vid":"gs1VWuQEd7Y","sec":101},{"tm":"2:11","txt":"ההקשר: ויוואן דנון, 'בוזז האמנות' של נפוליאון, מילא את הלובר ביצירות שנלקחו מכל אירופה.","vid":"gs1VWuQEd7Y","sec":131},{"tm":"2:41","txt":"אחרי נפילת נפוליאון הוחזרו היצירות – לאוקון, אפולו בלוודר, ונוס דה מדיצ'י – והלובר נשאר מרוקן ונואש.","vid":"gs1VWuQEd7Y","sec":161},{"tm":"3:14","txt":"ונוס הגיעה חמש שנים אחר כך. לפי ציורים מוקדמים, על הבסיס היה שם הפסל, שתארך אותה ל-130–100 לפנה\"ס – תקופה הלניסטית, לא קלאסית.","vid":"gs1VWuQEd7Y","sec":194},{"tm":"3:50","txt":"הבסיס 'אבד' לפני שהוצגה ב-1821, והלובר התעקש שהיא קלאסית עד 1951. הפרסום שלה הוא תוצאה של קמפיין מיתוג לאומי.","vid":"gs1VWuQEd7Y","sec":230}],"esrc":"Vox · כתוביות הסרטון"}],"hammurabi_code":[{"l":"EN","show":"Smarthistory","ep":"The Law Code Stele of King Hammurabi","len":"3.5 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=JO9YxZYd0qY",0]],"tr":null,"at":"כל הסרטון (3.5 דק') מצולם מול המצבה בלובר","sum":"ד\"ר סטיבן צוקר וד\"ר בת' הריס עומדים מול המצבה בלובר ומסבירים את מבנה הטקסט (פרולוג, חוקים, אפילוג) ואת התבליט שבראשה: חמורבי מקבל את סמלי השלטון מידי שמש, אל השמש והצדק. הם מראים איך החוקים בנויים בנוסח 'אם... אז...' ומשווים לעיקרון 'עין תחת עין' שבמקרא.","elab":[{"tm":"0:00","txt":"פתיחה בלובר: אחד הפריטים האהובים במוזיאון, כמעט 4,000 שנה, מסמך יסוד של חוק כתוב.","vid":"JO9YxZYd0qY","sec":0},{"tm":"0:26","txt":"מהי מצבה (סטלה): תבליט בראש, ומתחתיו ומכל הצדדים כתב יתדות בשפה האכדית. הטקסט מחולק לפרולוג, לחוקים ולאפילוג.","vid":"JO9YxZYd0qY","sec":26},{"tm":"0:51","txt":"התבליט: חמורבי הקטן משמאל, מולו שמש אל השמש והצדק – עם קרני אור שיוצאות מכתפיו, מעין 'הילה'. כתפיים בחזית ופנים בפרופיל, כמו באמנות מצרית.","vid":"JO9YxZYd0qY","sec":51},{"tm":"1:16","txt":"שמש יושב על כס ותחת רגליו ההרים שמהם הוא זורח; הוא מושיט למלך סמלי שלטון – מסר שהחוקים באים בסמכות אלוהית.","vid":"JO9YxZYd0qY","sec":76},{"tm":"1:41","txt":"החוקים כנראה לא חוברו בידי המלך אלא לוקטו מפסקי דין, בנוסח 'אם... אז...'. דוגמה: בנאי שבנה בית שקרס והרג את בעליו – יומת.","vid":"JO9YxZYd0qY","sec":101},{"tm":"2:07","txt":"עקרון השקילות מזכיר את 'עין תחת עין, שן תחת שן'. באפילוג המלך מבקש שייזכר לדורות.","vid":"JO9YxZYd0qY","sec":127},{"tm":"2:34","txt":"המצבה נמצאה שבורה לשלושה חלקים. החוקים חושפים את החברה הבבלית: השקיה, חקלאות ונקודות חיכוך חברתיות.","vid":"JO9YxZYd0qY","sec":154},{"tm":"3:00","txt":"סיכום: תזכורת לכך שמסופוטמיה הייתה תרבות מתקדמת, שתלויה ביבולים ונזקקה לחוקים כדי לתפקד.","vid":"JO9YxZYd0qY","sec":180}],"esrc":"Smarthistory · כתוביות הסרטון"}],"naram_sin_stele":[{"l":"EN","show":"Smarthistory","ep":"Victory Stele of Naram-Sin","len":"3.4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=OY79AuGZDNI",3]],"tr":null,"at":"כל הסרטון (3.5 דק') מול המצבה בלובר","sum":"צוקר והריס מסבירים איך מצבת נרם-סין שוברת את המוסכמה של סצנות ניצחון ברצועות: כאן יש סצנה אחת רציפה של צבא שמטפס בהר. כל המבטים מופנים אל המלך הענק, שחובש קסדת קרניים – סמל לאלוהות – ומציג את עצמו כאל.","elab":[{"tm":"0:03","txt":"מצבה בת 4,200 שנה. נרם-סין היה נכדו של סרגון מייסד ממלכת אכד, והמצבה מנציחה ניצחון על עם הררי במזרח.","vid":"OY79AuGZDNI","sec":3},{"tm":"0:31","txt":"בדרך כלל סצנות ניצחון מסודרות ברצועות אופקיות; כאן האמן יצר נוף אחד שבו הצבא עולה במעלה ההר.","vid":"OY79AuGZDNI","sec":31},{"tm":"0:56","txt":"משמאל חייליו של נרם-סין בטורים מסודרים עם נושאי נס; מימין האויבים המובסים והפצועים, בלי סדר.","vid":"OY79AuGZDNI","sec":56},{"tm":"1:24","txt":"המלך גדול מכולם, וכל המבטים – של חייליו ושל האויבים – מופנים אליו. הוא מוקד הקומפוזיציה.","vid":"OY79AuGZDNI","sec":84},{"tm":"1:50","txt":"פרטי המובסים: אחד נופל מצוק, אחר עם חנית בצווארו, ואחד מסתובב ומתחנן על חייו.","vid":"OY79AuGZDNI","sec":110},{"tm":"2:17","txt":"זו שפה סמלית ולא תיעוד של קרב: המלך בכתפיים חזיתיות, קרוב לגרמי השמיים שבראש ההר.","vid":"OY79AuGZDNI","sec":137},{"tm":"2:44","txt":"קסדת הקרניים היא סמל של אל – נרם-סין מציג את עצמו כאלוהי, עולה אל השמיים.","vid":"OY79AuGZDNI","sec":164}],"esrc":"Smarthistory · כתוביות הסרטון"}],"gudea_architect":[{"l":"EN","show":"Smarthistory","ep":"Seated Gudea holding temple plan","len":"5.2 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=HBjYUTYas9E",0]],"tr":null,"at":"כל הסרטון (5 דק') באולם גודאה בלובר","sum":"צוקר והריס מסבירים את הפסל של גודאה, שליט לגש, שמחזיק על ברכיו תוכנית של מקדש. הם קוראים מתוך הכתובת שעל הפסל, שבה גודאה מתעקש על דיוריט בלבד, ומזהים על הלוח את הקירות, השערים, החרט וסרגל המדידה.","elab":[{"tm":"0:00","txt":"אולם מלא פסלי דיוריט של גודאה, בני 4,000 שנה. לפסל הזה חסרים הראש וחלק מהברך, אבל הוא ייחודי: על ברכיו לוח עם תוכנית של מקדש.","vid":"HBjYUTYas9E","sec":0},{"tm":"0:30","txt":"גודאה שלט בעיר-המדינה לגש שבשומר, בתקופה הניאו-שומרית.","vid":"HBjYUTYas9E","sec":30},{"tm":"1:00","txt":"אחרי נפילת אכד בידי שבטים מההרים חזרו השומרים לשלוט. כתב יתדות מכסה את הפסל, גם את הגב.","vid":"HBjYUTYas9E","sec":60},{"tm":"1:30","txt":"הכתובת: הפסל עשוי דיוריט קשה ומיובא, ואסור שיהיו בו כסף, לפיס לזולי, נחושת או ברונזה – אולי כביטוי של ענווה.","vid":"HBjYUTYas9E","sec":90},{"tm":"2:01","txt":"הידיים שלובות והרגליים צמודות: הפסלים 'עמדו בתפילה' במקדש במקום השליט.","vid":"HBjYUTYas9E","sec":121},{"tm":"2:32","txt":"גודאה בנה מקדשים, בהם מקדש לנינגירסו בעיר גירסו – אולי זו התוכנית שעל ברכיו.","vid":"HBjYUTYas9E","sec":152},{"tm":"3:03","txt":"על הלוח: חומות עם ביצורים ושערים, לצידם חרט וסרגל מדידה עם שנתות.","vid":"HBjYUTYas9E","sec":183},{"tm":"3:34","txt":"בלי חלקים בולטים – נבנה לנצח. גודאה תמיד יחף, חובש כובע צמר, ופניו מגולחות. בסוף: פסל קטן שלו עם כד שממנו זורמים מים ודגים.","vid":"HBjYUTYas9E","sec":214}],"esrc":"Smarthistory · כתוביות הסרטון"}],"lamassu_khorsabad":[{"l":"EN","show":"Smarthistory","ep":"Lamassu from the citadel of Sargon II","len":"5.2 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=2GrvBLKaRSI",20]],"tr":null,"at":"מ-0:20 (\"אנחנו באולם בלובר\") ועד הסוף","sum":"צוקר והריס עומדים בחצר ח'ורסבאד בלובר ומסבירים את תפקיד הלמאסו כשומרי שערי העיר והארמון של סרגון השני. הם מתעכבים על הכתר, הזקן והכנפיים, ועל ה'טריק' של חמש הרגליים: מלפנים היצור עומד, ומהצד הוא צועד.","elab":[{"tm":"0:20","txt":"באולם בלובר עם פסלים מארמון סרגון השני, המאה ה-8 לפנה\"ס – ח'ורסבאד שבעיראק של היום.","vid":"2GrvBLKaRSI","sec":20},{"tm":"1:02","txt":"שומרי השערים של העיר והארמון: ראש אדם, גוף שור וכנפיים. כנראה נקראו 'למאסו', ואולי גם מייצגים את כוח המלך.","vid":"2GrvBLKaRSI","sec":62},{"tm":"1:33","txt":"כל אחד חצוב מגוש אבן אחד. תבליטים בארמון מראים איך גררו אותם למקומם; הם גם נשאו קשתות ענק.","vid":"2GrvBLKaRSI","sec":93},{"tm":"2:03","txt":"הלמאסו הזה כנראה עמד בשער החיצוני של העיר. הכתר מעוטר בקרניים ובנוצות.","vid":"2GrvBLKaRSI","sec":123},{"tm":"2:33","txt":"הפנים: גבות מחוברות, אוזני שור עם עגילים מפוארים, וזקן של תלתלים וספירלות.","vid":"2GrvBLKaRSI","sec":153},{"tm":"3:04","txt":"כנפיים מעוטרות לאורך הגוף, וכתובת יתדות בין הרגליים – עם קללות על מי שיפגע במצודה.","vid":"2GrvBLKaRSI","sec":184},{"tm":"3:35","txt":"חמש רגליים: מלפנים היצור עומד יציב, ומהצד הוא צועד. כשעוברים בשער – הוא 'זז'.","vid":"2GrvBLKaRSI","sec":215},{"tm":"4:06","txt":"השילוב בין טבעיות (שרירים, עורקים) לבין קישוטיות – ביטוי לעוצמת האימפריה האשורית.","vid":"2GrvBLKaRSI","sec":246}],"esrc":"Smarthistory · כתוביות הסרטון"}],"sargon_dignitary":[{"l":"EN","show":"Associates for Biblical Research – Digging for Truth","ep":"King Sargon II of Assyria (Episode 299)","len":"27 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=cZiCNMo-xaE",86]],"tr":null,"at":"מ-1:26 ועד 24:50","sum":"פרק על סרגון השני – המלך שבתבליט מח'ורסבאד: מלך שהמקרא מזכיר פעם אחת בלבד (ישעיהו כ' א'), ועד שנחפרה הבירה שלו דור-שרוכין לא היה מוכר מחוץ למקרא. בפרק: בניית הבירה, החפירות הצרפתיות והלמאסו, המצור על אשדוד ושאלת כיבוש שומרון.","elab":[{"tm":"1:26","txt":"ישעיהו כ' א': סרגון כובש את אשדוד – האזכור היחיד שלו במקרא. במשך דורות הוא לא היה מוכר מחוץ למקרא.","vid":"cZiCNMo-xaE","sec":86},{"tm":"2:30","txt":"הבירה שלו נמצאה בח'ורסבאד, והיום יודעים עליו יותר מעל רוב מלכי אשור.","vid":"cZiCNMo-xaE","sec":150},{"tm":"4:35","txt":"ארמון, עיר בירה, העתקים של דברי הימים שלו על קירות הארמון ואלפי לוחות יתדות.","vid":"cZiCNMo-xaE","sec":275},{"tm":"7:51","txt":"הבירה החדשה דור-שרוכין, צפונית-מזרחית לנינוה: חומות ושמונה שערים. כנראה לא הושלמה לפני מותו.","vid":"cZiCNMo-xaE","sec":471},{"tm":"11:06","txt":"החפירות במאה ה-19 ואחר כך ב-1928 וב-1957; תמונות מהחפירה מראות את הלמאסו עדיין במקומם בשערים.","vid":"cZiCNMo-xaE","sec":666},{"tm":"13:12","txt":"המצור על אשדוד: כתובת סרגון על עזורי מלך אשדוד שמרד; באשדוד נמצאו קטעי מצבת ניצחון ושכבת חורבן.","vid":"cZiCNMo-xaE","sec":792},{"tm":"18:32","txt":"נפילת שומרון ב-722: המקרא מייחס אותה לשלמנאסר, וסרגון לוקח את הקרדיט בכתובותיו – והפתרון המוצע.","vid":"cZiCNMo-xaE","sec":1112},{"tm":"23:44","txt":"סרגון מת בשדה הקרב וגופתו לא נקברה – ובנו סנחריב ראה בכך קללה.","vid":"cZiCNMo-xaE","sec":1424}],"esrc":"Associates for Biblical Research – Digging for Truth · כתוביות הסרטון"}],"tiglath_pileser3":[{"l":"EN","show":"Associates for Biblical Research – Digging for Truth","ep":"King Tiglath-Pileser III of Assyria (Episode 121)","len":"26 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=rO-ZuFCk-PI",126]],"tr":null,"at":"מ-2:06 ועד 22:15 (בסוף – דרשה)","sum":"פרק על המלך שבתבליט, לא על התבליט בלובר עצמו: מי היה תגלת-פלאסר השלישי ('פול'), איך עלה לשלטון ב-745 לפנה\"ס והפך את אשור לאימפריה, ומה מספרות הכתובות שלו על מנחם, אחז והושע – מול מלכים ב' ודברי הימים. נקודת מבט שמרנית-דתית.","elab":[{"tm":"2:06","txt":"שמו המקורי כנראה פול (פולו). ב-745 לפנה\"ס, כמושל כלח, תפס את כס המלוכה בהפיכה.","vid":"rO-ZuFCk-PI","sec":126},{"tm":"3:09","txt":"איחד את אשור ובבל, ועד מותו ב-727 הפך את אשור לאימפריה הגדולה בעולם.","vid":"rO-ZuFCk-PI","sec":189},{"tm":"4:14","txt":"המסעות למערב הביאו אותו למגע עם מלכי ישראל ויהודה.","vid":"rO-ZuFCk-PI","sec":254},{"tm":"5:21","txt":"דברי הימים א' ה' כו: 'רוח פול מלך אשור ורוח תלגת פלנאסר' – הגליית ראובן, גד וחצי המנשה. הכפל בשמות מעיד על היכרות אמיתית.","vid":"rO-ZuFCk-PI","sec":321},{"tm":"9:42","txt":"מנחם מלך ישראל: בכתובות 'כשלג הכרעתיו', ומנחם השומרוני ברשימת 17 מלכי המערב שהעלו לו מס (מלכים ב' טו).","vid":"rO-ZuFCk-PI","sec":582},{"tm":"12:52","txt":"אחז מבקש עזרה (מלכים ב' טז), ו'יהואחז היהודי' מופיע ברשימת המס.","vid":"rO-ZuFCk-PI","sec":772},{"tm":"19:15","txt":"הושע בן אלה: תגלת-פלאסר מתפאר שהוא שהמליך אותו, ו'בית עמרי... הגליתי לאשור'.","vid":"rO-ZuFCk-PI","sec":1155}],"esrc":"Associates for Biblical Research – Digging for Truth · כתוביות הסרטון"}],"babylon_lion":[{"l":"EN","show":"Smarthistory","ep":"Ishtar gate and Processional Way","len":"6.8 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=U2iZ83oIZH0",128]],"tr":null,"at":"מ-2:08 (האריות) ועד 5:40","sum":"הסרטון צולם מול שער אישתר המשוחזר במוזיאון פרגמון בברלין, אבל מ-2:08 מסבירים צוקר והריס בדיוק את האריות של דרך התהלוכה – אותה סדרה שממנה בא האריה בלובר. הם מסבירים את סמליות האריה של אישתר, את טכניקת הלבנים המזוגגות ואת כתובת נבוכדנאצר.","elab":[{"tm":"2:08","txt":"האריות מייצגים את אישתר, אלת המלחמה והאהבה. הם גדולים, הפה פעור – נוהמים.","vid":"U2iZ83oIZH0","sec":128},{"tm":"2:24","txt":"הסידור בשורה גורם להם להיראות מאולפים בידי המלך – הם מעוררים פחד מהמלך עצמו.","vid":"U2iZ83oIZH0","sec":144},{"tm":"2:40","txt":"הלבנים עשויות בתבליט מוגבה ומזוגג. על השער עצמו יש עוד שתי חיות.","vid":"U2iZ83oIZH0","sec":160},{"tm":"3:12","txt":"המושחושו – הדרקון של מרדוך, אל העיר – והשור (אורוכס) של אדד, אל הסערה.","vid":"U2iZ83oIZH0","sec":192},{"tm":"4:13","txt":"במסופוטמיה אין אבן: בנו מלבני חימר, והצבע הכחול המבריק הוא זיגוג שמבוסס על נחושת.","vid":"U2iZ83oIZH0","sec":253},{"tm":"5:13","txt":"ציטוט מכתובת נבוכדנאצר על השער: 'על הקירות... שוורים ודרקונים', לפאר את העיר.","vid":"U2iZ83oIZH0","sec":313}],"esrc":"Smarthistory · כתוביות הסרטון"}],"ebih_il":[{"l":"EN","show":"World of Antiquity","ep":"The Statue of Ebih-Il","len":"39 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=MUpb2l5lWOk",14]],"tr":null,"at":"מ-0:14 – כל הסרטון (38 דק'), רובו ראיון עם אוצרת הלובר","sum":"ראיון עם ד\"ר סופי קלוזן, אוצרת עתיקות המזרח הקדום בלובר: איך בדואים שחפרו קבר גילו את מארי ב-1933, איך אנדרה פארו מצא את הפסלים, מי היה אביח-איל ומה פירוש התואר 'נובנדה'. בסוף היא מסבירה מה מרגש אותה בפסל – המבט ששקוע בשלווה ולא מסתכל עלינו.","elab":[{"tm":"0:14","txt":"הפסל נמצא בשני חלקים בהריסות מקדש בעיר מארי שבסוריה. עשוי בהט ומשובץ צדף, צפחה ולפיס לזולי.","vid":"MUpb2l5lWOk","sec":14},{"tm":"1:24","txt":"מכירים את המרואיינת: סופי קלוזן, ארכאולוגית ואוצרת בלובר.","vid":"MUpb2l5lWOk","sec":84},{"tm":"2:26","txt":"1933: בדואים שחפרו בתל כדי לקבור קרוב משפחה מצאו פסל. הידיעה הגיעה לרנה דוסו בלובר, ששלח את אנדרה פארו לחפור.","vid":"MUpb2l5lWOk","sec":146},{"tm":"6:44","txt":"פארו מוצא ראש עם עיניים כחולות גדולות ומתרגש; הכתובות על הפסלים מגלות שזו העיר מארי.","vid":"MUpb2l5lWOk","sec":404},{"tm":"9:57","txt":"אביח-איל לא היה מלך. הפסל מהתקופה השושלתית הקדומה, לפני עליית אכד (2340 לפנה\"ס).","vid":"MUpb2l5lWOk","sec":597},{"tm":"14:07","txt":"התואר 'נובנדה' – קריאה חדשה: תפקיד בכיר, אולי צבאי, דתי או מנהלי. גוש בהט כזה היה נדיר ומעיד על מעמדו.","vid":"MUpb2l5lWOk","sec":847},{"tm":"25:55","txt":"הפסל יושב – דבר נדיר מאוד; בדרך כלל גברים מוצגים עומדים.","vid":"MUpb2l5lWOk","sec":1555},{"tm":"28:01","txt":"שמו פירושו 'אביח הוא אל' – אביח הוא הר רחוק מצפון-מזרח למארי, אולי הוא היה זר. בהמשך (33:26) האוצרת מסבירה את המבט השלו שעובר דרכנו, ובסוף (37:45) – החצאית המצויצת.","vid":"MUpb2l5lWOk","sec":1681}],"esrc":"World of Antiquity · כתוביות הסרטון"}],"stele_vultures":[{"l":"EN","show":"Art History 101","ep":"Stele of the Vultures","len":"4.2 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=Co_swSTJyfI",0]],"tr":null,"at":"כל הסרטון (4 דק')","sum":"סרטון קצר שמציג את מצבת העיטים כאחת מיצירות התעמולה הפוליטית הראשונות באמנות: היררכיה של גודל, אויבים עירומים כלואים ברשת, וצבא שצועד על גופות. בחצי השני המרצה מרחיב על דה-הומניזציה של האויב, עם השוואות למלחמות מודרניות.","elab":[{"tm":"0:00","txt":"'אחת מיצירות התעמולה הפוליטית הראשונות' – נושאה מלחמה, ומה שרואים הוא שחזור מכמה שברים.","vid":"Co_swSTJyfI","sec":0},{"tm":"0:33","txt":"היסטוריה חזותית בחברה שבה פחות מ-5% ידעו קרוא וכתוב: השליט כבש עיר-מדינה שכנה.","vid":"Co_swSTJyfI","sec":33},{"tm":"1:04","txt":"היררכיה של גודל: השליט ענק לעומת השבויים ברשת; מאחוריו דמות קטנה יותר, אולי מפקד.","vid":"Co_swSTJyfI","sec":64},{"tm":"1:36","txt":"השבויים עירומים – בעולם העתיק עירום סימן ברבריות.","vid":"Co_swSTJyfI","sec":96},{"tm":"2:12","txt":"הצבא הכובש צועד על גופות האויבים – מטאפורה חזותית שנועדה להשפיל ולעשות דה-הומניזציה.","vid":"Co_swSTJyfI","sec":132},{"tm":"3:54","txt":"סיכום: כל היצירה היא הנצחה ותעמולה של כוח השליט.","vid":"Co_swSTJyfI","sec":234}],"esrc":"Art History 101 · כתוביות הסרטון"}],"seated_scribe":[{"l":"EN","show":"Smarthistory","ep":"The Seated Scribe","len":"3.5 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=IKkcop-dlUY",0]],"tr":null,"at":"כל הסרטון (3.5 דק') מול הפסל באגף המצרי","sum":"צוקר והריס מסבירים מה הופך את הסופר היושב לחי כל כך: הצבע שנשמר, והעיניים המשובצות מקריסטל. הם משווים אותו לפסלי פרעה האידיאליים, מספרים על מקום מציאתו בסקארה ועל מעמדם של הסופרים במצרים.","elab":[{"tm":"0:00","txt":"פסל מהממלכה הקדומה, כמעט 4,500 שנה. מה שמושך אנשים הוא עד כמה הוא נראה חי.","vid":"IKkcop-dlUY","sec":0},{"tm":"0:25","txt":"הוא צבוע, והצבע נשמר בצורה נדירה. הפסל מאבן גיר; הפטמות הן יתדות עץ.","vid":"IKkcop-dlUY","sec":25},{"tm":"0:50","txt":"העיניים: קריסטל מלוטש מלפנים וחומר אורגני מאחור שצובע את הקשתית, וחריץ לאישון. התוצאה – מבט ערני שמבטל 4,500 שנה.","vid":"IKkcop-dlUY","sec":50},{"tm":"1:15","txt":"בניגוד לפרעה, הוא לא מוצג באופן אידיאלי: יושב ברגליים משוכלות, עם קפלי שומן. ובכל זאת הוא חזיתי וסימטרי.","vid":"IKkcop-dlUY","sec":75},{"tm":"1:42","txt":"ביד ימין החזיק קולמוס ובשמאל גליל פפירוס. הוא נמצא בסקארה – פסל קבורה שלא נועד לעיני אדם.","vid":"IKkcop-dlUY","sec":102},{"tm":"2:07","txt":"הבסיס נחתך, ואיתו כנראה שמו ותאריו. ההירוגליף 'סופר' מצייר כלי כתיבה: קולמוס, כלי מים וגושי צבע.","vid":"IKkcop-dlUY","sec":127},{"tm":"2:34","txt":"סופרים היו מוערכים מאוד – מעטים ידעו קרוא וכתוב. אי אפשר לדעת עד כמה זה דיוקן אמיתי.","vid":"IKkcop-dlUY","sec":154},{"tm":"3:03","txt":"פרטים: עצמות לחיים בולטות, אצבעות וציפורניים מגולפות, חצאית לבנה ועור אדום-חום.","vid":"IKkcop-dlUY","sec":183}],"esrc":"Smarthistory · כתוביות הסרטון"}],"akhenaten_colossus":[{"l":"EN","show":"Mr. E on Art History","ep":"Akhenaten and the Breaking of Order","len":"10 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=Z9s2Lpi-HSA",200]],"tr":null,"at":"מ-3:20 (המהפכה באמנות) ועד 9:40","sum":"הסרטון לא עוסק בפסל שבלובר עצמו, אלא מסביר את סגנון עמרנה שבו הוא פוסל: גוף רך, ירכיים רחבות, בטן תפוחה, פנים מוארכות ושילוב של זכרי ונקבי – בדיוק מה שרואים בפסלי הענק של אחנתון מכרנך. אחר כך: נפרטיטי, העיר אחת-אתון ומחיקת זכרו.","elab":[{"tm":"3:20","txt":"האמנות משתנה יחד עם הדת. סגנון עמרנה, על שם הבירה קצרת הימים, הוא תגובה מכוונת נגד האמנות המצרית המסורתית.","vid":"Z9s2Lpi-HSA","sec":200},{"tm":"3:42","txt":"החזיתיות הנוקשה מתחלפת בצורות מעוגלות – גוף רך, ירכיים רחבות, בטן תפוחה, צוואר מוארך.","vid":"Z9s2Lpi-HSA","sec":222},{"tm":"3:56","txt":"המלך עצמו: עפעפיים כבדים, שפתיים מלאות, כתפיים צרות וגולגולת מוארכת – מראה שלא היה מעלה על הדעת קודם.","vid":"Z9s2Lpi-HSA","sec":236},{"tm":"4:27","txt":"פרשנות: איחוד של זכרי ונקבי בגוף אחד 'שלם', ולראשונה – רגעי אינטימיות משפחתית באמנות המלכותית.","vid":"Z9s2Lpi-HSA","sec":267},{"tm":"5:14","txt":"נפרטיטי, 'היפה באה', שותפתו למהפכה הדתית, והפסל המפורסם שלה מסדנת הפַסל.","vid":"Z9s2Lpi-HSA","sec":314},{"tm":"6:40","txt":"הבירה החדשה אחת-אתון ('אופק אתון') במדבר, ומקדשי אתון בלי גג.","vid":"Z9s2Lpi-HSA","sec":400},{"tm":"8:12","txt":"אחרי מותו: שמו נמחק ופסליו נופצו – הוא נזכר כ'מלך פושע' שהפר את המאעת.","vid":"Z9s2Lpi-HSA","sec":492}],"esrc":"Mr. E on Art History · כתוביות הסרטון"}],"sarcophagus_spouses":[{"l":"EN","show":"Musée du Louvre – One Minute in a Museum","ep":"EP18 – Sarcophagus of the Spouses","len":"דקה וחצי","listen":[["YouTube","https://www.youtube.com/watch?v=hKq-ilk8Cdo",0]],"tr":null,"at":"כל הסרטון – דקה וחצי","sum":"סרטון אנימציה קצרצר של הלובר: שני ילדים מתלבטים מול הארון – מיטה? ספה? – ומגלים שזה ארון קבורה אטרוסקי מצ'רווטרי, ולמה בני הזוג נראים כל כך שמחים. מתאים במיוחד לילדים.","elab":[{"tm":"0:00","txt":"'זו מיטה?' – לא, זה ארון קבורה, ופסלי בני הזוג שוכבים על המכסה.","vid":"hKq-ilk8Cdo","sec":0},{"tm":"0:20","txt":"אמנות אטרוסקית, ~520 לפנה\"ס, נמצא בצ'רווטרי.","vid":"hKq-ilk8Cdo","sec":20},{"tm":"0:30","txt":"האטרוסקים חיו באיטליה בזמן היוונים. התסרוקות יווניות, והשכיבה כמו במשתה – הרומאים העתיקו מהם.","vid":"hKq-ilk8Cdo","sec":30},{"tm":"0:45","txt":"האמינו שהמוות הוא המשך החיים: אוכלים, שותים ורוקדים. ובני הזוג נשארים יחד – לנצח.","vid":"hKq-ilk8Cdo","sec":45}],"esrc":"Musée du Louvre – One Minute in a Museum · כתוביות הסרטון"}],"winged_victory":[{"l":"EN","show":"Smarthistory","ep":"Nike of Samothrace (Winged Victory)","len":"3.4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=PjI0hAr0Vo0",0]],"tr":null,"at":"כל הסרטון (3.5 דק') מול הפסל בראש גרם המדרגות","sum":"הריס וצוקר מסבירים את הדרמה של ניקה: אלת הניצחון נוחתת על חרטום ספינה, הבגד מתנפנף ברוח, והגוף מושך למטה ולמעלה בו זמנית. הם מספרים על מציאתה בשברים במקדש בסמותרקה, משווים לפריז של פרגמון ומסבירים מה חשבו בעבר על מיקומה.","elab":[{"tm":"0:00","txt":"ניקה היא האנשה של הניצחון. הפסל והספינה מוצבים בראש גרם מדרגות – אפקט דרמטי.","vid":"PjI0hAr0Vo0","sec":0},{"tm":"0:23","txt":"היא נמצאה בשברים ושוחזרה, ועברה לאחרונה שיקום.","vid":"PjI0hAr0Vo0","sec":23},{"tm":"0:36","txt":"במקור עמדה במקדש האלים הגדולים באי סמותרקה. מהתקופה ההלניסטית, אחרי אלכסנדר הגדול.","vid":"PjI0hAr0Vo0","sec":36},{"tm":"1:03","txt":"משווים לפריז המזבח בפרגמון: אנרגיה, דרמה ועוצמה, וקפלי בד מורכבים לעומת הפרתנון.","vid":"PjI0hAr0Vo0","sec":63},{"tm":"1:33","txt":"היא הוצבה כך שפנתה לים – הרוח האמיתית 'שיתפה פעולה' עם הבד המתנפנף.","vid":"PjI0hAr0Vo0","sec":93},{"tm":"2:07","txt":"מתח בין פלג הגוף התחתון שנוחת לבין העליון שנמתח למעלה ומסתובב. הכנפיים נראות טבעיות לגמרי.","vid":"PjI0hAr0Vo0","sec":127},{"tm":"2:30","txt":"פעם חשבו שעמדה במזרקה ותקעה בחצוצרה; היום חושבים שעמדה במקדש פתוח או סגור למחצה.","vid":"PjI0hAr0Vo0","sec":150},{"tm":"2:40","txt":"הניגוד בין השיש הלבן-ורדרד של הדמות לשיש האפור של הספינה.","vid":"PjI0hAr0Vo0","sec":160}],"esrc":"Smarthistory · כתוביות הסרטון"}],"michelangelo_slaves":[{"l":"EN","show":"Smarthistory","ep":"Michelangelo, The Slaves","len":"3 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=h44bnIGogu8",7]],"tr":["Transcript","https://smarthistory.org/michelangelo-slaves-louvre/"],"at":"כל הסרטון","sum":"צוקר והאריס עומדים מול שני העבדים שמיכלאנג'לו פיסל לקבר האפיפיור יוליוס השני (1513–1515) ולא נכנסו לקבר בסוף. הם משווים בין \"העבד הגוסס\" השקוע בחלום לבין \"העבד המורד\" שנאבק בכבליו, ומסבירים את הרעיון הנאו-אפלטוני של נשמה שנאבקת להשתחרר מהחומר.","elab":[{"tm":"0:15","txt":"האפיפיור יוליוס השני הזמין קבר ענק עם יותר מ-40 פסלים. התוכנית צומצמה שוב ושוב, ושני העבדים נשארו מחוץ לקבר שעומד היום ברומא עם משה.","vid":"h44bnIGogu8","sec":15},{"tm":"1:01","txt":"הם אמורים להיות עבדים כבולים, אבל הם עומדים זקופים. מיכלאנג'לו נתן להם יופי ועוצמה.","vid":"h44bnIGogu8","sec":61},{"tm":"1:12","txt":"\"העבד הגוסס\": עיניים עצומות, מופנם, כאילו בחלום או בשינה.","vid":"h44bnIGogu8","sec":72},{"tm":"1:29","txt":"קריאה נאו-אפלטונית: הנשמה נאבקת להשתחרר מהגוף ומהחומר.","vid":"h44bnIGogu8","sec":89},{"tm":"1:50","txt":"מול הפסלים שוכחים מהר שהם היו פעם גוש שיש.","vid":"h44bnIGogu8","sec":110},{"tm":"2:00","txt":"\"העבד המורד\" מתפתל ונאבק, מבוגר ושרירי יותר, ופחות גמור.","vid":"h44bnIGogu8","sec":120},{"tm":"2:58","txt":"הדמות עדיין מחוברת לגוש האבן. מיכלאנג'לו מוכן להשאיר חלקים לא גמורים.","vid":"h44bnIGogu8","sec":178}],"esrc":"Smarthistory · כתוביות הסרטון"}],"canova_psyche":[{"l":"EN","show":"Exploring Art with Alessandro","ep":"Eternal Embrace: Canova's Psyche revived by Cupid's kiss","len":"6 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=P-pTD6WM6Lk",0]],"tr":null,"at":"כל הסרטון","sum":"אלסנדרו מסביר את \"פסיכה מתעוררת מנשיקת אמור\" של קנובה בלובר: המיתוס, רגע הנשיקה שכמעט קורית, והמבנה בצורת X שיוצרות הכנפיים והזרועות. הוא מראה איך השיש נראה כמו עור רך, ולמה הפסל נחשב לגשר בין הניאו-קלאסיקה לרומנטיקה.","elab":[{"tm":"0:36","txt":"קנובה היה כל כך מבוקש שנפוליאון, האפיפיור והעשירים של התקופה נאבקו עליו.","vid":"P-pTD6WM6Lk","sec":36},{"tm":"1:08","txt":"המיתוס: פסיכה פתחה כד שחשבה שמכיל יופי אלוהי, אבל פרוסרפינה הכניסה בו שיקוי שינה. אמור מעיר אותה.","vid":"P-pTD6WM6Lk","sec":68},{"tm":"1:38","txt":"הכד שעומד ליפול, החץ, ואמור שתומך בראשה. פסיכה מושיטה ידיים אל ראשו.","vid":"P-pTD6WM6Lk","sec":98},{"tm":"2:10","txt":"חושניות ותנועה: הקימורים של פסיכה, השיער והגוף העירום של אמור.","vid":"P-pTD6WM6Lk","sec":130},{"tm":"2:40","txt":"אנטומיה מדויקת, עור חלק, כנפיים ובד. אין אף איבר ישר, הכול מתפתל.","vid":"P-pTD6WM6Lk","sec":160},{"tm":"3:12","txt":"הזרועות יוצרות עיגול כמו מסגרת, והכנפיים יוצרות X שמושך את העין אל השפתיים שכמעט נוגעות.","vid":"P-pTD6WM6Lk","sec":192},{"tm":"3:42","txt":"מבנה ה-X הוא טריק עתיק מהפיסול היווני והרומי. קנובה כאמן ניאו-קלאסי לוקח אותו רחוק יותר.","vid":"P-pTD6WM6Lk","sec":222},{"tm":"4:54","txt":"בשורה של הרומנטיקה. מבקר בן הזמן התלונן שאין לפסל נקודת מבט אחת, וזה בדיוק העניין: צריך להקיף אותו.","vid":"P-pTD6WM6Lk","sec":294}],"esrc":"Exploring Art with Alessandro · כתוביות הסרטון"}],"raft_medusa":[{"l":"EN","show":"Smarthistory","ep":"Gericault, Raft of the Medusa","len":"7 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=jlVBaqyGKMs",8]],"tr":["Transcript","https://smarthistory.org/gericault-raft-of-the-medusa/"],"at":"כל הסרטון","sum":"צוקר והאריס מספרים את סיפור הזוועה של הפריגטה \"מדוזה\" ב-1816 ומראים איך ז'ריקו הפך אותו לציור ענק ופוליטי נגד המלוכה שחזרה לצרפת. הם עוקבים אחרי הקומפוזיציה מהייאוש בפינה השמאלית ועד התקווה בדמות שמנופפת לספינה באופק.","elab":[{"tm":"0:10","txt":"בד ענק (כ-5×7 מטרים). בגודל כזה ציירו אז רק נושאים נעלים מהתנ\"ך ומהעת העתיקה, וכאן מופיע אסון עכשווי.","vid":"jlVBaqyGKMs","sec":10},{"tm":"0:42","txt":"הפריגטה מדוזה הפליגה לסנגל עם כ-400 איש, ביניהם מתיישבים, חיילים והמושל החדש.","vid":"jlVBaqyGKMs","sec":42},{"tm":"1:05","txt":"לא היו מספיק סירות הצלה. נבנתה רפסודה ל-150 איש, ותוך דקות הקברניט ציווה לחתוך את חבל הגרירה.","vid":"jlVBaqyGKMs","sec":65},{"tm":"1:49","txt":"על הרפסודה: רעב, טירוף, רצח ואפילו קניבליזם. רק קומץ שרד.","vid":"jlVBaqyGKMs","sec":109},{"tm":"2:09","txt":"ז'ריקו ראיין ניצולים, בנה מודל של הרפסודה בסטודיו והביא איברי גופות מחדר המתים כדי לצייר ריקבון אמיתי.","vid":"jlVBaqyGKMs","sec":129},{"tm":"3:24","txt":"הקברניט מונה בזכות קשריו למלוכה ונטש את מי שהופקדו בידיו. הציור הוא כתב אישום פוליטי נגד המלך.","vid":"jlVBaqyGKMs","sec":204},{"tm":"3:37","txt":"פינת הרפסודה בולטת לעברנו כאילו אפשר לעלות עליה. הפירמידה עולה מאב שמחזיק את בנו המת אל הדמות שמנופפת לספינה.","vid":"jlVBaqyGKMs","sec":217},{"tm":"6:22","txt":"זו לא ניאו-קלאסיקה אלא רומנטיקה. מבקר בן הזמן סיכם: \"כולנו על הרפסודה\".","vid":"jlVBaqyGKMs","sec":382}],"esrc":"Smarthistory · כתוביות הסרטון"},{"l":"EN","show":"Great Art Explained (James Payne)","ep":"The Raft of the Medusa by Théodore Géricault: Great Art Explained","len":"15 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=yUq9qMm9NtI",2]],"tr":null,"at":"כל הסרטון (15 דק')","sum":"ג'יימס פיין מספר את סיפור הרפסודה ואת המחקר האובססיבי של ז'ריקו, ומפרק את הקומפוזיציה של שתי הפירמידות. הוא מדגיש את הצד המהפכני: אדם שחור, ז'אן שארל, כגיבור הציור בעידן העבדות.","elab":[{"tm":"0:33","txt":"דלקרואה הצעיר דגמן לאחת הדמויות. והמהפכה האמיתית: אדם שחור, ז'אן שארל, הוא הדמות ההרואית ביותר, אמירה נגד העבדות.","vid":"yUq9qMm9NtI","sec":33},{"tm":"2:12","txt":"הקברניט חתך את החבל. במשך 13 ימים: רצח בלילה הראשון, קניבליזם, ורק 15 מתוך 147 שרדו.","vid":"yUq9qMm9NtI","sec":132},{"tm":"3:37","txt":"ז'ריקו חקר הכול, ביקר בחדרי מתים ובבתי חולים כדי לצפות בגוססים ובמתים.","vid":"yUq9qMm9NtI","sec":217},{"tm":"4:22","txt":"ניצולים עזרו לו. נגר הספינה בנה מודל של הרפסודה, וכמה ניצולים מופיעים בציור עצמו.","vid":"yUq9qMm9NtI","sec":262},{"tm":"5:23","txt":"הרגע שנבחר: הספינה באופק לא ראתה אותם וחלפה. זה רגע של תקווה שנגדעת.","vid":"yUq9qMm9NtI","sec":323},{"tm":"6:18","txt":"ציור היסטורי נועד לגיבורים ולמעשים נעלים, וז'ריקו הציב במקומם אנשים פשוטים במאבק הישרדות.","vid":"yUq9qMm9NtI","sec":378},{"tm":"9:23","txt":"שתי פירמידות: מייאוש בבסיס, אב שמחזיק את בנו המת, ועד תקווה בפסגה.","vid":"yUq9qMm9NtI","sec":563},{"tm":"11:29","txt":"פרט שרבים מפספסים: לגו בצד שמאל חסר חצי תחתון, רמז לקניבליזם.","vid":"yUq9qMm9NtI","sec":689}],"esrc":"Great Art Explained (James Payne) · כתוביות הסרטון"},{"l":"HE","show":"Art in a Blink – אומנות כהרף עין (נתן ליפשיץ)","ep":"תאודור ז'ריקו - רפסודת מדוזה (1819)","len":"3 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=QmXBrRTFo_U",0]],"tr":null,"at":"כל הסרטון (כ-2.5 דק')","sum":"סרטון קצר בעברית מהסדרה \"אומנות כהרף עין\", שמוקדש כולו לרפסודת המדוזה. לסרטון אין כתוביות, ולכן התוכן ונקודות הזמן לא נבדקו. התיאור מציין רק את פרטי היצירה: 1819, 491×716 ס\"מ, הלובר."}],"liberty":[{"l":"EN","show":"Smarthistory","ep":"Delacroix, Liberty Leading the People","len":"6 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=6skizQlC-uU",10]],"tr":["Transcript","https://smarthistory.org/delacroix-liberty-leading-the-people/"],"at":"כל הסרטון","sum":"הסבר מלא על \"החירות מובילה את העם\": מהפכת יולי 1830, החירות כאלגוריה שחוצה את המתרס, והאנשים מכל המעמדות שהולכים אחריה. בסוף: איך המלך שקנה את הציור החזיר אותו לצייר כי הוא נחשב מסוכן.","elab":[{"tm":"0:18","txt":"נושא אקטואלי: מהפכת יולי 1830 שהדיחה את שארל העשירי והעלתה את לואי פיליפ. רואים את רגע הקרב, כשהתוצאה עוד לא ידועה.","vid":"6skizQlC-uU","sec":18},{"tm":"0:52","txt":"ברקע מגדלי נוטרדאם, סמל השמרנות, ועליהם מתנוסס דגל הטריקולור של המהפכה.","vid":"6skizQlC-uU","sec":52},{"tm":"1:10","txt":"החירות אינה אישה אמיתית אלא רעיון, כמו פסל החירות. החזה החשוף והפרופיל הקלאסי מחזירים לעת העתיקה ולרפובליקה הרומית.","vid":"6skizQlC-uU","sec":70},{"tm":"1:54","txt":"פריז עוד לא נבנתה מחדש עם השדרות הרחבות. המורדים עקרו את אבני הרחוב ובנו מהן מתרסים, והחירות קוראת לחצות אותם.","vid":"6skizQlC-uU","sec":114},{"tm":"2:50","txt":"פועל עם אקדח בחגורה לצד בורגני בכובע צילינדר עם רובה ציד: כל המעמדות יחד, וזה מה שהפך את הציור למסוכן.","vid":"6skizQlC-uU","sec":170},{"tm":"3:14","txt":"מימין נער עם שני אקדחים, תלמיד לפי כובע הקטיפה והילקוט.","vid":"6skizQlC-uU","sec":194},{"tm":"3:38","txt":"המחיר: בפינה השמאלית התחתונה גבר מת בכתונת לילה וגרב אחת, שנגרר כנראה ממיטתו ונרצח.","vid":"6skizQlC-uU","sec":218},{"tm":"5:10","txt":"לואי פיליפ קנה את הציור, אבל ב-1839 החזיר אותו לדלקרואה כי ציור שקורא להפיל מלך נחשב מסוכן. הוא חזר לתצוגה אחרי מהפכת 1848.","vid":"6skizQlC-uU","sec":310}],"esrc":"Smarthistory · כתוביות הסרטון"},{"l":"EN","show":"FRANCE 24 English","ep":"'Liberty Leading the People': Iconic French painting to make comeback in true colours • FRANCE 24","len":"2 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=x6w2nRoGHCM",0]],"tr":null,"at":"כל הסרטון (כדקה וחצי)","sum":"כתבה קצרה על שחזור \"החירות מובילה את העם\" (2024): אחרי חצי שנה של עבודה מיקרוסקופית הוסרו שכבות הלכה הצהובה והלכלוך, וחזרו הכחול, הלבן והאדום של הדגל. מומחית הלובר מסבירה מה אבד ומה חזר.","elab":[{"tm":"0:00","txt":"הציור כאייקון של צרפת: צויר ב-1830, שנת המהפכה שהדיחה את שארל העשירי.","vid":"x6w2nRoGHCM","sec":0},{"tm":"0:17","txt":"במשך עשרות שנים הציור היה מכוסה לכלוך ושכבות לכה מצהיבות.","vid":"x6w2nRoGHCM","sec":17},{"tm":"0:33","txt":"מה אבד: עוצמת צבעי הדגל ופרטים, ואיתם גם הדינמיות של האישה שצועדת לעבר הצופה.","vid":"x6w2nRoGHCM","sec":33},{"tm":"0:50","txt":"שישה חודשים של עבודה מיקרוסקופית. דלקרואה צייר את מה שחווה ב-1830, והוסיף מעליו אלגוריה.","vid":"x6w2nRoGHCM","sec":50},{"tm":"1:05","txt":"\"אישה מן העם\": הציור אומץ בידי מורדים ומפגינים בכל העולם, על שלטים ובאמנות רחוב.","vid":"x6w2nRoGHCM","sec":65}],"esrc":"FRANCE 24 English · כתוביות הסרטון"},{"l":"HE","show":"Art in a Blink – אומנות כהרף עין (נתן ליפשיץ)","ep":"אז'ן דלקרואה - חירות מובילה את העם (1831)","len":"2 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=TBTyB1fWrn4",0]],"tr":null,"at":"כל הסרטון (כ-1.5 דק')","sum":"סרטון קצר בעברית, \"יצירת אמנות על קצה המזלג\", שמוקדש כולו ל\"החירות מובילה את העם\". לסרטון אין כתוביות, ולכן התוכן לא נבדק."}],"sardanapalus":[{"l":"EN","show":"Smarthistory","ep":"Delacroix, The Death of Sardanapalus","len":"4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=iDBJK0y8vb0",6]],"tr":["Transcript","https://smarthistory.org/delacroix-the-death-of-sardanapalus/"],"at":"כל הסרטון","sum":"הסבר על \"מות סרדנפל\": המלך האשורי הנצור מצווה להשמיד את נשותיו, סוסיו ואוצרותיו לפני מותו, ומשקיף על כך באדישות מיטתו. זה ההפך הגמור מהסדר הניאו-קלאסי: מערבולת אדומה ולוהבת של אלימות ומותרות.","elab":[{"tm":"0:34","txt":"הסיפור (מתוך מחזה של ביירון): מלך אשור מובס ומחליט שהכול יגווע איתו, נשים, עבדים, סוסים ותכשיטים. המיטה היא מדורת קבורה ענקית.","vid":"iDBJK0y8vb0","sec":34},{"tm":"0:55","txt":"המלך שוכב למעלה ומביט באדישות מוחלטת בהרס החיים והחפצים סביבו.","vid":"iDBJK0y8vb0","sec":55},{"tm":"1:06","txt":"זו האנטיתזה לניאו-קלאסיקה של דויד: אין חלל ברור, הכול נדחס, נשפך ומתערבב.","vid":"iDBJK0y8vb0","sec":66},{"tm":"1:40","txt":"כל הצורות מתפתלות כמו להבות: הסוס בצורת S, הצעיפים וגופי הנשים.","vid":"iDBJK0y8vb0","sec":100},{"tm":"2:24","txt":"בחזית אשה נדקרת ממש לנגד עינינו, והאלימות נשפכת אל המרחב של הצופה.","vid":"iDBJK0y8vb0","sec":144},{"tm":"3:17","txt":"הצבע: גם הצללים והאורות הם כתום וזהב, וכך דלקרואה חושב בצבע ולא בקו.","vid":"iDBJK0y8vb0","sec":197}],"esrc":"Smarthistory · כתוביות הסרטון"}],"gros_jaffa":[{"l":"HE","show":"עושים היסטוריה (רן לוי)","ep":"348: נפוליאון במזה\"ת, חלק ג' - הטבח ביפו [עושים היסטוריה]","len":"49 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=FY1eqfuLj8I",1016]],"tr":null,"at":"מ-16:56 (הדבר בצבא) ודרך המצור על יפו (19:27) עד 28:45. הביקור אצל חולי הדבר ב-27:04","sum":"רן לוי מספר על מסע נפוליאון בארץ ישראל: המצור על יפו במרץ 1799, טבח התושבים והוצאת השבויים להורג, ואז מגפת הדבר. בהמשך הוא מתאר את הביקור של נפוליאון בבית החולים ביפו, הרגע שגרו הפך לציור.","elab":[{"tm":"16:56","txt":"רקע: מגפת הדבר מתפשטת בצבא הצרפתי. הרופאים מסתירים את שם המחלה כדי לא לעורר פאניקה.","vid":"FY1eqfuLj8I","sec":1016},{"tm":"19:27","txt":"תחילת מרץ 1799: הצבא מגיע ליפו המבוצרת וחונה בערך במקום שבו עומד היום אצטדיון בלומפילד.","vid":"FY1eqfuLj8I","sec":1167},{"tm":"20:43","txt":"נפוליאון דורש כניעה. מפקד יפו מוציא את השליחים להורג ותוקע את ראשיהם על חניתות.","vid":"FY1eqfuLj8I","sec":1243},{"tm":"21:54","txt":"החומה נפרצת ויומיים של טבח וביזה: כ-1,500 תושבים נרצחים.","vid":"FY1eqfuLj8I","sec":1314},{"tm":"23:01","txt":"אלפי שבויים שנכנעו: \"מה אני אמור לעשות איתם?\". ההחלטה להוציא אותם להורג על החוף.","vid":"FY1eqfuLj8I","sec":1381},{"tm":"27:04","txt":"נפוליאון מקים ביפו בית חולים לפצועים ובית חולים לחולי דבר. הפחד מהמגפה מאיים על המורל.","vid":"FY1eqfuLj8I","sec":1624},{"tm":"27:56","txt":"הביקור: נפוליאון נכנס בעצמו לבית החולים כדי להראות שהוא לא מפחד, ואף עוזר לפנות גופה של חייל.","vid":"FY1eqfuLj8I","sec":1676},{"tm":"28:32","txt":"פרט מקומי: הרופאים ביפו השתמשו בתחבושות מבד כותנה מקומי.","vid":"FY1eqfuLj8I","sec":1712}],"esrc":"עושים היסטוריה (רן לוי) · כתוביות הסרטון"},{"l":"EN","show":"Smarthistory","ep":"Napoleon, plague, and propaganda - Gros' The Pest House at Jaffa","len":"4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=w2OTUmLupdw",12]],"tr":["Transcript","https://smarthistory.org/gros-napoleon-bonaparte-visiting-the-plague-stricken-in-jaffa/"],"at":"כל הסרטון","sum":"צוקר והאריס מסבירים איך גרו הפך ביקור של בונפרטה אצל חולי הדבר ביפו (מרץ 1799) לתעמולה: נפוליאון נוגע בפצע של חולה כמו ישו המרפא, ללא פחד מהמחלה. הציור נועד לטשטש פרסום רע מהמסע, והוא מראשוני הציורים של אירוע אקטואלי בהיקף ענק.","elab":[{"tm":"0:17","txt":"יפו הייתה אז חלק מסוריה העות'מאנית, והיום היא בישראל. נפוליאון מבקר את חייליו החולים במהלך המסע הצבאי.","vid":"w2OTUmLupdw","sec":17},{"tm":"0:28","txt":"הציור הוזמן כדי לנטרל פרסום רע ולהציג את נפוליאון כמעט כאל.","vid":"w2OTUmLupdw","sec":28},{"tm":"0:47","txt":"נפוליאון נוגע בבית השחי של חולה, בניגוד לאזהרת הרופא שלו.","vid":"w2OTUmLupdw","sec":47},{"tm":"0:51","txt":"ההשראה מנוצרית: ישו מרפא חולים, או תומאס שתוחב אצבע בפצע של ישו.","vid":"w2OTUmLupdw","sec":51},{"tm":"1:05","txt":"מהפינה הימנית התחתונה עד נפוליאון: מגוססים, חייל עיוור שמגשש אליו, ומשמאל מחלקים לחם לחולים.","vid":"w2OTUmLupdw","sec":65},{"tm":"2:04","txt":"הקצין שליד נפוליאון מחזיק מטפחת על האף, ונפוליאון עצמו לא נרתע: \"חסין\" למחלה.","vid":"w2OTUmLupdw","sec":124},{"tm":"2:40","txt":"קשתות מזרחיות ודגל צרפתי בקשת המרכזית: מקום אקזוטי בשליטה צרפתית.","vid":"w2OTUmLupdw","sec":160},{"tm":"3:11","txt":"ההזמנה שחררה ציירים לצייר אירועים אקטואליים בממדים של ציור היסטורי, והובילה לז'ריקו ולדלקרואה.","vid":"w2OTUmLupdw","sec":191}],"esrc":"Smarthistory · כתוביות הסרטון"},{"l":"HE","show":"The Holy Land, by Zahi Shaked (מורה דרך צחי שקד)","ep":"יפו העתיקה - החדר בו שיכן נפוליאון בשנת 1799 את חולי הדבר","len":"4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=Yalz6RlcD48",0]],"tr":null,"at":"כל הסרטון (כ-4 דק')","sum":"צילום של החדר ביפו העתיקה, במנזר הארמני, שבו לפי המסורת שוכנו חולי הדבר ב-1799. זה המקום שגרו צייר ברקע \"בונפרטה מבקר את חולי הדבר ביפו\". לסרטון אין כתוביות, ולכן התוכן לא נבדק. התיאור מסביר את הקשר לציור ולכיבוש יפו ב-7 במרץ 1799."}],"coronation_napoleon":[{"l":"HE","show":"פרנקופילים אנונימיים – הרצאה של ד\"ר אלון קליבנוב","ep":"״הכתרת נפוליאון״, מאת ז׳אק-לואי דויד תיעוד היסטורי או תעמולה והנדסת תודעה? - הרצאה של אלון קליבנוב","len":"83 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=yg9nUo4t-Dg",672]],"tr":null,"at":"מ-11:12. כל ההרצאה עוסקת בציור (עד 1:23:00)","sum":"הרצאה שלמה בעברית על \"הכתרת נפוליאון\" של דויד: תיעוד היסטורי או תעמולה? קליבנוב מספר על הטקס בנוטרדאם, ההזמנה מדויד, הסקיצות שבהן נפוליאון מכתיר את עצמו, ואיך דויד הוסיף לציור את אם הקיסר שבכלל לא הגיעה.","elab":[{"tm":"11:12","txt":"הציור כביטוי המרכזי של הטקס: נרטיב חזותי מתוכנן. חלק מהפרטים הם פרי דמיונו של דויד, וזו השאלה שתלווה את ההרצאה.","vid":"yg9nUo4t-Dg","sec":672},{"tm":"19:44","txt":"ספטמבר 1804: נפוליאון מזמין מדויד את הציור הענק. דויד נוכח בטקס ומתחיל לעבוד בסטודיו שהיה פעם כנסייה.","vid":"yg9nUo4t-Dg","sec":1184},{"tm":"29:54","txt":"המידות: כ-6 על 10 מטרים. האתגר של תפירת בד כזה ושל ציור דמויות בגודל טבעי.","vid":"yg9nUo4t-Dg","sec":1794},{"tm":"31:32","txt":"הדבורים על גלימת הקיסר: סמל של המלך המרובינגי שילדריק, שיוצר רצף מדומה למלוכה בת אלף שנה.","vid":"yg9nUo4t-Dg","sec":1892},{"tm":"34:22","txt":"\"מיתוסים מול מציאות\": ההכתרה כאקט פוליטי, מהמשחה של שאול ועד \"מלך בחסד האל\".","vid":"yg9nUo4t-Dg","sec":2062},{"tm":"42:40","txt":"נפוליאון הכתיר את עצמו, אבל דויד בחר לצייר אותו מכתיר את ז'וזפין. בסקיצות רואים את הגרסה המקורית.","vid":"yg9nUo4t-Dg","sec":2560},{"tm":"47:03","txt":"ההתכתבות בין דויד לנפוליאון על כל פרט: האם ז'וזפין תרכין ראש, באיזו זווית, לאן היא תביט.","vid":"yg9nUo4t-Dg","sec":2823},{"tm":"50:29","txt":"לטיציה, אם נפוליאון, סירבה לבוא לטקס בגלל הסכסוך עם ז'וזפין, ונפוליאון הורה לצייר אותה במקום של כבוד.","vid":"yg9nUo4t-Dg","sec":3029},{"tm":"53:01","txt":"האפיפיור: בתיעוד אחר הוא יושב בידיים שלובות. אצל דויד הוא מרים יד בברכה.","vid":"yg9nUo4t-Dg","sec":3181}],"esrc":"פרנקופילים אנונימיים – הרצאה של ד\"ר אלון קליבנוב · כתוביות הסרטון"},{"l":"EN","show":"Accessible Art History – The Podcast","ep":"Accessible Art History: The Podcast: Episode 30: The Coronation of Napoleon by Jacques Louis David","len":"9 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=7SjiqVcXr84",49]],"tr":null,"at":"מ-0:44 ועד 8:30 (באמצע קטע ביוגרפי על נפוליאון)","sum":"פרק פודקאסט קצר וברור באנגלית על \"הכתרת נפוליאון\": מי הדמויות, למה דויד צייר את הכתרת ז'וזפין ולא את נפוליאון מכתיר את עצמו, ואיך נבנתה הקומפוזיציה הניאו-קלאסית. באמצע יש סקירה של חיי נפוליאון.","elab":[{"tm":"1:09","txt":"ציור ענק, כ-10 על 6 מטרים. למרות השם, נפוליאון לא מכתיר את עצמו אלא עומד להכתיר את ז'וזפין בנוטרדאם.","vid":"7SjiqVcXr84","sec":69},{"tm":"1:55","txt":"בסקיצה המקורית נפוליאון מכתיר את עצמו. בציור נבחר רגע \"מנומס\" יותר. הכתרה בפריז ולא בריימס מסמנת משטר חדש.","vid":"7SjiqVcXr84","sec":115},{"tm":"2:59","txt":"מדריך לדמויות: נפוליאון, ז'וזפין כורעת, ואמו לטיציה במקום של כבוד, אף שלא נכחה בטקס.","vid":"7SjiqVcXr84","sec":179},{"tm":"3:50","txt":"האפיפיור שמברך ומעניק לגיטימציה, ובקהל דיוקן עצמי של דויד, שנכח באירוע.","vid":"7SjiqVcXr84","sec":230},{"tm":"7:06","txt":"ההזמנה בעל פה בספטמבר 1804. דויד שאל נוכחים על פרטים ושאב השראה מ\"הכתרת מארי דה מדיצ'י\" של רובנס בלובר.","vid":"7SjiqVcXr84","sec":426},{"tm":"7:49","txt":"הציור נשאר אצל דויד עד 1819, עבר לוורסאי וב-1889 הגיע ללובר.","vid":"7SjiqVcXr84","sec":469},{"tm":"7:59","txt":"כל קווי המבט מובילים לנפוליאון והכתר. קווים אופקיים ואנכיים מאזנים את הסצנה, ופלטת הצבעים מוגבלת.","vid":"7SjiqVcXr84","sec":479}],"esrc":"Accessible Art History – The Podcast · כתוביות הסרטון"}],"oath_horatii":[{"l":"EN","show":"Smarthistory","ep":"David, Oath of the Horatii","len":"6 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=qfAga9DAuU4",14]],"tr":["Transcript","https://smarthistory.org/david-oath-of-the-horatii/"],"at":"כל הסרטון","sum":"צוקר והאריס מסבירים למה \"שבועת ההוראטיים\" (1784) הייתה פצצה בסלון של 1785: סגנון ניאו-קלאסי חמור במקום הרוקוקו המתקתק, וסיפור רומי על הקרבה למען המדינה. הם מראים את הניגוד בין הגברים הנוקשים לנשים הקורסות, ואת הקשר לדויד כמהפכן.","elab":[{"tm":"0:28","txt":"נגד הרוקוקו: הציור מחליף את הסגנון האריסטוקרטי הקליל בסגנון חדש, חמור ומוסרי.","vid":"qfAga9DAuU4","sec":28},{"tm":"0:46","txt":"מבקרים כמו דידרו דרשו אמנות שמציגה מידות טובות. זו רוח הנאורות, ארבע שנים לפני המהפכה.","vid":"qfAga9DAuU4","sec":46},{"tm":"1:43","txt":"הסיפור: רומא ואלבה מחליטות להכריע את המלחמה בדו-קרב, שלושה אחים מכל צד, ההוראטיים מול הקוריאטיים.","vid":"qfAga9DAuU4","sec":103},{"tm":"2:03","txt":"המשפחות קשורות בנישואים, אחות ההוראטיים מאורסת לאחד הקוריאטיים. מי שלא ינצח, שני הצדדים יפסידו.","vid":"qfAga9DAuU4","sec":123},{"tm":"2:43","txt":"הנשים מימין רכות ומעוגלות וקורסות בצער, והגברים זוויתיים ונחושים ומושיטים זרועות כאחד.","vid":"qfAga9DAuU4","sec":163},{"tm":"4:09","txt":"הדמויות מסודרות כמו תבליט עתיק, על במה של שלוש קשתות רומיות ועמודים טוסקניים.","vid":"qfAga9DAuU4","sec":249},{"tm":"4:54","txt":"הקהל נהר לראות את הציור. במהפכה הוא נקרא כקריאה להקריב את עצמך למען האידיאלים.","vid":"qfAga9DAuU4","sec":294},{"tm":"5:39","txt":"דויד עצמו היה מעורב בפוליטיקה, ואף הצביע בעד הוצאת המלך להורג.","vid":"qfAga9DAuU4","sec":339}],"esrc":"Smarthistory · כתוביות הסרטון"}],"grande_odalisque":[{"l":"EN","show":"Smarthistory","ep":"Ingres, La Grande Odalisque","len":"4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=PPwz3iaT71M",6]],"tr":["Transcript","https://smarthistory.org/ingres-la-grande-odalisque/"],"at":"כל הסרטון","sum":"הסבר קצר על \"האודליסק הגדולה\" של אנגר: פנטזיה מערבית על הרמון מזרחי, משטח מבריק בלי משיכת מכחול אחת, וגוף ארוך מדי בכוונה. אנגר מוותר על דיוק אנטומי לטובת יופי אידיאלי, ולכן הוא נחשב לציר בין הניאו-קלאסיקה לרומנטיקה.","elab":[{"tm":"0:23","txt":"אודליסק היא אשה בהרמון. אנגר מעולם לא ביקר במזרח, אז זו פנטזיה מערבית טהורה ולא תצפית.","vid":"PPwz3iaT71M","sec":23},{"tm":"0:49","txt":"היא מפנה לנו גב ומביטה לאחור במבט מתגרה אבל קר ומרוחק: יפה ובלתי מושגת.","vid":"PPwz3iaT71M","sec":49},{"tm":"1:10","txt":"מסורת העירום מטיציאן וג'ורג'ונה הציגה אלות עתיקות. כאן העירום מרוחק במקום, לא בזמן: אשה \"אקזוטית\" בת התקופה.","vid":"PPwz3iaT71M","sec":70},{"tm":"2:18","txt":"הגב ארוך מדי, כאילו יש בו חוליות נוספות, והרגל השמאלית לא מתחברת לגוף. אלה עיוותים מכוונים.","vid":"PPwz3iaT71M","sec":138},{"tm":"2:57","txt":"סביבה חושנית של סאטן רקום, וילון, מניפת נוצות טווס ונרגילה.","vid":"PPwz3iaT71M","sec":177},{"tm":"3:59","txt":"הקווים המתעקלים ממשיכים זה את זה, ולכן אנגר נחשב לציר בין הניאו-קלאסיקה לרומנטיקה.","vid":"PPwz3iaT71M","sec":239}],"esrc":"Smarthistory · כתוביות הסרטון"}],"cimabue_maesta":[{"l":"EN","show":"Musée du Louvre","ep":"Cimabue : La Maestà révélée","len":"11 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=Gw5lOymiHgk",15]],"tr":null,"at":"כל הסרטון (בצרפתית עם כתוביות באנגלית)","sum":"הסרט הרשמי של הלובר על שחזור המאסטה של צ'ימבואה (2025): צילום אינפרא-אדום, ניקוי, והתגליות שהיו מוסתרות מתחת לצבע מאוחר. בין היתר: בד ירוק עם נשרים בסגנון אסלאמי, כתובת פסאודו-ערבית במסגרת, ודמות ישו מברך שנעלמה במאה ה-19.","elab":[{"tm":"0:15","txt":"צ'ימבואה, צייר מסתורי מהמאה ה-13 שכבר בני זמנו ראו בו את מי ששינה את הציור.","vid":"Gw5lOymiHgk","sec":15},{"tm":"0:55","txt":"האגדה: צ'ימבואה גילה רועה צעיר שצייר כבשים. זה היה ג'וטו, שלפי דנטה עלה על רבו.","vid":"Gw5lOymiHgk","sec":55},{"tm":"1:40","txt":"המאסטה צוירה בערך ב-1280 לכנסיית הפרנציסקנים בפיזה, בתקופה של קשרים הדוקים עם ביזנטיון והמזרח.","vid":"Gw5lOymiHgk","sec":100},{"tm":"2:24","txt":"לפני השחזור: צילום אינפרא-אדום שרואה מתחת לשכבות הצבע, עד הרישום ההכנה.","vid":"Gw5lOymiHgk","sec":144},{"tm":"4:01","txt":"הניקוי החזיר את הברק של הסגולים, הוורודים והאדומים, ואת הלכה, פיגמנט יקר במיוחד.","vid":"Gw5lOymiHgk","sec":241},{"tm":"4:46","txt":"תגלית: מתחת לצבע מאוחר נמצא בד ירוק שקוף עם מדליונים של נשרים, דגם מוכר מטקסטיל אסלאמי.","vid":"Gw5lOymiHgk","sec":286},{"tm":"5:32","txt":"במסגרת: כתובת פסאודו-אפיגרפית שמחקה כתב ערבי מהמאה ה-13, על רקע אדום.","vid":"Gw5lOymiHgk","sec":332},{"tm":"9:34","txt":"השחזור חשף גם דמות של ישו מברך בראש הציור, שכוסתה בצבע כנראה באמצע המאה ה-19.","vid":"Gw5lOymiHgk","sec":574}],"esrc":"Musée du Louvre · כתוביות הסרטון"}],"giotto_francis":[{"l":"EN","show":"Smarthistory","ep":"Giotto, St. Francis Receiving the Stigmata","len":"5 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=MQct5EFQ9x8",5]],"tr":["Transcript","https://smarthistory.org/giotto-st-francis-receiving-the-stigmata/"],"at":"כל הסרטון","sum":"צוקר והאריס מסבירים למה לוח המזבח של ג'וטו היה חדשני: פרנציסקוס לא מוצג כאיקונה שטוחה אלא כאדם כורע שמגיב בפחד ובפליאה, בתוך נוף. בפרדלה למטה שלוש סצנות שמספרות איך הכנסייה קיבלה את המסדר שלו.","elab":[{"tm":"0:10","txt":"פרנציסקוס מקבל את הסטיגמטה, פצעי ישו, מישו שמופיע כשרף מכונף.","vid":"MQct5EFQ9x8","sec":10},{"tm":"0:27","txt":"התחלה של נוף טבעי, עצים והר. הקנה מידה עוד לא נכון, אבל פרנציסקוס עומד על הארץ.","vid":"MQct5EFQ9x8","sec":27},{"tm":"0:40","txt":"לא דמות איקונית מלפנים אלא אדם כורע, מבולבל ונפחד מעט. רגשות אנושיים.","vid":"MQct5EFQ9x8","sec":40},{"tm":"0:58","txt":"הגוף מעוצב בתלת-ממד: קפלי גלימה, ברכיים וידיים. שונה מאוד מהדמויות השטוחות שקדמו לו.","vid":"MQct5EFQ9x8","sec":58},{"tm":"1:54","txt":"קרני אור מזהב יורדות מהשרף אל הידיים, הרגליים והצד של פרנציסקוס.","vid":"MQct5EFQ9x8","sec":114},{"tm":"2:23","txt":"הפרדלה: חלום האפיפיור אינוקנטיוס השלישי שבו פרנציסקוס תומך בכנסייה קורסת, אישור המסדר, והדרשה לציפורים.","vid":"MQct5EFQ9x8","sec":143},{"tm":"4:14","txt":"הפשטות והישירות הרגשית של ג'וטו הפכו אותו למודל לאמנים לאורך דורות.","vid":"MQct5EFQ9x8","sec":254}],"esrc":"Smarthistory · כתוביות הסרטון"}],"mantegna_crucifixion":[{"l":"EN","show":"wocomoCULTURE – Artworks Explained","ep":"Crucifixion by Andrea Mantegna: Example of his excellent control of perspective | Artworks Explained","len":"10 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=1-TRuS-fWIc",0]],"tr":null,"at":"כל הסרטון","sum":"ניתוח מפורט של \"הצליבה\" של מנטניה (1456–1459), החלק המרכזי בפרדלה של מזבח סן זנו בורונה. נפוליאון לקח את המזבח ללובר, ורק הפרדלה נשארה בצרפת. הסרטון מראה איך שלושת הצלבים בונים חלל, ואיך הצלב מחלק בין עולם האבל לעולם החיילים האדישים.","elab":[{"tm":"0:00","txt":"נפוליאון הביא את המזבח ללובר. בשנת 1815 הוחזר המזבח לורונה, אבל הפרדלה נשארה בצרפת.","vid":"1-TRuS-fWIc","sec":0},{"tm":"0:44","txt":"ציור קטן אבל מהגדולים בצליבות באמנות האיטלקית. מנטניה היה אז בן עשרים ומשהו.","vid":"1-TRuS-fWIc","sec":44},{"tm":"1:24","txt":"גולגותא: חורים בסלע לתקיעת הצלבים ועצמות אדם. מימין הגנב הנאלח מתפתל.","vid":"1-TRuS-fWIc","sec":84},{"tm":"2:11","txt":"משמאל הנשים סביב מריה שמתעלפת, ומעליהן הגנב שנגאל, עם הבעה שקטה.","vid":"1-TRuS-fWIc","sec":131},{"tm":"2:54","txt":"הצלב מחלק: משמאל כאב ואמונה, ומימין עולם של אדישות ומלחמה, חיילים שמטילים גורל על הבגד.","vid":"1-TRuS-fWIc","sec":174},{"tm":"3:42","txt":"קווי המבט של הדמויות נפגשים בפני ישו.","vid":"1-TRuS-fWIc","sec":222},{"tm":"4:24","txt":"שלושת הצלבים בונים במה, והחיילים בחזית נחתכים בשולי המסגרת: שליטה בפרספקטיבה.","vid":"1-TRuS-fWIc","sec":264},{"tm":"6:31","txt":"ההזמנה: גרגוריו קורר, אב המנזר של סן זנו בורונה, ב-1456. המזבח הותקן שלוש שנים אחר כך.","vid":"1-TRuS-fWIc","sec":391}],"esrc":"wocomoCULTURE – Artworks Explained · כתוביות הסרטון"}],"virgin_of_the_rocks":[{"l":"EN","show":"Amuze Art Lectures","ep":"Why Leonardo da Vinci made this Masterpiece twice...","len":"9 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=sZldJlshDm8",3]],"tr":null,"at":"כל הסרטון. גרסת הלובר מוסברת מ-0:56","sum":"למה לאונרדו צייר את \"הבתולה בין הסלעים\" פעמיים? ההרצאה מעמידה את גרסת הלובר, הראשונה והנועזת, מול הגרסה המאוחרת בלונדון. היא מספרת על המזמינים במילאנו שדחו את הציור, ומפרשת את הקומפוזיציה, הצמחים, הסלעים והספומאטו.","elab":[{"tm":"0:31","txt":"שתי גרסאות בגובה כמעט שני מטרים: אחת בלובר ואחת בגלריה הלאומית בלונדון.","vid":"sZldJlshDm8","sec":31},{"tm":"0:56","txt":"גרסת הלובר הושלמה ראשונה והיא פחות מקובלת: אין הילות, אין צלב ליוחנן, והמלאך מצביע ומביט החוצה אל הצופה.","vid":"sZldJlshDm8","sec":56},{"tm":"1:51","txt":"ההזמנה, תחילת שנות ה-80 של המאה ה-15: אחוות ההתעברות ללא חטא בכנסיית סן פרנצ'סקו מאג'ורה במילאנו.","vid":"sZldJlshDm8","sec":111},{"tm":"3:36","txt":"האחווה דחתה את הציור כי הוא לא התאים לדוגמה שלה, ודרשה גרסה מסורתית.","vid":"sZldJlshDm8","sec":216},{"tm":"4:07","txt":"הגרסה השנייה, היום בלונדון, הושלמה רק כעשרים שנה אחרי.","vid":"sZldJlshDm8","sec":247},{"tm":"5:42","txt":"הקומפוזיציה המשולשת: יוחנן מתפלל, ישו מברך, ומאחוריו מלאך אנדרוגיני (גבריאל או אוריאל).","vid":"sZldJlshDm8","sec":342},{"tm":"6:51","txt":"הסלעים והמערה כמקלט וכרמז לישו כ\"סלע\". בצמחים אפשר לזהות אירוסים, חבצלות וקיסוס.","vid":"sZldJlshDm8","sec":411},{"tm":"8:11","txt":"ספומאטו (\"להתנדף כעשן\"): מעברים רכים בין אור לצל שיוצרים את האווירה המסתורית.","vid":"sZldJlshDm8","sec":491}],"esrc":"Amuze Art Lectures · כתוביות הסרטון"},{"l":"EN","show":"Smarthistory","ep":"Virgin of the Rocks","len":"6 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=94xKRkCHlv0",7]],"tr":null,"at":"כל הסרטון. צולם מול הגרסה השנייה בלונדון","sum":"שימו לב: צוקר והאריס עומדים מול הגרסה השנייה, בגלריה הלאומית בלונדון, ולא מול זו שבלובר. הקומפוזיציה כמעט זהה, ולכן ההסבר על מריה היושבת על האדמה, תנועות הידיים, הנוף הגיאולוגי והספומאטו תקף גם כאן.","elab":[{"tm":"0:40","txt":"למה שתי גרסאות? מחלוקת על התשלום עם המזמינים במילאנו. לאונרדו מכר את הראשונה (זו שבלובר) וצייר להם שנייה.","vid":"94xKRkCHlv0","sec":40},{"tm":"1:16","txt":"מריה יושבת על האדמה ולא על כס בשמיים: \"מדונה של ענווה\", והטבע הופך לכס שלה.","vid":"94xKRkCHlv0","sec":76},{"tm":"2:01","txt":"מריה מחבקת את יוחנן המטביל, שמתפלל לישו, וישו מברך אותו.","vid":"94xKRkCHlv0","sec":121},{"tm":"3:05","txt":"היד השמאלית של מריה בקיצור פרספקטיבי, כאילו מכסה על ישו.","vid":"94xKRkCHlv0","sec":185},{"tm":"3:42","txt":"המים השקטים בחזית: סמל לטוהר מריה ורמז לטבילה העתידית.","vid":"94xKRkCHlv0","sec":222},{"tm":"4:42","txt":"ספומאטו: הדמויות מגיחות מהחושך בלי קווי מתאר.","vid":"94xKRkCHlv0","sec":282},{"tm":"5:00","txt":"דיוק בוטני וגיאולוגי: לאונרדו המדען מאחורי הצייר.","vid":"94xKRkCHlv0","sec":300}],"esrc":"Smarthistory · כתוביות הסרטון"}],"st_anne":[{"l":"EN","show":"Nerdwriter1","ep":"Leonardo da Vinci's Best Painting (Is Not The Mona Lisa)","len":"9 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=tREOeneo7gY",79]],"tr":null,"at":"מ-1:19 (אחרי פרסומת לספר) עד 8:30","sum":"מסה מצולמת של Nerdwriter שטוען ש\"מריה, ישו התינוק ואנה הקדושה\" הוא הציור הטוב ביותר של לאונרדו. הוא מנתח את הפירמידה של הדמויות, הכבש כסמל לגורל ישו, הנוף הגיאולוגי והזיגוגים הדקיקים, ומסיים בחיוך של אנה בראש הפירמידה.","elab":[{"tm":"1:19","txt":"מלאונרדו שרדו רק כ-20 ציורים, רבים מהם לא גמורים.","vid":"tREOeneo7gY","sec":79},{"tm":"1:59","txt":"הציור: ישו התינוק אוחז בכבש, מריה יושבת על ברכי אמה אנה, וברקע הרים סלעיים.","vid":"tREOeneo7gY","sec":119},{"tm":"2:40","txt":"המשולש מעניק יציבות ומוביל את העין מפינה לפינה, ולאונרדו מחזק את התנועה בכיווני המבטים.","vid":"tREOeneo7gY","sec":160},{"tm":"3:21","txt":"הכבש הוא סמל לקורבן ישו. המסלול מראש הפירמידה לפינה הימנית התחתונה הוא מסע מהעבר אל העתיד.","vid":"tREOeneo7gY","sec":201},{"tm":"3:58","txt":"הנוף רומז לזמן גיאולוגי עמוק, בסתירה לגיל העולם לפי הכנסייה: לאונרדו בין דת למדע.","vid":"tREOeneo7gY","sec":238},{"tm":"4:38","txt":"הידע האנטומי מניתוחי גופות ניכר בכף הרגל של מריה ובזרוע של ישו.","vid":"tREOeneo7gY","sec":278},{"tm":"5:20","txt":"הציור התחיל בערך ב-1500, כנראה בהזמנת מלך צרפת, ולא נמסר. הוא נשאר לא גמור.","vid":"tREOeneo7gY","sec":320},{"tm":"6:00","txt":"שכבות זיגוג שקופות ודקיקות. בדיקת קרינת רנטגן בלחי של ישו מצאה פחות מ-8% פיגמנט בשכבה.","vid":"tREOeneo7gY","sec":360},{"tm":"7:22","txt":"בסופו של דבר זו משפחה: ילד משתובב, אם מודאגת וסבתא מחייכת בחוכמה, בראש הפירמידה.","vid":"tREOeneo7gY","sec":442}],"esrc":"Nerdwriter1 · כתוביות הסרטון"}],"st_john_baptist":[{"l":"EN","show":"Spencer's Painting of the Week","ep":"St. John the Baptist (da Vinci)","len":"5 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=9ArMihGDY88",7]],"tr":null,"at":"כל הסרטון","sum":"הסבר קצר על \"יוחנן המטביל\" של לאונרדו, מהציורים האחרונים שלו: דמות אנדרוגינית עם חיוך מסתורי כמו של המונה ליזה, אצבע מורמת לשמיים ורקע כהה. ספנסר מסביר את הספומאטו ואת האור כסמל לישועה.","elab":[{"tm":"0:07","txt":"שמן על עץ אגוז, 1513–1516, במעבר מהרנסנס הגבוה למנייריזם.","vid":"9ArMihGDY88","sec":7},{"tm":"0:37","txt":"יוחנן לבדו, עטוף פרווה ואוחז צלב קנים. בדיקות מראות שחלק מהפרטים נוספו בשלב מאוחר.","vid":"9ArMihGDY88","sec":37},{"tm":"1:10","txt":"תווי פנים רכים ונשיים, אופייניים לדמויות גברים אצל לאונרדו.","vid":"9ArMihGDY88","sec":70},{"tm":"1:42","txt":"החיוך החידתי, אותו חיוך של המונה ליזה.","vid":"9ArMihGDY88","sec":102},{"tm":"2:14","txt":"האצבע מצביעה לשמיים: יוחנן מבשר על ישו והישועה. המחווה הפכה לסמל דתי בציורים מאוחרים.","vid":"9ArMihGDY88","sec":134},{"tm":"3:24","txt":"ספומאטו: קווי המתאר מטושטשים והאור רך.","vid":"9ArMihGDY88","sec":204},{"tm":"3:56","txt":"הרקע הכהה נותן לדמות נפח של פסל, כאילו היא מסתובבת אלינו מתוך הציור.","vid":"9ArMihGDY88","sec":236},{"tm":"4:30","txt":"האור כטוב וכישועה, מאפלטון ועד אוגוסטינוס, וזה מה שלאונרדו מתרגם לציור.","vid":"9ArMihGDY88","sec":270}],"esrc":"Spencer's Painting of the Week · כתוביות הסרטון"}],"belle_jardiniere":[{"l":"EN","show":"Smarthistory","ep":"Raphael, La belle jardinière","len":"3 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=sv9CHsd546Q",5]],"tr":["Transcript","https://smarthistory.org/raphael-la-belle-jardiniere/"],"at":"כל הסרטון","sum":"סרטון קצר על \"הגננת היפה\" של רפאל: מריה, ישו התינוק ויוחנן המטביל בקומפוזיציית פירמידה של הרנסנס הגבוה, בתוך נוף. האריס וצוקר עוקבים אחרי המבטים ומראים איך היופי עצמו מחליף את ההילה.","elab":[{"tm":"0:16","txt":"קומפוזיציית הפירמידה, סימן ההיכר של הרנסנס הגבוה.","vid":"sv9CHsd546Q","sec":16},{"tm":"0:30","txt":"אין קשתות ואין כס: מריה יושבת על סלע בשדה, והטבע הוא הכס שלה.","vid":"sv9CHsd546Q","sec":30},{"tm":"0:48","txt":"ישו עומד על כף הרגל של אמו, תלוי בה, ובכל זאת מושיט יד לספר.","vid":"sv9CHsd546Q","sec":48},{"tm":"1:05","txt":"הספר מבשר את הצליבה, ומבטה של מריה בוחן אם הוא מוכן לדעת.","vid":"sv9CHsd546Q","sec":65},{"tm":"1:50","txt":"המבטים: יוחנן מביט בישו, ישו במריה, ומריה בחזרה אליו. כולם ממוקדים בישו.","vid":"sv9CHsd546Q","sec":110},{"tm":"2:14","txt":"ההילה כמעט נעלמת. היופי האידיאלי והנוף הם עכשיו ביטוי האלוהות.","vid":"sv9CHsd546Q","sec":134}],"esrc":"Smarthistory · כתוביות הסרטון"}],"mona_lisa":[{"l":"HE","show":"TED-Ed בעברית (השארו סקרנים)","ep":"למה המונה ליזה כל כך מפורסמת? - נוח צ'רני","len":"6 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=dh5ttkug2nk",6]],"tr":null,"at":"כל הסרטון (מדובב לעברית)","sum":"סרטון אנימציה מדובב: למה דווקא המונה ליזה הפכה לציור המפורסם בעולם? חוקר האמנות נוח צ'רני מסביר שהטכניקה של לאונרדו מרשימה, אבל התהילה נבנתה בעיקר מחוץ לבד: מלכי צרפת, וזארי, סופרי המאה ה-19, ובעיקר הגניבה ב-1911.","elab":[{"tm":"0:06","txt":"פתיחה: 21 באוגוסט 1911, וינצ'נצו פרוג'ה מוריד את הציור מהקיר ובורח במדרגות האחוריות של הלובר.","vid":"dh5ttkug2nk","sec":6},{"tm":"0:40","txt":"ההזמנה: סוחר פלורנטיני ביקש ב-1503 דיוקן של אשתו ליזה גראדיני. לאונרדו עבד עליו יותר מעשר שנים ולא סיים.","vid":"dh5ttkug2nk","sec":40},{"tm":"1:07","txt":"פרספקטיבה אווירית וספומאטו: הרקע מטושטש כדי ליצור עומק, והמעברים בין הצבעים רכים.","vid":"dh5ttkug2nk","sec":67},{"tm":"1:52","txt":"פרנסואה הראשון קנה את הציור, ווזארי שיבח אותו ב-1550 בביוגרפיות של אמני הרנסנס.","vid":"dh5ttkug2nk","sec":112},{"tm":"2:26","txt":"הציור היה תלוי בחדר השינה של נפוליאון ואחר כך עבר לתצוגה ציבורית בלובר.","vid":"dh5ttkug2nk","sec":146},{"tm":"2:38","txt":"במאה ה-19 סופרים כמו גוטייה ופייטר יצרו סביב החיוך מיתוס של פיתוי ויופי נשי נצחי.","vid":"dh5ttkug2nk","sec":158},{"tm":"3:24","txt":"הגניבה: פרוג'ה עבד בלובר על ארגזי הגנה. המשטרה חקרה אפילו את פיקאסו, והציור הוחבא שנתיים במזוודה עם תחתית כפולה עד שנתפס בפירנצה.","vid":"dh5ttkug2nk","sec":204},{"tm":"4:42","txt":"אחר כך: דושאן לעג לה, הנאצים חיפשו אותה, מבקרים תקפו אותה באבנים ובחומצה, והיום היא מאחורי זכוכית חסינת כדורים.","vid":"dh5ttkug2nk","sec":282}],"esrc":"TED-Ed בעברית (השארו סקרנים) · כתוביות הסרטון"},{"l":"EN","show":"Smarthistory","ep":"Leonardo, The Mona Lisa — in the Renaissance and today","len":"5 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=B06PK4yZwvY",8]],"tr":["Transcript","https://smarthistory.org/leonardo-mona-lisa/"],"at":"כל הסרטון","sum":"ד\"ר בת' האריס וד\"ר סטיבן צוקר עומדים מול המונה ליזה ומסבירים איך דיוקן פרטי של אשת סוחר מפירנצה הפך לנוסחה חדשה של דיוקן: תנוחה בשלושה רבעים, ידיים, נוף ברקע וספומאטו. בסוף הם שואלים למה דווקא היא הפכה לציור המפורסם בעולם, ומצביעים על הגניבה ב-1911.","elab":[{"tm":"0:14","txt":"החיוך שלא מסגיר מה היא מרגישה: כל אחד קורא בו מה שהוא רוצה. פרויד, למשל, ראה בו מבט אימהי ומפתה בבת אחת.","vid":"B06PK4yZwvY","sec":14},{"tm":"0:48","txt":"דיוקן היה מותרות של מלכים ואצילים. כאן סוחר עשיר מזמין דיוקן של אשתו, סימן לעליית מעמד הסוחרים והבנקאים בפירנצה.","vid":"B06PK4yZwvY","sec":48},{"tm":"1:40","txt":"נוסחה חדשה: במקום פרופיל קפוא, דמות מסובבת בשלושה רבעים עם ידיים שלובות. רפאל ואחרים העתיקו אותה מיד.","vid":"B06PK4yZwvY","sec":100},{"tm":"2:27","txt":"ספומאטו (\"עשן\" באיטלקית): אובך רך שמוחק קווי מתאר חדים ומאחד את הדמות עם הנוף, כאילו היא מגיחה מהחושך.","vid":"B06PK4yZwvY","sec":147},{"tm":"2:59","txt":"בשולי הציור רואים בסיסים של שני עמודים. אולי הלוח נחתך? העתקים מוקדמים מראים את העמודים במלואם.","vid":"B06PK4yZwvY","sec":179},{"tm":"3:20","txt":"לאונרדו מעולם לא מסר את הציור למזמין, ולקח אותו איתו לצרפת בסוף ימיו. לכן הוא בלובר.","vid":"B06PK4yZwvY","sec":200},{"tm":"3:55","txt":"למה דווקא היא? ב-1911 הציור נגנב, הגניבה עשתה כותרות בכל העולם והאיצה את התהילה. דיוקן ביתי צנוע הפך לאייקון שמול אלפי מבקרים.","vid":"B06PK4yZwvY","sec":235}],"esrc":"Smarthistory · כתוביות הסרטון"},{"l":"EN","show":"Great Art Explained (James Payne)","ep":"Mona Lisa (Full Length): Great Art Explained","len":"33 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=ElWG0_kjy_Y",6]],"tr":null,"at":"כל הסרטון (גרסה מורחבת, 33 דק')","sum":"ג'יימס פיין מקדיש סרט ארוך ומדוקדק למונה ליזה: מי היא באמת, איך לאונרדו צייר אותה בשכבות זיגוג דקות, למה אין לה תכשיטים וגבות, ומה מלמד ההעתק במדריד. בסוף הוא מפריך את הטענה שהיא מפורסמת רק בגלל הגניבה.","elab":[{"tm":"2:14","txt":"לאונרדו לקח את הציור איתו לצרפת והמשיך לעבוד עליו עד מותו ב-1519.","vid":"ElWG0_kjy_Y","sec":134},{"tm":"4:08","txt":"פתק משנת 1503 של אגוסטינו וספוצ'י, מזכירו של מקיאוולי, מעיד שלאונרדו מצייר את ליזה דל ג'וקונדו. זה מכריע את שאלת הזהות.","vid":"ElWG0_kjy_Y","sec":248},{"tm":"6:20","txt":"מצוואת בעלה ידוע שלליזה היו תכשיטים רבים, אבל בציור אין אף אחד. זו בחירה מכוונת.","vid":"ElWG0_kjy_Y","sec":380},{"tm":"8:08","txt":"הטכניקה: שכבת בסיס שקופה ומעליה עשרות שכבות זיגוג דקיקות, כך שהאור עובר דרכן ומשתקף.","vid":"ElWG0_kjy_Y","sec":488},{"tm":"10:27","txt":"אין קווי מתאר חדים. פינות הפה והעיניים מטושטשות, ולכן החיוך נשאר פתוח ועמום.","vid":"ElWG0_kjy_Y","sec":627},{"tm":"16:42","txt":"ההעתק שצויר באותו סטודיו (בפראדו) שמור היטב ומראה איך נראו הצבעים המקוריים לפני שהלכה הצהיבה.","vid":"ElWG0_kjy_Y","sec":1002},{"tm":"24:48","txt":"לאונרדו למד את האופטיקה של אבן אל-היית'ם והבין איך העין רואה, ומכאן הספומאטו.","vid":"ElWG0_kjy_Y","sec":1488},{"tm":"27:13","txt":"\"היא מפורסמת רק בגלל הגניבה\"? שטות, אומר פיין: היא נחשבה ליצירת מופת מההתחלה. הגניבה ב-1911 רק הוסיפה.","vid":"ElWG0_kjy_Y","sec":1633}],"esrc":"Great Art Explained (James Payne) · כתוביות הסרטון"}],"wedding_cana":[{"l":"EN","show":"Stories of Art (Carel Huydecoper)","ep":"Wedding Feast at Cana By Paolo Veronese - Must See at The Louvre","len":"14 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=BOWZTyBLCiM",6]],"tr":null,"at":"כל הסרטון","sum":"\"הציור הכי מוזנח בעולם\": הציור הגדול בלובר תלוי מול המונה ליזה, וכולם מפנים לו גב. קרל האידקופר מסביר את ההזמנה לחדר האוכל של מנזר סן ג'ורג'ו מאג'ורה בוונציה, את נס היין, ואת הדיוקנאות המוסתרים, כולל להקה של ציירי ונציה.","elab":[{"tm":"0:48","txt":"איפה למצוא אותו: מאחורי המונה ליזה, על קיר ענק באותו אולם. ברוחב כ-10 מטרים.","vid":"BOWZTyBLCiM","sec":48},{"tm":"1:36","txt":"צויר ב-1563 לחדר האוכל (רפקטוריון) של מנזר סן ג'ורג'ו מאג'ורה בוונציה. הארכיטקטורה בציור המשיכה את זו של האולם.","vid":"BOWZTyBLCiM","sec":96},{"tm":"3:47","txt":"הסיפור: הנס הראשון של ישו. היין נגמר, מריה מבקשת, והמים הופכים ליין.","vid":"BOWZTyBLCiM","sec":227},{"tm":"5:07","txt":"מימין כדי האבן שמהם מוזגים את היין החדש.","vid":"BOWZTyBLCiM","sec":307},{"tm":"6:42","txt":"משמאל המשגיח בירוק מספר לחתן שהיין החדש טוב מהקודם, ההפך מהמנהג להגיש קודם את היין הטוב.","vid":"BOWZTyBLCiM","sec":402},{"tm":"8:28","txt":"דיוקנאות של אישים: נאמר שהאיש בצהוב הוא סולימאן המפואר, ויש גם דוג'ה של ונציה.","vid":"BOWZTyBLCiM","sec":508},{"tm":"10:51","txt":"פרט מוזר: אוכלים קינוח, ומעל ישו קוצבים כבש, רמז להקרבה.","vid":"BOWZTyBLCiM","sec":651},{"tm":"11:31","txt":"הלהקה במרכז היא ציירי ונציה: ורונזה בלבן, טינטורטו, בסאנו, וטיציאן הזקן בבס (ויולונה).","vid":"BOWZTyBLCiM","sec":691}],"esrc":"Stories of Art (Carel Huydecoper) · כתוביות הסרטון"}],"castiglione":[{"l":"EN","show":"TheHistoryOfArt","ep":"Raphael’s Formula for the Perfect Portrait | Italian Renaissance Art History Documentary","len":"14 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=UUDw7WhMYcg",283]],"tr":null,"at":"4:43–5:10, ואזכורים קצרים ב-7:31, 8:22 ו-11:06 (בתוך סרט על הדיוקנאות של רפאל)","sum":"סרט על \"הנוסחה\" של רפאל לדיוקן המושלם, ודיוקן בלדסרה קסטיליונה בלובר משמש בו כדוגמה חוזרת: צבעים מאופקים של אפור וחום, משולש יציב של ראש, כתפיים וידיים, ומבט של אינטליגנציה שקטה.","elab":[{"tm":"4:43","txt":"קסטיליונה, מחבר \"ספר החצרן\": פלטה מאופקת של אפור וחום ופנים של אינטליגנציה שקטה.","vid":"UUDw7WhMYcg","sec":283},{"tm":"5:03","txt":"איזון, אור אטמוספרי ונוכחות פסיכולוגית בלי תיאטרליות.","vid":"UUDw7WhMYcg","sec":303},{"tm":"7:31","txt":"משולש של ראש, כתפיים וידיים משולבות שיוצר יציבות שקטה.","vid":"UUDw7WhMYcg","sec":451},{"tm":"8:22","txt":"האפור והחום העמומים נותנים לגווני העור החמים \"לנשום\".","vid":"UUDw7WhMYcg","sec":502},{"tm":"11:06","txt":"הקלילות לכאורה היא תוצאה של חזרות ורישומי הכנה בלי סוף.","vid":"UUDw7WhMYcg","sec":666}],"esrc":"TheHistoryOfArt · כתוביות הסרטון"}],"caravaggio_death_virgin":[{"l":"EN","show":"Smarthistory","ep":"Caravaggio, Death of the Virgin","len":"4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=TkH-yjJ35vU",7]],"tr":["Transcript","https://smarthistory.org/caravaggio-death-of-the-virgin/"],"at":"כל הסרטון","sum":"האריס וצוקר מסבירים למה \"מות הבתולה\" של קאראווג'ו נדחה על ידי הכנסייה שהזמינה אותו: מריה מוצגת כגופה של אישה פשוטה, נפוחה, יחפה ובלי הילה כמעט, בלי מלאכים ובלי עלייה לשמיים. במקום נס, אבל אנושי אמיתי.","elab":[{"tm":"0:20","txt":"טנבריזם: חושך עמוק ואור חד, ואנחנו קרובים מאוד לסצנה. במקום מלאכים שמעלים את מריה לשמיים, יש רק מוות יומיומי.","vid":"TkH-yjJ35vU","sec":20},{"tm":"0:50","txt":"רק הילה דקיקה מסגירה שזו מריה. השיער פרוע, הבטן נפוחה והרגליים יחפות, ובעיני בני התקופה זה היה לא צנוע.","vid":"TkH-yjJ35vU","sec":50},{"tm":"1:05","txt":"נטען שקאראווג'ו השתמש בזונה כדוגמנית, ושהגופה נראית כמו טבועה שנמשתה מהנהר. הנזירים דחו את הציור.","vid":"TkH-yjJ35vU","sec":65},{"tm":"1:31","txt":"מגדלנה הבוכה בחזית כמעט נוגעת בנו, וקאראווג'ו פותח לנו מקום בין האבלים.","vid":"TkH-yjJ35vU","sec":91},{"tm":"1:50","txt":"השליחים הם אנשים פשוטים וקירחים, בלי אידיאליזציה. זה העניין של קאראווג'ו בעניים ובנמוכים.","vid":"TkH-yjJ35vU","sec":110},{"tm":"2:06","txt":"הווילון האדום הענק למעלה ממסגר את הסצנה כמו תיאטרון.","vid":"TkH-yjJ35vU","sec":126},{"tm":"3:20","txt":"היד המשתלשלת והאצבעות הרפויות: גוף מת באמת, בלי שום רמז להתעלות רוחנית.","vid":"TkH-yjJ35vU","sec":200}],"esrc":"Smarthistory · כתוביות הסרטון"}],"caravaggio_fortune_teller":[{"l":"EN","show":"Matthew McCormick – Caravaggio series","ep":"Caravaggio Paints the Street: Bacchus, the Cardsharps, the Fortune Teller | Session I, Ep. 4","len":"6 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=Nl4sdJft8Kg",179]],"tr":null,"at":"2:59–4:35 (ושוב ב-5:45). לפני כן על \"בכחוס\", ואחרי כן על \"רמאי הקלפים\"","sum":"פרק בסדרה על קאראווג'ו שמסביר איך הוא הפך את ציור הז'אנר לסיפור רחוב דרמטי. ב\"מגדת העתידות\" צוענייה קוראת בכף ידו של צעיר מגונדר ושולפת לו את הטבעת מהאצבע. הדוגמנים היו אנשים מהשכונה, וקאראווג'ו צייר אותם ישר על הבד. (הקריין לא מבחין בין הגרסה בלובר לגרסה ברומא.)","elab":[{"tm":"2:59","txt":"ציור ז'אנר היה הרגל צפון-אירופי ולרוב משעמם. קאראווג'ו מילא אותו בחיי רחוב, מתח ורגש.","vid":"Nl4sdJft8Kg","sec":179},{"tm":"3:21","txt":"הצעיר מוקסם מהנערה הצוענייה ולא שם לב שהיא מחליקה את הטבעת מאצבעו.","vid":"Nl4sdJft8Kg","sec":201},{"tm":"3:32","txt":"הדוגמנים היו כנראה צעירים מהשכונה. קאראווג'ו לא השאיר רישומים וצייר ישר על הבד.","vid":"Nl4sdJft8Kg","sec":212},{"tm":"3:47","txt":"הצעיר הוא כנראה מריו מיניטי, חבר סיציליאני שמופיע בכמה מציוריו.","vid":"Nl4sdJft8Kg","sec":227},{"tm":"4:11","txt":"עם חרב וכובע נוצה הוא משחק את ה\"בראבו\", בריון רחוב מגונדר, תמים ומאוהב.","vid":"Nl4sdJft8Kg","sec":251},{"tm":"4:19","txt":"בדרך כלל ציירו צוענים כמלוכלכים ומסוכנים. אצל קאראווג'ו היא גנבת יפה ומטופחת שגונבת לב וטבעת.","vid":"Nl4sdJft8Kg","sec":259},{"tm":"5:45","txt":"הציורים נמכרו דרך סוחר קטן, והקרדינל דל מונטה קנה את \"מגדת העתידות\" ואת \"רמאי הקלפים\".","vid":"Nl4sdJft8Kg","sec":345}],"esrc":"Matthew McCormick – Caravaggio series · כתוביות הסרטון"}],"napoleon3_apartments":[{"l":"EN","show":"Sir Luxury Travel","ep":"Inside The Most LUXURIOUS \"Apartments\" In Paris: Napoleon III's Louvre Apartments","len":"19 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=PbmhSsJFjGo",63]],"tr":null,"at":"מ-1:03. סיור בחדרים עד 4:19, ואחריו ההיסטוריה של הבנייה","sum":"סיור מצולם ומפורט בדירות נפוליאון השלישי בלובר, שנבנו כמשרדים וכחדרי קבלה של שר המדינה באימפריה השנייה. הקריין מתאר את הסלון הגדול, חדר העבודה וחדרי השינה, ואז את פרויקט \"הלובר החדש\" של לואי נפוליאון והאדריכל לפואל. הטון קליל ומשועשע, והתמונות מצוינות.","elab":[{"tm":"1:03","txt":"הכניסה לדירות: \"מקום העבודה המפואר בהיסטוריה\". הסלון הגדול מקבל את פני המבקרים.","vid":"PbmhSsJFjGo","sec":63},{"tm":"2:12","txt":"חדר העבודה הפרטי של השר: חיפוי עץ אקזוטי משובץ בעצים יקרים עוד יותר.","vid":"PbmhSsJFjGo","sec":132},{"tm":"3:16","txt":"החדרים הפרטיים וחדרי השינה, וחדר מבוא עם עמודי שיש.","vid":"PbmhSsJFjGo","sec":196},{"tm":"4:19","txt":"איך זה נבנה: פרויקט \"הלובר החדש\" של לואי נפוליאון, שחיבר סוף סוף את הלובר לטווילרי.","vid":"PbmhSsJFjGo","sec":259},{"tm":"5:23","txt":"האדריכל הקטור לפואל, חתן פרס רומא, שקיבל לידיו את האתר ב-1853.","vid":"PbmhSsJFjGo","sec":323},{"tm":"8:36","txt":"מתחת לדירות: אורוות ל-149 סוסים ו-34 כרכרות, מסגרות ברזל וחלונות גג מזכוכית.","vid":"PbmhSsJFjGo","sec":516},{"tm":"12:51","txt":"חיי היומיום בפאר: ידיות ברונזה מוזהבת, שיש ותקרות גבוהות שמתחרות באופרה גרנייה.","vid":"PbmhSsJFjGo","sec":771},{"tm":"14:59","txt":"השחזור מאפשר לראות את החדרים כמעט כפי שנראו באימפריה השנייה.","vid":"PbmhSsJFjGo","sec":899}],"esrc":"Sir Luxury Travel · כתוביות הסרטון"}],"bosch_ship_of_fools":[{"l":"EN","show":"Art Lectures","ep":"Hieronymus Bosch's 'The ship of fools': A satirical masterpiece","len":"3 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=Rja-p0nvyls",0]],"tr":null,"at":"כל הסרטון (3 דק')","sum":"הסבר קצר על \"ספינת השוטים\" של בוש (בערך 1490–1500): סאטירה על חברה ששקועה בזלילה, שתייה וצביעות דתית, וסירה שאין מי שינווט אותה. הסרטון מפענח את הסמלים, מהמצקת ששמשת כמשוט ועד דגל הסהר והינשוף.","elab":[{"tm":"0:25","txt":"שמן על עץ, בלובר. במקור חלק מטריפטיכון עם \"אלגוריה של זלילה ותאווה\" ו\"המוות והקמצן\". ההשראה: \"ספינת השוטים\" של סבסטיאן ברנט (1494).","vid":"Rja-p0nvyls","sec":25},{"tm":"0:51","txt":"סירה קטנה שנסחפת בים החיים, עמוסה באנשים שזוללים, שותים ושרים, ואין מי שמנווט.","vid":"Rja-p0nvyls","sec":51},{"tm":"1:22","txt":"נזירה מנגנת בלאוטה ונזיר שר: צביעות דתית. בירכתיים מישהו חותר עם מצקת עץ.","vid":"Rja-p0nvyls","sec":82},{"tm":"1:54","txt":"דגל עם סהר, רמז ל-lunacy (טירוף, מ-luna). בעץ שמשמש תורן יושב ינשוף, סמל לאיוולת.","vid":"Rja-p0nvyls","sec":114},{"tm":"2:20","txt":"ביקורת על החברה של ימי הביניים, וגם על הנטייה האנושית לאיוולת בכל זמן.","vid":"Rja-p0nvyls","sec":140}],"esrc":"Art Lectures · כתוביות הסרטון"}],"van_eyck_rolin":[{"l":"EN","show":"Amuze Art Lectures","ep":"Madonna of Chancellor Rolin (1435) by Jan van Eyck","len":"7 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=Hahur-E9gjY",3]],"tr":null,"at":"כל הסרטון","sum":"הרצאה קצרה על \"הבתולה של הקנצלר רולן\" של יאן ואן אייק (בערך 1435): ציור קטן ומלא פרטים מיקרוסקופיים. המרצה מפענחת את הסמלים, הטווסים, הפרחים, הגשר בעל שבע הקשתות, ואת הסצנות המקראיות הזעירות בכותרות העמודים מעל ראשו של רולן.","elab":[{"tm":"0:03","txt":"הבסיס: בארמון בסגנון רומי, הקנצלר ניקולא רולן כורע מול מריה וישו התינוק.","vid":"Hahur-E9gjY","sec":3},{"tm":"0:34","txt":"מריה בשמלה אדומה ומבט מושפל. ישו מברך את רולן ומחזיק כדור עם צלב, ומלאך מניח על מריה כתר.","vid":"Hahur-E9gjY","sec":34},{"tm":"1:08","txt":"רולן היה קנצלר בורגונדיה תחת פיליפ הטוב, והזמין את הציור לקפלה המשפחתית באוטן.","vid":"Hahur-E9gjY","sec":68},{"tm":"1:44","txt":"בלובר קל לפספס אותו בסוף הביקור, אחרי הציורים הענקיים. צריך לעמוד קרוב.","vid":"Hahur-E9gjY","sec":104},{"tm":"2:58","txt":"כל פרט הוא סמל. שלושת הטווסים ברקע הם סמל לאלמוות.","vid":"Hahur-E9gjY","sec":178},{"tm":"3:31","txt":"הפרחים כמידות של מריה: חבצלות לטוהר, אדמוניות לגן עדן, ורד לסבל ישו, אירוסים לכאב מריה. האנפות מסמלות מוות.","vid":"Hahur-E9gjY","sec":211},{"tm":"4:01","txt":"ברקע: מגדלי כנסייה מאחורי ישו, וגשר בן שבע קשתות שמחבר בין העם לכנסייה. יש שמזהים את העיר כירושלים החדשה.","vid":"Hahur-E9gjY","sec":241},{"tm":"4:31","txt":"בכותרות העמודים מעל רולן סצנות בגודל 2.5 ס\"מ: גירוש מגן עדן, קין והבל, שכרות נח. ייתכן שבני נח רומזים לבניו של רולן.","vid":"Hahur-E9gjY","sec":271}],"esrc":"Amuze Art Lectures · כתוביות הסרטון"}],"poussin_four_seasons":[{"l":"FR","show":"HUB Scuola","ep":"Les Quatre Saisons de Poussin","len":"3 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=YP_9jr7mxvk",7]],"tr":null,"at":"כל הסרטון (בצרפתית)","sum":"הסבר קצר וברור בצרפתית על \"ארבע העונות\" של פוסן, שצוירו ב-1660–1664 בסוף חייו: כל עונה היא סיפור מהתנ\"ך, והדמויות קטנות בתוך נופים ענקיים. המרצה מראה איך הסדרה היא מדיטציה על הזמן: שעות היום, גילאי האדם ותולדות האנושות.","elab":[{"tm":"0:07","txt":"פוסן, זקן וחולה, צייר בין 1660 ל-1664 את ארבעת הבדים, \"הכתר\" של יצירתו.","vid":"YP_9jr7mxvk","sec":7},{"tm":"0:31","txt":"אביב: אדם וחוה בגן עדן. קיץ: רות ובועז, אבות דוד. סתיו: המרגלים שחוזרים עם אשכול ענבים ענק.","vid":"YP_9jr7mxvk","sec":31},{"tm":"0:54","txt":"חורף: המבול. הבד האפל והמפורסם מכולם, עם אנשים מיואשים במים ותיבת נח שמתרחקת.","vid":"YP_9jr7mxvk","sec":54},{"tm":"1:18","txt":"צבע מוביל לכל בד: ירוק לאביב, צהוב לקיץ, כחול לסתיו ושחור לחורף.","vid":"YP_9jr7mxvk","sec":78},{"tm":"1:43","txt":"החידוש: בדרך כלל הדמויות תופסות את רוב הבד, וכאן הן זעירות בתוך טבע עצום.","vid":"YP_9jr7mxvk","sec":103},{"tm":"2:05","txt":"מבוקר (אביב) עד ערב (חורף), ומילדות עד מוות: מדיטציה על הזמן שעובר.","vid":"YP_9jr7mxvk","sec":125},{"tm":"2:29","txt":"שילוב של המחשבה הנוצרית ושל העת העתיקה היוונית-רומית, שתי מקורות ההשראה של פוסן.","vid":"YP_9jr7mxvk","sec":149}],"esrc":"HUB Scuola · כתוביות הסרטון"}],"poussin_manna":[{"l":"EN","show":"Canal Educatif à la Demande (CED)","ep":"Nicolas Poussin in Le Louvre - The Gathering of Manna (HD version)","len":"18 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=L6IlhxxOdGI",0]],"tr":null,"at":"כל הסרטון (18 דק')","sum":"סרט חינוכי של CED שמפרק את \"המן במדבר\" של פוסן: למה הציור נראה בהתחלה עמוס ומבלבל, ואיך כל קבוצה בו היא סיפור אנושי, מייאוש לשמחה ולאמונה. הסרט מראה שפוסן עוסק פחות בנס ויותר בשאלת הבחירה החופשית, ברוח \"הפואטיקה\" של אריסטו.","elab":[{"tm":"0:00","txt":"במבט ראשון הציור מטריד: יותר מדי אנשים ויותר מדי דברים קורים בבת אחת.","vid":"L6IlhxxOdGI","sec":0},{"tm":"1:11","txt":"הקבוצות: אישה מניקה את אמה הרעבה ומבקשת מבנה לחכות לתורו, צעיר מראה משהו לזקן ומודה לשמיים.","vid":"L6IlhxxOdGI","sec":71},{"tm":"2:14","txt":"הנושא: סיפור המן מספר שמות, בני ישראל במדבר אחרי יציאת מצרים.","vid":"L6IlhxxOdGI","sec":134},{"tm":"3:20","txt":"השוואה לגווידו רני: שם האל מופיע ומשה מרכזי. אצל פוסן משה עומד בצל באמצע, והנס לא במרכז.","vid":"L6IlhxxOdGI","sec":200},{"tm":"5:28","txt":"כתמי צבע צהובים וכחולים מכוונים את העין מקבוצה לקבוצה.","vid":"L6IlhxxOdGI","sec":328},{"tm":"7:32","txt":"המן לא רק משביע את הרעב, הוא גם מבחן מוסרי: האם האישה מימין קוראת לשתף או לשמור?","vid":"L6IlhxxOdGI","sec":452},{"tm":"9:40","txt":"השאלה שהעסיקה את התקופה: האם בעולם של חוקי טבע יש מקום לבחירה חופשית?","vid":"L6IlhxxOdGI","sec":580},{"tm":"11:46","txt":"ההשפעה של \"הפואטיקה\" של אריסטו: ציור שמספר עלילה הגיונית ומפתיעה כמו טרגדיה.","vid":"L6IlhxxOdGI","sec":706},{"tm":"14:50","txt":"מייאוש לשמחה ומשמחה לאמונה. כל הרגשות מוצגים בתמונה אחת.","vid":"L6IlhxxOdGI","sec":890}],"esrc":"Canal Educatif à la Demande (CED) · כתוביות הסרטון"}],"pieta_villeneuve":[{"l":"EN","show":"Smarthistory","ep":"Enguerrand Quarton(?), Pietà of Villeneuve-lès-Avignon","len":"6 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=_0YdFG17fQc",6]],"tr":["Transcript","https://smarthistory.org/enguerrand-quarton-pieta-of-villeneuve-les-avignon/"],"at":"כל הסרטון","sum":"הסבר על הפייטה מווילנב-לז-אביניון, המיוחסת לאנגרן קרטון מפרובנס: השפעה של הרנסנס הצפוני, אבל רגש מאופק ודמויות בודדות בצערן. ברקע עיר עם צריחים וסהרונים, אולי קונסטנטינופול שנפלה זה עתה.","elab":[{"tm":"0:12","txt":"למה \"מיוחס\"? אין חוזה לציור הזה. מזהים את הצייר לפי דמיון סגנוני ליצירות מתועדות שלו.","vid":"_0YdFG17fQc","sec":12},{"tm":"0:58","txt":"דיוק אנטומי: הצלעות, הברכיים וכפות הרגליים של ישו, בהשפעת ואן אייק ורוחייה ואן דר ויידן.","vid":"_0YdFG17fQc","sec":58},{"tm":"1:24","txt":"מריה מגדלנה בוכה עם צנצנת הבשמים. מריה במרכז בגלימה כחולה, באבל שקט.","vid":"_0YdFG17fQc","sec":84},{"tm":"2:27","txt":"יוחנן מסיר בעדינות את כתר הקוצים, ואצבעותיו כאילו פורטות על קרני ההילה כמו על נבל.","vid":"_0YdFG17fQc","sec":147},{"tm":"2:32","txt":"משמאל התורם כורע בתפילה, דיוקן ריאליסטי של כומר שלא זוהה.","vid":"_0YdFG17fQc","sec":152},{"tm":"3:27","txt":"ברקע כיפות וצריחים עם סהרונים: אולי קונסטנטינופול, שנכבשה בידי העות'מאנים זמן קצר לפני כן.","vid":"_0YdFG17fQc","sec":207},{"tm":"5:25","txt":"רקע הזהב: עלה זהב על שכבת חימר אדום (בול) שנותנת לו ברק חם.","vid":"_0YdFG17fQc","sec":325}],"esrc":"Smarthistory · כתוביות הסרטון"}],"vermeer_lacemaker":[{"l":"EN","show":"Hotel Vanski","ep":"How Did Vermeer Paint This 350 Years Ago? (The Lacemaker)","len":"9 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=cXj7b2NMbWk",0]],"tr":null,"at":"כל הסרטון","sum":"איך ורמיר צייר כמו מצלמה, מאתיים שנה לפני הצילום? הסרטון בוחן את \"עושת התחרה\" הזעירה: החוטים המטושטשים בחזית מול האצבעות החדות, השאלה אם ורמיר השתמש בקמרה אובסקורה, וסוף חייו העצוב.","elab":[{"tm":"0:00","txt":"החוטים האדומים והלבנים בחזית מטושטשים, והאצבעות מעליהם חדות לגמרי. ככה רואה עדשה.","vid":"cXj7b2NMbWk","sec":0},{"tm":"0:30","txt":"הציור זעיר, כ-24 ס\"מ, קטן מדף מדפסת.","vid":"cXj7b2NMbWk","sec":30},{"tm":"1:32","txt":"הטשטוש הוא זרקור: העין מדלגת עליו ונוחתת על האצבעות, בדיוק במקום שהיא מביטה בו.","vid":"cXj7b2NMbWk","sec":92},{"tm":"3:12","txt":"אנחנו כמעט לא יודעים כלום על ורמיר: אין מכתבים, אין יומן, אף רישום לא שרד.","vid":"cXj7b2NMbWk","sec":192},{"tm":"3:50","txt":"קמרה אובסקורה (\"חדר חשוך\"): עדשה בחור בקיר מקרינה את העולם בצבעים על הקיר שממול.","vid":"cXj7b2NMbWk","sec":230},{"tm":"4:53","txt":"ב-2001 שחזר האדריכל פיליפ סטדמן את החדר של ורמיר וחישב איפה הייתה צריכה לעמוד עדשה. אחריו טים ג'ניסון ניסה בעצמו.","vid":"cXj7b2NMbWk","sec":293},{"tm":"6:32","txt":"1672: מלחמה, אף אחד לא קונה ציורים. ורמיר מת ב-1675 בגיל 43, והאלמנה נותנת לאופה שני ציורים כדי לכסות את חוב הלחם.","vid":"cXj7b2NMbWk","sec":392},{"tm":"8:02","txt":"המסקנה: החוטים צוירו במשיכות חופשיות ופרועות. אף עדשה לא מציירת ככה. ב-1870 קנה הלובר את הציור.","vid":"cXj7b2NMbWk","sec":482}],"esrc":"Hotel Vanski · כתוביות הסרטון"}],"vermeer_astronomer":[{"l":"EN","show":"Accessible Art History – The Podcast","ep":"Accessible Art History: The Podcast: Episode 25: The Astronomer by Johannes Vermeer","len":"11 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=L-sr1qNz4wE",59]],"tr":null,"at":"מ-0:59 עד 5:30, ואחרי פרסומות ממשיך מ-7:21","sum":"פרק פודקאסט על \"האסטרונום\" של ורמיר: האור מהחלון, הגלובוס השמימי והספר על השולחן, והקשר לציור התאום \"הגאוגרף\". הוא מציג את ורמיר בהקשר המהפכה המדעית בדלפט ואת השערת הקמרה אובסקורה.","elab":[{"tm":"0:59","txt":"אור בהיר נכנס מהחלון. האסטרונום מתרומם מכיסאו כאילו גילה משהו: רגע אחד שקפא.","vid":"L-sr1qNz4wE","sec":59},{"tm":"1:56","txt":"הגלובוס השמימי של הונדיוס מדויק עד הפרט, ועל השולחן ספר אסטרונומיה.","vid":"L-sr1qNz4wE","sec":116},{"tm":"2:51","txt":"\"הגאוגרף\" של ורמיר צויר באותה תקופה, וכנראה מופיע בו אותו אדם.","vid":"L-sr1qNz4wE","sec":171},{"tm":"3:44","txt":"יש הסבורים שהדוגמן הוא אנטוני ואן לוונהוק, המדען הדלפטי שגילה את החיידקים.","vid":"L-sr1qNz4wE","sec":224},{"tm":"4:40","txt":"המדע מחליף את הכנסייה כמי שמסביר את העולם, והציור משקף את השינוי.","vid":"L-sr1qNz4wE","sec":280},{"tm":"7:21","txt":"ורמיר המסתורי: מתוך כחמישים ציורים שרדו 34, ובחייו לא היה מפורסם.","vid":"L-sr1qNz4wE","sec":441},{"tm":"8:15","txt":"המלחמה עם צרפת ריסקה את שוק האמנות, וורמיר מת בחובות ב-1675.","vid":"L-sr1qNz4wE","sec":495},{"tm":"9:10","txt":"אולטרמרין יקר מלפיס לזולי, ותחושה כמעט צילומית שהולידה את השערת הקמרה אובסקורה.","vid":"L-sr1qNz4wE","sec":550}],"esrc":"Accessible Art History – The Podcast · כתוביות הסרטון"}],"rembrandt_bathsheba":[{"l":"EN","show":"Smarthistory","ep":"Rembrandt, Bathsheba at her Bath","len":"4 דק'","listen":[["YouTube","https://www.youtube.com/watch?v=wsL4Uh0BrQw",4]],"tr":["Transcript","https://smarthistory.org/rembrandt-bathsheba-at-her-bath/"],"at":"כל הסרטון","sum":"שיחה על \"בת שבע\" של רמברנדט: לא רק עירום יפה אלא ציור פסיכולו
