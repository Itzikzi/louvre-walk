<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>הלובר: מקרא ואמנות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#e9e4d8">
<script>document.documentElement.lang="he";document.documentElement.dir="rtl";document.documentElement.dataset.theme="light";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one column, sticky glass header, map card, route list, floating "next" capsule, glass bottom sheet per stop.
   Palette kept from the British Museum app: lapis, carnelian, gold over limestone. */
:root{
  --bg:#ebe6db; --bg2:#ddd6c6;
  --ink:#1d2333; --ink2:#454c60; --ink3:#5c6276;
  --lapis:#2445a3; --lapis-soft:rgba(36,69,163,.12);
  --carnelian:#a83d22; --gold:#85600f; --ok:#1f7a4d; --ok-soft:rgba(31,122,77,.13); --warn-soft:rgba(185,71,42,.13);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95); --shadow:rgba(40,45,70,.16); --line:rgba(29,35,51,.10);
  --room:#cfc6b3; --room-ctx:rgba(29,35,51,.07); --court:rgba(255,255,255,.45);
  --blob1:rgba(36,69,163,.38); --blob2:rgba(185,71,42,.30); --blob3:rgba(169,123,28,.30);
  --map-filter:none; --ov-fill:rgba(242,184,48,.42); --ov-stroke:#f2b830;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-display:"Frank Ruhl Libre","Times New Roman",serif;
  --r-lg:26px; --r-md:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1426; --bg2:#151c33; --ink:#eef0f6; --ink2:#c3c8d8; --ink3:#a0a7bd;
  --lapis:#8aa6ff; --lapis-soft:rgba(138,166,255,.16); --carnelian:#ff8a6a; --gold:#e3b75a; --ok:#5fd39a; --ok-soft:rgba(95,211,154,.15); --warn-soft:rgba(255,138,106,.16);
  --glass:rgba(32,40,68,.48); --glass-strong:rgba(30,37,62,.82); --glass-edge:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.45); --line:rgba(255,255,255,.10); --room:#3a4566; --room-ctx:rgba(255,255,255,.06); --court:rgba(255,255,255,.05);
  --blob1:rgba(70,100,220,.45); --blob2:rgba(200,80,50,.28); --blob3:rgba(200,150,50,.22); --map-filter:invert(.9) hue-rotate(180deg); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1426; --bg2:#151c33; --ink:#eef0f6; --ink2:#c3c8d8; --ink3:#a0a7bd;
  --lapis:#8aa6ff; --lapis-soft:rgba(138,166,255,.16); --carnelian:#ff8a6a; --gold:#e3b75a; --ok:#5fd39a; --ok-soft:rgba(95,211,154,.15); --warn-soft:rgba(255,138,106,.16);
  --glass:rgba(32,40,68,.48); --glass-strong:rgba(30,37,62,.82); --glass-edge:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.45); --line:rgba(255,255,255,.10); --room:#3a4566; --room-ctx:rgba(255,255,255,.06); --court:rgba(255,255,255,.05);
  --blob1:rgba(70,100,220,.45); --blob2:rgba(200,80,50,.28); --blob3:rgba(200,150,50,.22); --map-filter:invert(.9) hue-rotate(180deg); color-scheme:dark}

*{box-sizing:border-box}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 85% 8%,var(--blob1),transparent 70%),
             radial-gradient(35vmax 35vmax at 5% 45%,var(--blob2),transparent 70%),
             radial-gradient(38vmax 38vmax at 70% 95%,var(--blob3),transparent 70%),
             linear-gradient(180deg,var(--bg),var(--bg2))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--glass-strong)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--lapis)}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px;border-radius:10px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px -8px var(--shadow)}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;display:flex;flex-direction:column;gap:14px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;border-radius:0 0 22px 22px;border-top:0}
.top .t{flex:1;min-width:0}
.top h1{margin:0;font-family:var(--f-display);font-size:1.25rem;line-height:1.15;font-weight:700;text-wrap:balance}
.top .sub{font-size:.82rem;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--ink2);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 10px -2px var(--shadow),inset 0 1px 0 var(--glass-hi)}
.controls{display:flex;gap:10px;flex-wrap:wrap}
.controls .seg{flex:1 1 200px;min-width:0}

.alert{border-radius:var(--r-md);padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.alert svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--carnelian)}

.mapcard{border-radius:var(--r-lg);padding:10px;position:relative;overflow:hidden}
.mapscroll{overflow-x:auto;overflow-y:hidden;border-radius:14px;direction:ltr;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;background:#fff}
.mapcard svg.map{width:960px;max-width:none;height:auto;display:block;direction:ltr;touch-action:pan-x pan-y}
.zone{fill:rgba(242,184,48,.16);stroke:var(--ov-stroke);stroke-width:3;cursor:pointer}
.zone.done{fill:rgba(31,160,90,.12);stroke:#2bb673}
.zone.closed{stroke:var(--carnelian);stroke-dasharray:5 4}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink2);padding:4px 6px 2px}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.room-ctx{fill:var(--room-ctx)}
.seg.mini button{min-height:34px;font-size:.85rem}
.realmap{filter:var(--map-filter)}
.room-stop.ov{fill:var(--ov-fill);stroke:var(--ov-stroke);stroke-width:3}
.room-stop.ov.done{fill:rgba(31,160,90,.38);stroke:#2bb673}
.room-stop.ov:hover{fill:var(--ov-fill)}
.room-stop{fill:var(--lapis-soft);stroke:var(--lapis);stroke-width:1.6;cursor:pointer;transition:fill .2s}
.room-stop.done{fill:var(--ok-soft);stroke:var(--ok)}
.room-stop.closed{stroke-dasharray:4 3}
.room-stop:hover{fill:rgba(36,69,163,.22)}
.rnum{font:800 16px var(--f-body);fill:var(--ink2);pointer-events:none;text-anchor:middle;dominant-baseline:central}
.rlab{font:600 11px var(--f-body);fill:var(--ink3);pointer-events:none;text-anchor:middle}
.route{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 7;opacity:.95}
.pin circle{fill:var(--gold);stroke:var(--glass-hi);stroke-width:2}
.pin.done circle{fill:var(--ok)}
.pin.next circle{fill:var(--carnelian)}
.pin text{font:800 14px var(--f-body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin{cursor:pointer}
.mapbtns{display:flex;gap:8px;flex-wrap:wrap;padding:6px}

.secttl{display:flex;align-items:center;gap:10px;margin:8px 4px 0;font-weight:700;color:var(--ink2);font-size:.9rem;letter-spacing:.02em}
.secttl::after{content:"";flex:1;height:1px;background:var(--line)}

.list{display:flex;flex-direction:column;gap:10px}
.stop{border-radius:var(--r-md);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:start;width:100%;min-width:0;overflow:hidden;transition:transform .15s}
.stop:active{transform:scale(.985)}
.num{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.stop.done .num{background:var(--ok)}
.stop.next{outline:2px solid var(--carnelian);outline-offset:-2px}
.stop.next .num{background:var(--carnelian)}
.stop .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stop .row1{display:flex;gap:6px 8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.stop .room{font-weight:800;font-size:1.02rem}
.stop .name{font-weight:600;color:var(--ink2);min-width:0}
.stop .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--ink3)}
.stop .peek{font-size:.88rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:none;font-size:.8rem;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;line-height:1.4;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--warn-soft);color:var(--carnelian)}
.chip.info{background:var(--lapis-soft);color:var(--lapis)}
.chip.star{background:rgba(169,123,28,.16);color:var(--gold)}
.lunch{border-radius:var(--r-md);padding:10px 14px;display:flex;gap:12px;align-items:center;color:var(--ink2);font-size:.92rem;border-style:dashed}
.lunch svg{width:22px;height:22px;flex:none;color:var(--gold)}
.walk{font-size:.84rem;color:var(--ink3);padding:0 18px;display:flex;gap:6px;align-items:center}

.fab{position:fixed;z-index:25;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding:0 max(16px,env(safe-area-inset-left,0px))}
.fab button{pointer-events:auto;border-radius:999px;min-height:56px;padding:8px 22px 8px 10px;display:flex;align-items:center;gap:10px;max-width:100%;font-weight:700;background:var(--glass-strong)}
.fab .num{width:40px;height:40px;background:var(--carnelian)}
.fab .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;min-width:0}
.fab .txt small{font-weight:600;color:var(--ink3);font-size:.75rem}
.fab .txt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,30,.32);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;inset-inline:0;bottom:0;margin:0 auto;max-width:760px;height:calc(100% - 40px - env(safe-area-inset-top,0px));
  border-radius:30px 30px 0 0;border-bottom:0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);background:var(--glass-strong);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sh-head{display:flex;gap:12px;align-items:flex-start;padding:10px max(18px,env(safe-area-inset-left,0px)) 12px;border-bottom:1px solid var(--line);flex:none}
.sh-head .num{width:44px;height:44px;font-size:1.1rem}
.sh-head .t{flex:1;min-width:0}
.sh-head h2{margin:0;font-family:var(--f-display);font-size:1.45rem;line-height:1.15;text-wrap:balance}
.sh-head .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:.85rem;color:var(--ink2);align-items:center}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px max(16px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:12px}
.sh-body>*{flex-shrink:0}
.way{font-size:.92rem;color:var(--ink2);display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--lapis-soft)}
.way svg{width:18px;height:18px;flex:none;margin-top:3px;color:var(--lapis)}
.tabs{position:sticky;top:-14px;z-index:2;margin:-14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

.item{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;background:var(--glass)}
.item.seen{opacity:.72}
.item .hd{display:flex;gap:10px;align-items:flex-start}
.check{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;margin:-6px;}
.check span{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;transition:all .2s}
.check svg{width:16px;height:16px;opacity:0;color:#fff}
.check[aria-checked="true"] span{background:var(--ok);border-color:var(--ok)}
.check[aria-checked="true"] svg{opacity:1}
.item h3{margin:0;font-size:1.08rem;line-height:1.3;font-weight:800}
.item .hd .t{flex:1;min-width:0}
.item .sub{font-size:.84rem;color:var(--ink3);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.item p{margin:0;color:var(--ink);font-size:.97rem}
.note{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;padding:8px 10px;border-radius:12px;background:var(--warn-soft);color:var(--ink)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--carnelian)}
.bible{font-size:.9rem;color:var(--ink2)}
.bible b{color:var(--gold);font-weight:800}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 12px;border-radius:999px;font-size:.86rem;font-weight:700;text-decoration:none;color:var(--lapis);background:var(--lapis-soft);max-width:100%}
.lk svg{width:14px;height:14px;flex:none}
.lk.pri{background:var(--lapis);color:#fff}
:root[data-theme="dark"] .lk.pri{color:#0f1426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk.pri{color:#0f1426}}

.item .panel{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;display:flex;flex-direction:column;gap:8px}
.lk.tg{cursor:pointer;border:1.5px solid var(--lapis);background:transparent}
.lk.tg.on{background:var(--lapis);color:#fff}
:root[data-theme="dark"] .lk.tg.on{color:#0f1426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lk.tg.on{color:#0f1426}}
.lk.tg svg{width:16px;height:16px}
ul.plain,ol.plain{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
p.small{margin:0;font-size:.88rem;color:var(--ink2)}
.item .pods .h4{margin:0}
.pod{border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--room-ctx);min-width:0;overflow:hidden}
.pod .hd{display:flex;gap:8px;align-items:flex-start}
.lang{flex:none;font-size:.72rem;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--bg);margin-top:3px;letter-spacing:.04em}
.pod .ttl{font-weight:800;min-width:0;line-height:1.35}
.pod .ttl .ep{font-weight:600;color:var(--ink2)}
.pod .m{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem;color:var(--ink3)}
.pod p{margin:0;font-size:.93rem;color:var(--ink2)}
.more summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--lapis);min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+";width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--lapis-soft);font-weight:800}
.more[open] summary::before{content:"−"}
.more ul{margin:4px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem;color:var(--ink)}
.ext{margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.ext i{color:var(--ink2)}
.elab{gap:8px!important}
.elab li.hdr{list-style:none;margin-inline-start:-20px;margin-top:6px;color:var(--lapis)}
.elab .tm{display:inline-block;direction:ltr;font-variant-numeric:tabular-nums;font-weight:800;font-size:.8rem;padding:1px 7px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis);text-decoration:none;margin-inline-end:4px}
.more .src{font-size:.78rem;color:var(--ink3);margin-top:6px}
.empty{font-size:.9rem;color:var(--ink3);padding:4px 4px}
.h4{font-weight:800;font-size:.95rem;color:var(--ink2);margin:6px 2px 0;display:flex;align-items:center;gap:8px}
.h4 svg{width:18px;height:18px;color:var(--gold)}

.sh-foot{flex:none;display:flex;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-foot button{flex:1;min-height:52px;border-radius:999px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 10px;min-width:0}
.sh-foot button small{font-weight:600;color:var(--ink3);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sh-foot .nx{background:var(--lapis);color:#fff}
.sh-foot .nx small{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .sh-foot .nx,:root[data-theme="dark"] .sh-foot .nx small{color:#0f1426}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sh-foot .nx,:root:not([data-theme="light"]) .sh-foot .nx small{color:#0f1426}}
.sh-foot button:disabled{opacity:.35}

/* info */
.info h3{font-family:var(--f-display);font-size:1.15rem;margin:8px 0 0}
.info p,.info li{font-size:.95rem;color:var(--ink2)}
.info ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.93rem}
.kv dt{font-weight:800;color:var(--ink)}
.kv dd{margin:0;color:var(--ink2);min-width:0}
.tbl{overflow-x:auto;border-radius:14px;background:var(--glass)}
.tbl table{border-collapse:collapse;font-size:.86rem;min-width:520px;width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tbl th{font-weight:800;color:var(--ink2)}
.pref{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-md);cursor:pointer}
.pref .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pref small{color:var(--ink2);font-size:.85rem}
.pref input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.pref input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.pref input:checked{background:var(--ok)}
.pref input:checked::after{transform:translateX(-20px)}
.foot-note{font-size:.8rem;color:var(--ink3);text-align:center;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">

const ITEMS={"charles6_helmet":{"t":"הלובר של ימי הביניים – קסדת שארל השישי","sub":["Chapel doré : casque de Charles VI / Louvre médiéval","ראשית המאה ה-15","חדר 136","OA 12014"],"p":"בקומת המרתף של אגף סולי נחשפו יסודות המבצר שבנה המלך פיליפ אוגוסט סביב 1200 – החפיר, החומות ובסיס המגדל המרכזי. בתצוגה של 'לובר ימי הביניים' מוצגת קסדת הטקס המוזהבת של שארל השישי, שנמצאה מנופצת בבאר המגדל.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010114735"],["Wikipedia","https://en.wikipedia.org/wiki/Medieval_Louvre_Castle"]],"more":["הקסדה נמצאה ב-1984 בחפירות 'הלובר הגדול' בחצר המרובעת – ביותר מ-150 שברים.","לפי רישומי המוזיאון, גנב שבר אותה כדי למכור את המתכת וזרק את השאר לבאר, לפני שהבאר נסתמה ב-1528.","זו קסדת טקס ולא קסדת קרב: נחושת מוזהבת ומאומלת, עם כתר שושנים (פלר-דה-ליס) – סמל המלוכה הצרפתית.","בדרך לקסדה עוברים לאורך החפיר המקורי ובסיסי המגדלים – אפשר לראות סימני סתתים על האבנים.","מספרי החדרים של החפיר עצמו לא מופיעים באתר האוסף; הקסדה עצמה בחדר 136 ('אולם סן לואי הצפוני')."],"msrc":"אתר הלובר, Wikipedia"},"ramses3_sarcophagus":{"t":"ארון הקבורה של רעמסס השלישי","sub":["Cuve du sarcophage de Ramsès III","1184–1153 לפנה\"ס","חדר 323","N 337 (D 1)"],"p":"ארגז גרניט אדיר של רעמסס השלישי, הפרעה שהדף את 'גויי הים' – ובהם הפלשתים (פְּלֶשֶׁת) – בסביבות 1175 לפנה\"ס. אחרי המפלה התיישבו הפלשתים בשפלת החוף של ארץ ישראל, ומשם הם נכנסים לסיפורי שמשון, שאול ודוד.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010011413"],["ויקיפדיה","https://he.wikipedia.org/wiki/רעמסס_השלישי"],["Wikipedia","https://en.wikipedia.org/wiki/Ramesses_III"]],"b":"עמוס ט:7","more":["המכסה לא כאן: הוא נמצא במוזיאון פיצוויליאם בקיימברידג'.","על הדפנות חרוטים פרקים מ'ספר מה שבעולם התחתון' (השעות 7–8) – מסע השמש בלילה.","איזיס ונפתיס פורשות כנפיים בראש ובכפות הרגליים, כדי לגונן על המלך.","נרכש ב-1826 מאוסף הקונסול הבריטי הנרי סולט.","מוצג ב'קריפטת אוזיריס' בקומה ‎-1, ליד הספינקס."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"sphinx_tanis":{"t":"הספינקס הגדול מטניס","sub":["Sphinx de Tanis / Great Sphinx of Tanis","הממלכה התיכונה (לפי ב. פיי: אמנמחת השני), עם כתובות מאוחרות של מרנפתח ושישק","חדר 338","N 23 (A 23)"],"p":"ספינקס גרניט ורוד באורך 4.8 מ', מהגדולים מחוץ למצרים, שמשמר את הכניסה לאגף המצרי. כמה פרעונים 'מחזרו' אותו וחרטו עליו את שמם – ביניהם מרנפתח ושישק (ששונק הראשון), הפרעה שעלה על ירושלים בימי רחבעם.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010010062"],["Wikipedia","https://en.wikipedia.org/wiki/Great_Sphinx_of_Tanis"]],"star":1,"b":"מלכים א יד:25","more":["טניס היא צוען המקראית: 'וחברון שבע שנים נבנתה לפני צען מצרים' (במדבר יג:22), ו'שדה צוען' של מכות מצרים (תהלים עח:12).","שישק, ששמו מופיע בין הכתובות, 'עלה על ירושלים ויקח את אוצרות בית ה'' (מלכים א יד:25–26).","גם מרנפתח – בעל 'מצבת ישראל' שבקהיר, האזכור החוץ-מקראי הראשון של השם ישראל – הוסיף כאן את שמו.","מידות לפי המוזיאון: אורך 480 ס\"מ, גובה 183 ס\"מ. נרכש ב-1826 מאוסף הנרי סולט.","מוצג ב'קריפטת הספינקס' (חדר 338, קומה ‎-1) – נקודת פתיחה טובה לאגף המצרי."],"msrc":"אתר הלובר, Wikipedia"},"ramses2_abydos":{"t":"קיר מקדש רעמסס השני באבידוס","sub":["Paroi d'un temple de Ramsès II","1279–1212 לפנה\"ס","חדר 324","N 127 / N 128"],"p":"גושי אבן מתוך מקדש שבנה רעמסס השני באבידוס, עם תבליטים צבועים. רעמסס השני הוא המועמד המקובל ביותר ל'פרעה של השעבוד', והעיר 'רעמסס' שבנו בני ישראל קרויה, כנראה, על שמו.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010011438"],["ויקיפדיה","https://he.wikipedia.org/wiki/רעמסס_השני"],["Wikipedia","https://en.wikipedia.org/wiki/Ramesses_II"]],"b":"שמות א:11","more":["'ויבן ערי מסכנות לפרעה את פתם ואת רעמסס' (שמות א:11) – פי-רעמסס הייתה בירתו של רעמסס השני בדלתא.","רעמסס השני שלט 66 שנה ובנה יותר מכל פרעה אחר; שמו חרוט על מאות מונומנטים, לפעמים מעל שמות של קודמיו.","אין שום ממצא שמזכיר את יציאת מצרים במפורש – הזיהוי עם רעמסס השני נשען על שם העיר ועל ההקשר ההיסטורי.","מוצג בחדר 'המקדש' (324), סמוך לגלגל המזלות מדנדרה."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"dendera_zodiac":{"t":"גלגל המזלות מדנדרה","sub":["Zodiaque de Dendéra","בערך 50 לפנה\"ס (קלאופטרה השביעית)","חדר 325","E 13482 (D 38)"],"p":"תקרת אבן עגולה מקפלה על גג מקדש חתחור בדנדרה – מפת שמיים מצרית שמשלבת את 12 המזלות הבבליים-יווניים עם קבוצות כוכבים מצריות. אחד המקורות הקדומים והשלמים למפת השמיים העתיקה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010028871"],["Wikipedia","https://en.wikipedia.org/wiki/Dendera_zodiac"]],"more":["ב-1821 עקרו אותה שליחים צרפתים מהתקרה בחומרי נפץ ובמסורים ושלחו אותה לפריז; לואי ה-18 קנה אותה.","בדנדרה עצמה תלוי היום עותק גבס במקום המקור.","המזלות המוכרים – טלה, שור, תאומים ועוד – מופיעים לצד אלים מצריים, ומראים איך אסטרונומיה בבלית הגיעה למצרים התלמית.","כדאי להסתכל מתחת: התקרה מוצגת כמו במקורה, ואפשר לראות את ארבע הדמויות הנושאות את 'כיפת השמיים'."],"msrc":"אתר הלובר, Wikipedia"},"akhethetep_mastaba":{"t":"קפלת המסטבה של אח'תחותפ","sub":["Mastaba d'Akhethétep","בערך 2490–2432 לפנה\"ס (השושלת החמישית)","חדר 333","E 10958 A"],"p":"קפלת קבורה שלמה של פקיד מהממלכה הקדומה, שהובאה מסקארה ונבנתה מחדש בלובר – אפשר ממש להיכנס פנימה. על הקירות סצנות של חיי יום-יום: חקלאות, דיג, הגשת מנחות וספירת מסים.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010077681"],["Wikipedia","https://en.wikipedia.org/wiki/Akhethetep"]],"more":["המוזיאון קנה את הקפלה ב-1903 מרשות העתיקות המצרית.","בקיר האחורי 'דלת מדומה' – פתח סמלי שדרכו רוחו של המת יוצאת לקבל מנחות.","סצנת 'הצגת החשבונות' מראה סופרים רושמים מסים – רקע יפה לתיאורי הבירוקרטיה המצרית בסיפור יוסף, אם כי הקפלה קדומה ממנו בהרבה.","מידות החדר: כ-4.3 מ' גובה ו-4.8 מ' אורך."],"msrc":"אתר הלובר, Wikipedia"},"baal_stele":{"t":"מצבת 'בעל עם הברק' מאוגרית","sub":["Stèle du Baal au foudre / Baal with Thunderbolt","תקופת הברונזה התיכונה–המאוחרת (2000–1150 לפנה\"ס לפי המוזיאון)","חדר 301","AO 15775"],"p":"הדמות הכי מוחשית של בעל, אל הסערה הכנעני: הוא מניף אלה ביד אחת ומחזיק ביד השנייה ברק שצומח כמו ענף. זה האל שנגדו נאבקו אליהו והנביאים – 'עד מתי אתם פוסחים על שתי הסעיפים'.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010140542"],["ויקיפדיה","https://he.wikipedia.org/wiki/בעל_(אל)"],["Wikipedia","https://en.wikipedia.org/wiki/Baal_with_Thunderbolt"]],"star":1,"b":"מלכים א יח:21","more":["נמצאה ב-28 במאי 1932 על האקרופוליס של אוגרית, ממערב למקדש בעל, במשלחת של קלוד שפר.","בעל עומד מעל הרים וים – רמז למיתוס האוגריתי שבו הוא מנצח את ים, אל הים.","דמות קטנה בבגד ארוך לרגליו היא, כנראה, מלך אוגרית שעומד תחת חסותו.","התואר האוגריתי של בעל, 'רוכב ערפות' (רוכב העננים), מזכיר את 'סלו לרוכב בערבות' (תהלים סח:5).","גובה: 144 ס\"מ."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"ugarit_abecedary":{"t":"לוח האלפבית מאוגרית","sub":["Abécédaire cunéiforme (tablette)","1400–1200 לפנה\"ס","חדר 301","AO 19992"],"p":"לוח חרס קטן ועליו רשימת אותיות האלפבית האוגריתי – כתב יתדות שהוא אלפבית של ממש ולא כתב הברתי. סדר האותיות כמעט זהה לסדר א-ב-ג-ד העברי, הוכחה שסדר האלפבית שלנו קיים כבר יותר מ-3,300 שנה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010144705"],["ויקיפדיה","https://he.wikipedia.org/wiki/אלפבית_אוגריתי"],["Wikipedia","https://en.wikipedia.org/wiki/Ugaritic_alphabet"]],"more":["באלפבית האוגריתי 30 אותיות; בלוח הזה חסרות שבע (לפי המוזיאון).","השפה האוגריתית קרובה לעברית המקראית, והטקסטים מאוגרית שופכים אור על מילים קשות בתנ\"ך.","הכתב נראה כמו כתב יתדות בבלי, אבל כל סימן מייצג עיצור אחד – בדיוק כמו באלפבית הכנעני-עברי.","מוצג בוויטרינה 5 'כתובות אלפביתיות' בחדר 301."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"mesha_stele":{"t":"מצבת מישע (האבן המואבית)","sub":["Stèle de Mesha / Mesha Stele","המאה ה-9 לפנה\"ס (ימי מישע)","חדר 303","AO 5066"],"p":"34 שורות בשפה המואבית (קרובה מאוד לעברית), שבהן מישע מלך מואב מתאר את מרידתו בישראל אחרי מות אחאב – אותו מרד שמתואר במלכים ב ג. זה אחד המסמכים החוץ-מקראיים החשובים ביותר: הוא מזכיר את עמרי מלך ישראל, את האל כמוש, ואת השם יהוה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010120339"],["ויקיפדיה","https://he.wikipedia.org/wiki/מצבת_מישע"],["Wikipedia","https://en.wikipedia.org/wiki/Mesha_Stele"]],"star":1,"b":"מלכים ב ג:4-27","more":["'עמרי מלך ישראל ויענו את מאב ימן רבן' – מישע מאשר את השתלטות בית עמרי על מואב, כמו בתנ\"ך ('ומישע מלך מואב היה נקד', מלכים ב ג:4).","בשורה 18 מישע מתפאר שלקח מנבו 'את כלי יהוה' – האזכור החוץ-מקראי הקדום ביותר של שם ה'.","בשורה 31 הציע אנדרה למר ב-1994 לקרוא 'בית דוד'. ב-2019 הציעו פינקלשטיין, נאמן ורומר לקרוא 'בלק', אבל צילומי RTI חדשים שפרסם מישל לנגלואה ב-2022 חיזקו את הקריאה 'בית דוד' – והוויכוח עדיין פתוח.","המצבה התגלתה ב-1868. בדואים ניפצו אותה (לפי המסורת חיממו אותה באש ושפכו עליה מים קרים), אבל לפני כן הספיק שארל קלרמון-גאנו להכין טביעת נייר של הכתובת – וכך שוחזר הטקסט.","מה שרואים היום הוא שברים מקוריים משולבים בשחזור גבס; כדאי לחפש את ההבדל בצבע.","מוצגת בחדר 303, לצד מצבת שיחאן (האל המואבי) ומכתב אל-עמארנה ממגידו."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"shihan_stele":{"t":"מצבת שיחאן – אל לוחם מואבי","sub":["Stèle de Shihan","כנראה המאות ה-13–12 לפנה\"ס (תיארוך לא ודאי)","חדר 303","AO 5055"],"p":"תבליט בזלת של אל לוחם עם חנית, מארץ מואב. רבים מזהים אותו עם כמוש, אל מואב – 'אוי לך מואב, אבדת עם כמוש'.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010120340"]],"b":"במדבר כא:29","more":["נמצאה סמוך לדיבון – העיר שבה נמצאה גם מצבת מישע, כך ששתי המצבות המואביות עומדות היום זו לצד זו.","הסגנון מושפע מאמנות מצרית ומאמנות צפון-סורית – מואב ישבה על דרך המלך, צומת מסחר בין מצרים לסוריה.","הזיהוי עם כמוש הוא השערה; המוזיאון מתאר את הדמות פשוט כ'אל לוחם של ממלכת מואב'."],"msrc":"אתר הלובר"},"amarna_megiddo":{"t":"מכתב אל-עמארנה מבירידיה, מלך מגידו","sub":["Lettre d'Amarna (EA 365)","המאה ה-14 לפנה\"ס (ימי אחנתון)","חדר 303","AO 7098"],"p":"לוח חימר קטן בכתב יתדות: מכתב תלונה של בירידיה, שליט מגידו, אל פרעה. הוא מתלונן שהוא לבדו שולח פועלים לעבודת כפייה בשדות שונם, בזמן ששאר השליטים המקומיים מתחמקים.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010167798"],["ויקיפדיה","https://he.wikipedia.org/wiki/מכתבי_אל-עמארנה"],["Wikipedia","https://en.wikipedia.org/wiki/Amarna_letters"]],"b":"מלכים ב ד:8","more":["'למלך אדוני ושמשי... לרגלי המלך שבע ושבע פעמים נפלתי' – נוסח הפתיחה הקבוע של מכתבי עמארנה.","שונם (שונמה) היא העיר של אבישג השונמית ושל האישה השונמית מסיפור אלישע (מלכים ב ד:8).","מכתבי עמארנה מציירים את כנען כמה מאות שנים לפני ממלכת ישראל: ערים קטנות, מלכים מקומיים שתלויים במצרים, וקבוצות 'חבירו'.","מוצג בוויטרינה 4 ('תקופת הברונזה המאוחרת') בחדר 303."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"apadana_capital":{"t":"כותרת העמוד מארמון דריווש בשושן","sub":["Chapiteau de l'Apadana","522–486 לפנה\"ס (דריווש הראשון)","חדר 307","AOD 1"],"p":"כותרת ענקית בצורת שני פרים, שעמדה בראש אחד מעמודי אולם המלכות (האפדנה) של דריווש הראשון בשושן. זה 'שושן הבירה' של מגילת אסתר, נחמיה ודניאל – ועמודי האבן האלה הם 'עמודי שש' שמתוארים בפתיחת המגילה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010170688"],["ויקיפדיה","https://he.wikipedia.org/wiki/שושן"],["Wikipedia","https://en.wikipedia.org/wiki/Palace_of_Darius_in_Susa"]],"star":1,"b":"אסתר א:6","more":["האולם שימש את מלכי פרס עד אחשוורוש (קסרקסס) וארתחשסתא – המלכים של מגילת אסתר ושל עזרא ונחמיה.","את השרידים חשפו מרסל וז'אן דיולפואה בחפירות 1884–1886.","על גבי ראשי הפרים הונחו קורות העץ של התקרה – נסו לדמיין אולם של 36 עמודים כאלה.","בשושן מצוי גם הקבר המיוחס לדניאל הנביא – אתר עלייה לרגל עד היום."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"archers_frieze":{"t":"פריז הקשתים מארמון דריווש","sub":["Frise des archers","522–486 לפנה\"ס (דריווש הראשון)","חדר 307","AOD 488"],"p":"לוחות לבנים מזוגגות בצבעים עזים: ארבעה קשתים בבגדי טקס, משני צדיה של כתובת תלת-לשונית של דריווש. כך נראו קירות הארמון שבו שירת נחמיה כשר המשקים – 'ואני הייתי בשושן הבירה'.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010170854"],["ויקיפדיה","https://he.wikipedia.org/wiki/שושן"],["Wikipedia","https://en.wikipedia.org/wiki/Palace_of_Darius_in_Susa"]],"star":1,"b":"נחמיה א:1","more":["מקובל לזהות את הקשתים עם משמר המלך – 'בני האלמוות' שהרודוטוס מתאר.","הלבנים מזוגגות, טכניקה שהפרסים למדו מבבל (השוו לאריה מדרך התהלוכה בחדר 230).","גם אסתר ומרדכי פועלים ב'שושן הבירה' – הסיפור מתרחש בחצר מלוכה פרסית כמו זו.","התגלו בחפירות דיולפואה ב-1884–1886; מה שרואים הוא הרכבה מחדש של לבנים מקוריות."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"lions_frieze":{"t":"פריז האריות משושן","sub":["Frise des lions","522–486 לפנה\"ס (דריווש הראשון)","חדר 307","AOD 489 A"],"p":"אריות צועדים בלבנים מזוגגות, מאותו ארמון של דריווש בשושן. ספר דניאל ממקם את חזון האיל והצפיר 'בשושן הבירה', ובשושן מצוי עד היום קבר המיוחס לדניאל.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010170855"],["ויקיפדיה","https://he.wikipedia.org/wiki/שושן"],["Wikipedia","https://en.wikipedia.org/wiki/Palace_of_Darius_in_Susa"]],"b":"דניאל ח:2","more":["האריה הוא מוטיב ישן במסופוטמיה – השוו לאריות של נבוכדנצר מבבל בחדר 230.","הפריז מוצג באותו אולם (307) עם פריז הקשתים וכותרת הפרים – כדאי לראות את שלושתם יחד.","בפריז שולבו אריות שהולכים ימינה ושמאלה (AOD 489 A–C)."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"darius_charter":{"t":"מגילת היסוד של ארמון דריווש","sub":["Charte de fondation du palais de Darius Ier (DSf)","522–486 לפנה\"ס","חדר 309","SB 2789"],"p":"לוח חימר בפרסית עתיקה שהוטמן מתחת לסף בארמון. דריווש מפרט בו מאיפה הביא כל חומר בנייה – ובין השאר ארזים מהלבנון. זה אותו דריווש שבשנת מלכותו השישית הושלם בית המקדש השני.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010176876"],["ויקיפדיה","https://he.wikipedia.org/wiki/דריווש_הראשון"],["Wikipedia","https://en.wikipedia.org/wiki/Palace_of_Darius_in_Susa"]],"b":"עזרא ו:15","more":["דריווש מספר שהארזים הובאו מהלבנון לבבל, ומשם לשושן – תמונה דומה לארזים שהובאו לבניין הבית השני (עזרא ג:7).","לפי הכתובת, עמים מכל רחבי האימפריה עבדו בבנייה: יוונים, מצרים, מדים, בבלים ועוד.","הכתובת קיימת בכמה עותקים ובשלוש שפות (פרסית עתיקה, עילמית ואכדית); הלוח הזה הוא הנוסח הפרסי.","מוצג בחדר 309, וויטרינה 4: 'שפות וכתבים באימפריה האחמנית'."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"eshmunazar_sarcophagus":{"t":"ארון הקבורה של אשמנעזר השני מלך צידון","sub":["Sarcophage d'Eshmunazor","הרבע הראשון של המאה ה-5 לפנה\"ס","חדר 311","AO 4806"],"p":"ארון אבן שחורה בסגנון מצרי, ועל מכסהו הכתובת הפניקית הארוכה ביותר מהתקופה הפרסית. אפשר כמעט לקרוא אותה בעברית: היא פותחת ב'בירח בל' – אותו 'ירח בול' שבו הושלם מקדש שלמה – ומספרת ש'אדון המלכים' הפרסי נתן לצידונים את דור ויפו.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010120357"],["ויקיפדיה","https://he.wikipedia.org/wiki/ארון_קבורת_אשמונעזר_השני"],["Wikipedia","https://en.wikipedia.org/wiki/Sarcophagus_of_Eshmunazar_II"]],"star":1,"b":"מלכים א ו:38; עזרא ג:7","more":["אשמנעזר מת צעיר: 'נגזלתי בלא עתי... יתום בן אלמנה'. אמו, אמעשתרת, הייתה כוהנת של עשתרת.","הכתובת מקללת כל מי שיפתח את הקבר – ומוסיפה שאין בו שום אוצר.","דור ויפו בשרון ניתנו לצידון על ידי מלך פרס – בדיוק בתקופת שיבת ציון, כשצידונים וצורים הביאו ארזים 'אל ים יפוא' לבניין הבית השני (עזרא ג:7).","האבן הובאה מוואדי חמאמאת שבמצרים; ייתכן שהארון יוצר במקור עבור אציל מצרי והגיע לצידון כשלל.","נמצא ב-1855 ליד צידון; הדוכס דה לויין קנה אותו ותרם ללובר.","חדר 311 ('ביבלוס – פניקיה – צידון')."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"palmyra_triad":{"t":"השילוש האלוהי מתדמור","sub":["Triade divine (Baalshamin, Aglibol, Malakbel)","המאה ה-1 לספירה","חדר 315","AO 19801"],"p":"תבליט פולחן של שלושה אלים חמושים: בעל-שמין, 'אדון השמיים', במרכז, ולצדו אגלבול (הירח) ומלכבל (השמש). תדמור, עיר הנאת המדבר, מופיעה בתנ\"ך כעיר ששלמה 'בנה במדבר'.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010127854"],["ויקיפדיה","https://he.wikipedia.org/wiki/תדמור"],["Wikipedia","https://en.wikipedia.org/wiki/Palmyra"]],"b":"דברי הימים ב ח:4","more":["השם 'בעל-שמין' הוא 'בעל שמים' – קרוב ל'אלה שמיא' של ספר דניאל ועזרא.","האלים לבושים שריון רומי אבל מכנסיים פרסיים – תדמור ישבה בדיוק בין רומא לפרתיה.","על התבליט כתובות בארמית תדמורית: 'דכיר... בטב' (ייזכר לטובה) – נוסח הקדשה שמוכר גם מכתובות בבתי כנסת עתיקים.","מקדש בעל-שמין בתדמור פוצץ בידי דאע\"ש ב-2015.","חדר 315, וויטרינה 3."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"venus_de_milo":{"t":"ונוס ממילו","sub":["Vénus de Milo / Aphrodite of Melos","150–125 לפנה\"ס","חדר 345","Ma 399 (LL 299)"],"p":"פסל השיש המפורסם של אפרודיטה, אלת האהבה, שנמצא באי מילוס ב-1820. הוא פוסל בדיוק בתקופה שבה מרד המכבים מול השלטון היווני-הסלווקי – כך נראה 'היופי היווני' שהחשמונאים נאבקו מולו.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010277627"],["ויקיפדיה","https://he.wikipedia.org/wiki/ונוס_ממילו"],["Wikipedia","https://en.wikipedia.org/wiki/Venus_de_Milo"]],"star":1,"more":["הזרועות אבדו; התנוחה המקורית שנויה במחלוקת – אולי החזיקה תפוח, מראה או מגן.","שגריר צרפת, המרקיז דה ריבייר, קנה את הפסל והגיש אותו ללואי ה-18.","הפסל עשוי שני גושי שיש מפארוס שחוברו במותניים.","גובה: 2.04 מ'.","חדר 345 בקומת הקרקע של סולי – בדרך כלל עמוס; שווה להגיע מוקדם."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"borghese_gladiator":{"t":"הגלדיאטור של בורגזה","sub":["Gladiateur Borghèse","בערך 100 לפנה\"ס","חדר 348","Ma 527"],"p":"לוחם עירום בתנופת קרב, אחד הפסלים שהכי הושפעו מהם אמני הרנסנס. על גזע העץ חתום הפסל: 'אגסיאס בן דוסיתאוס מאפסוס עשה'.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010278706"],["Wikipedia","https://en.wikipedia.org/wiki/Borghese_Gladiator"]],"more":["למרות השם זה לא גלדיאטור – כנראה לוחם שמתגונן מפני פרש.","החרב והמגן אבדו; הזרוע הימנית היא שחזור.","נפוליאון קנה אותו ב-1807 עם כל אוסף בורגזה מגיסו, קמילו בורגזה.","השם דוסיתאוס היה נפוץ גם בקרב יהודים דוברי יוונית באותה תקופה."],"msrc":"אתר הלובר, Wikipedia"},"sleeping_hermaphroditus":{"t":"ההרמפרודיטוס הישן","sub":["Hermaphrodite endormi","המחצית הראשונה של המאה ה-2 לספירה (העתק רומי)","חדר 348","Ma 231"],"p":"דמות שוכבת שמגבה נראית כאישה ומלפנים מתגלה כבעלת שני מינים – הפתעה מכוונת של הפסל ההלניסטי. הפסל הרומי נמצא ברומא ב-1618.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010250571"],["ויקיפדיה","https://he.wikipedia.org/wiki/הרמאפרודיטוס_הישן"],["Wikipedia","https://en.wikipedia.org/wiki/Sleeping_Hermaphroditus"]],"more":["את המזרן שעליו שוכבת הדמות פיסל ג'אן לורנצו ברניני ב-1619 – ומשכנע עד כדי כך שנראה רך.","כדאי לה  המתוחים ועל המושכות שכמעט אין עליהן שליטה.","המקוריים הוסרו מהקונקורד ב-1984 בגלל זיהום האוויר, והוחלפו בהעתקים.","החצר (Cour Marly) קיבלה גג זכוכית ב-1993, כך שהפסלים שוב עומדים באור יום, כמו בגן.","באותה חצר עומדים גם הסוסים המכונפים של קואזבוקס (Coysevox), שקדמו להם בטירה. השוו ביניהם."],"msrc":"אתר הלובר, Wikipedia"},"michelangelo_slaves":{"t":"העבד הגוסס והעבד המורד","sub":["Esclave mourant / Esclave rebelle","Michelangelo Buonarroti, 1513–1515","חדר 403","MR 1590 / MR 1589"],"p":"שני פסלים שמיכלאנג'לו גילף לקברו של האפיפיור יוליוס השני ברומא ולא סיים. העבד הגוסס נראה כמי ששוקע בשינה יותר מאשר במוות, והעבד המורד מתפתל ונאבק בכבליו. אלה הפסלים היחידים של מיכלאנג'לו בצרפת שאפשר לראות מקרוב.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010091872"],["ויקיפדיה","https://he.wikipedia.org/wiki/העבד_הגוסס_(מיכלאנג'לו)"],["Wikipedia","https://en.wikipedia.org/wiki/Dying_Slave"]],"star":1,"more":["חפשו את עקבות האיזמל שנשארו גלויים, בעיקר בעבד המורד. רואים בהם איך מיכלאנג'לו \"שחרר\" את הדמות מגוש השיש.","מאחורי רגל העבד הגוסס מסתתר קוף לא גמור. לפי אחד ההסברים הוא מסמל את האמנות, \"הקוף של הטבע\" שמחקה אותו.","בעבד המורד עובר סדק בשיש על הפנים ועל הכתף. כנראה זו אחת הסיבות שהפסל ננטש.","מיכלאנג'לו נתן את שני הפסלים לרוברטו סטרוצי, וזה העניק אותם למלך צרפת. הם בצרפת מאז המאה ה-16."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"canova_psyche":{"t":"פסיכה מתעוררת מנשיקת קופידון","sub":["L'Amour et Psyché à demi couchée","Antonio Canova, 1787–1793","חדר 403","MR 1777"],"p":"אמור (קופידון) נוחת ומעיר בנשיקה את פסיכה, שנפלה לשינה דמוית מוות אחרי שפתחה קופסה אסורה. שני הגופים והכנפיים יוצרים צורת X, ובמרכזה המבט ביניהם. שיא הפיסול הניאו-קלאסי.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010091976"],["ויקיפדיה","https://he.wikipedia.org/wiki/פסיכה_מתעוררת_מנשיקת_קופידון"],["Wikipedia","https://en.wikipedia.org/wiki/Psyche_Revived_by_Cupid's_Kiss"]],"star":1,"more":["הסיפור לקוח מ\"חמור הזהב\" של אפוליוס, סופר רומי מהמאה ה-2.","קנובה תכנן את הפסל לצפייה מכל הכיוונים, אז הקיפו אותו. מכל זווית הוא נראה אחרת.","השיש מלוטש עד שהוא נראה כמו עור, והסלע שעליו שוכבת פסיכה מחוספס בכוונה.","הפסל הוזמן בידי קולונל בריטי, ובסוף קנה אותו יואכים מורא, גיסו של נפוליאון. הוא בלובר מאז 1824."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"raft_medusa":{"t":"רפסודת המדוזה","sub":["Le radeau de la Méduse","Théodore Géricault, 1818–1819","חדר 700","INV 4884"],"p":"ב-1816 עלתה הפריגטה הצרפתית \"מדוזה\" על שרטון מול חופי מאוריטניה. כ-150 איש נדחסו לרפסודה, ואחרי 13 ימים של רעב, טירוף וקניבליזם שרדו רק 15. ז'ריקו, בן 27, הפך את השערורייה הפוליטית לציור ענק שבו ההמון, ולא גיבור יחיד, עומד במרכז.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010059199"],["ויקיפדיה","https://he.wikipedia.org/wiki/רפסודת_המדוזה"],["Wikipedia","https://en.wikipedia.org/wiki/The_Raft_of_the_Medusa"]],"star":1,"note":"Salle 700 (Mollien) closes 1–15 Dec 2026 per the Louvre gallery schedule; open on 21 Nov.","more":["בציור שתי פירמידות. אחת בנויה מהמתים ומהייאוש. השנייה עולה אל דמות שמנופפת בבד לעבר ספינת ההצלה \"ארגוס\", נקודה זעירה באופק.","בראש הפירמידה ז'ריקו הציב אדם שחור. זו הייתה אמירה מכוונת נגד העבדות.","ז'ריקו ראיין ניצולים, בנה דגם של הרפסודה ולמד גופות בבית חולים כדי לצייר את המתים.","לפי המסורת, הצעיר דלקרואה דגמן לאחת הגופות בחזית.","הציור הולך ומכהה עם השנים בגלל צבע הביטומן שז'ריקו השתמש בו."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"liberty":{"t":"החירות מובילה את העם","sub":["Le 28 juillet 1830. La Liberté guidant le peuple","Eugène Delacroix, 1830","חדר 700","RF 129"],"p":"מהפכת יולי 1830 בפריז. אישה חשופת חזה, אלגוריה של החירות, מניפה את הדגל הכחול-לבן-אדום ומובילה את ההמון מעל הבריקדות. הציור שוחזר ב-2023–2024 וחזר לתצוגה עם צבעים בהירים בהרבה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010065872"],["ויקיפדיה","https://he.wikipedia.org/wiki/החירות_מובילה_את_העם"],["Wikipedia","https://en.wikipedia.org/wiki/Liberty_Leading_the_People"]],"star":1,"note":"Restored 2023–24; collection record shows Salle 700 (on display).","more":["מאז השחזור הכחול בדגל והשמיים בהירים בהרבה. אם ראיתם את הציור לפני 2024, ההבדל בולט.","\"מריאן\" הפכה לסמל הרפובליקה הצרפתית. הכובע הפריגי האדום על ראשה מסמל בנאדם משוחרר.","הנער עם שני האקדחים נחשב להשראה לגברוש של ויקטור הוגו ב\"עלובי החיים\".","יש שמזהים את דלקרואה עצמו באיש עם המגבעת. אין לכך הוכחה.","מגדלי נוטרדאם מבצבצים מימין, בתוך העשן.","המדינה קנתה את הציור ב-1831, אבל החביאה אותו מהציבור במשך שנים כי נחשב מסוכן פוליטית."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"sardanapalus":{"t":"מות סרדנפל","sub":["Mort de Sardanapale","Eugène Delacroix, 1827","חדר 700","RF 2346"],"p":"סרדנפל, מלך אשורי אגדי, נצור וקרוב להפסד. לפני שיעלה באש הוא מצווה להשמיד את כל רכושו: נשים, סוסים ואוצרות. הוא שוכב אדיש על מיטה אדומה ענקית ומביט בטבח. הציור עורר שערורייה בסלון של 1827.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010065757"],["ויקיפדיה","https://he.wikipedia.org/wiki/מות_סארדאנאפאלוס"],["Wikipedia","https://en.wikipedia.org/wiki/The_Death_of_Sardanapalus"]],"more":["המקור הוא מחזה של לורד ביירון מ-1821, לא אירוע היסטורי.","אין בציור נקודה שקטה. הכול מתפתל לאורך אלכסון אדום אחד מהפינה למעלה.","הנושא הוא הניגוד בין המבט הרגוע של המלך לבין התוהו סביבו.","את המלכים האשורים האמיתיים, בתבליטים מנינוה ומדור-שרוכין, תמצאו באגף המזרח הקדום."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"gros_jaffa":{"t":"בונפרטה מבקר את חולי המגפה ביפו","sub":["Bonaparte visitant les pestiférés de Jaffa (11 mars 1799)","Antoine-Jean Gros, 1804","חדר 700","INV 5064"],"p":"מרץ 1799, מסע נפוליאון לארץ ישראל. הגנרל בונפרטה נוגע בחייל חולה דבר בבית חולים מאולתר ביפו, כדי להראות שהוא לא מפחד. זה ציור תעמולה שהוזמן כדי לטשטש את השמועות שנפוליאון הורה להרעיל את החולים בנסיגה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062570"],["ויקיפדיה","https://he.wikipedia.org/wiki/בונפרטה_מבקר_את_קורבנות_המגפה_ביפו"],["Wikipedia","https://en.wikipedia.org/wiki/Bonaparte_Visiting_the_Plague_Victims_of_Jaffa"]],"star":1,"more":["הרקע ההיסטורי: יפו נכבשה ב-7 במרץ 1799 ואלפי שבויים הוצאו להורג על החוף. אחר כך פרצה מגפה בצבא.","לפי המסורת, הסצנה מתרחשת במנזר הארמני ביפו. שימו לב לקשתות המזרחיות ולעיר שברקע.","קצין שעומד מאחורי נפוליאון מצמיד ממחטה לאף. הניגוד לאומץ של נפוליאון מכוון.","המחווה מחקה את ישו המרפא במגע, ואת המסורת שמלכי צרפת מרפאים חולים בנגיעה.","באותו חדר: \"נפוליאון בשדה הקרב באיילאו\", גם של גרו (INV 5067)."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"coronation_napoleon":{"t":"הכתרת נפוליאון","sub":["Le Couronnement de l'empereur Napoléon Ier et de l'impératrice Joséphine dans la cathédrale Notre-Dame de Paris, le 2 décembre 1804.","Jacques-Louis David, 1807","חדר 702","INV 3699"],"p":"2 בדצמבר 1804, קתדרלת נוטרדאם. נפוליאון כבר הכתיר את עצמו, ועכשיו הוא מניח כתר על ראש ז'וזפין הכורעת. האפיפיור פיוס השביעי יושב מאחוריו ומברך. בד של כ-6 על 10 מטרים עם יותר ממאה דמויות.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010065720"],["ויקיפדיה","https://he.wikipedia.org/wiki/הכתרת_נפוליאון"],["Wikipedia","https://en.wikipedia.org/wiki/The_Coronation_of_Napoleon"]],"star":1,"more":["לטיציה, אמו של נפוליאון, יושבת במרכז היציע. בפועל היא לא הגיעה לטקס, ונפוליאון ביקש להוסיף אותה.","דויד צייר את עצמו ביציע העליון, עם פנקס סקיצות ביד.","בסקיצות המוקדמות נפוליאון מכתיר את עצמו. דויד החליף לרגע שבו הוא מכתיר את ז'וזפין, שנראה פחות יהיר.","דויד צייר גרסה שנייה שתלויה בוורסאי. ההבדל הבולט: שמלה ורודה לאחת מאחיות נפוליאון."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"oath_horatii":{"t":"שבועת ההוראטים","sub":["Le serment des Horaces, entre les mains de leur père","Jacques-Louis David, 1784","חדר 702","INV 3692"],"p":"שלושה אחים רומאים נשבעים לאביהם להילחם עד מוות בשלושה אחים מהעיר אלבה, למען רומא. מימין הנשים כבר מתאבלות. הציור, שהוזמן בידי המלך לואי ה-16, הפך למניפסט של הניאו-קלאסיציזם ושל ההקרבה למען המולדת, חמש שנים לפני המהפכה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062239"],["ויקיפדיה","https://he.wikipedia.org/wiki/שבועת_האחים_ההוראטים"],["Wikipedia","https://en.wikipedia.org/wiki/Oath_of_the_Horatii"]],"star":1,"more":["הכול בשלשות: שלוש קשתות, שלוש קבוצות, שלוש חרבות.","הגברים בנויים מקווים ישרים ונוקשים, והנשים מקווים מעוגלים ורכים. ההשוואה מכוונת.","החרבות ביד האב נמצאות בדיוק במרכז הציור.","הסוף מטיטוס ליוויוס: רק אח אחד שרד, והוא הרג את אחותו קמילה כשבכתה על ארוסה, אחד האויבים.","באותו חדר: \"הסבינות\" של דויד (1799)."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"grande_odalisque":{"t":"האודליסק הגדולה","sub":["Une odalisque, dite La grande odalisque","Jean-Auguste-Dominique Ingres, 1814","חדר 702","RF 1158"],"p":"אישה עירומה בהרמון מזרחי מסובבת אלינו מבט קר מעבר לכתף. את הציור הזמינה קרוליין מורא, אחותו של נפוליאון ומלכת נאפולי. אינגר עיוות את הגוף בכוונה כדי ליצור קו ארוך ואלגנטי.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010065566"],["ויקיפדיה","https://he.wikipedia.org/wiki/האודליסק_הגדולה"],["Wikipedia","https://en.wikipedia.org/wiki/Grande_Odalisque"]],"more":["מבקרים בני התקופה טענו שלגב שלה יש שתיים או שלוש חוליות מיותרות. גם הזרוע והרגל מוארכות.","פרטים \"מזרחיים\": נרגילה, מניפת נוצות טווס, טורבן ותכשיטים.","אינגר מעולם לא ביקר במזרח. כל ההרמון דמיוני.","אינגר היה תלמידו של דויד. השוו את הקו הנקי שלו לציורים של דויד באותו חדר."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"cimabue_maesta":{"t":"מאסטה – המדונה בהדרה (צ'ימבואה)","sub":["La Vierge et l'Enfant en majesté entourés de six anges (Maestà)","Cimabue, 1275–1300","חדר 708","INV 254"],"p":"מרים על כס מלכות עם ישו התינוק ושישה מלאכים. זו אחת היצירות שפתחו את הציור האיטלקי ויצאו מהמסורת הביזנטית. שחזור גדול הסיר לכות צהובות והחזיר את הכחול והזהב, והציור הוצג בתערוכה ב-2025. היום הוא תלוי בסלון קארה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010064463"],["Wikipedia","https://en.wikipedia.org/wiki/Maestà_(Cimabue)"]],"note":"Restored ~2022–24; shown in 2025 exhibition (Salle 717), record now gives Salle 708 Salon Carré.","more":["השוו לאיקונות ביזנטיות: הפנים עדיין סכמטיים, אבל הכס מצויר עם עומק ונפח.","השחזור חשף בשולי הגלימות כתב פסאודו-ערבי, שמחקה את הבדים היוקרתיים שהגיעו מהמזרח.","במסגרת יש עשרות מדליונים קטנים עם פרצופים של מלאכים, נביאים וקדושים.","הציור הגיע מכנסיית סן פרנצ'סקו בפיזה, שלל מתקופת נפוליאון שלא הוחזר."],"msrc":"אתר הלובר, Wikipedia"},"giotto_francis":{"t":"פרנציסקוס הקדוש מקבל את הסטיגמטה","sub":["Saint François d'Assise recevant les stigmates","Giotto di Bondone, 1300–1325","חדר 708","INV 309"],"p":"פרנציסקוס מאסיזי מקבל את הסטיגמטה, פצעי הצליבה של ישו, משרף מכונף בדמות ישו. זו אחת היצירות הבודדות שג'וטו חתם עליהן, והחתימה מופיעה על המסגרת.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010064459"],["Wikipedia","https://en.wikipedia.org/wiki/Saint_Francis_Receiving_the_Stigmata_(Giotto)"]],"more":["קווים זהובים דקים מחברים את פצעי ישו לידיים, לרגליים ולצד של פרנציסקוס.","בפרדלה (הרצועה התחתונה) שלוש סצנות קטנות. חפשו את הדרשה לציפורים.","הגוף של פרנציסקוס כורע ומתפתל. זו כבר לא דמות ביזנטית שטוחה.","החתימה בלטינית על המסגרת: OPUS IOCTI FLORENTINI."],"msrc":"אתר הלובר, Wikipedia"},"fra_angelico_coronation":{"t":"הכתרת הבתולה","sub":["Le Couronnement de la Vierge","Fra Angelico, 1425–1450","חדר 708","INV 314"],"p":"ישו מכתיר את מרים בשמיים, ומתחתם המון קדושים ומלאכים בצבעים בוהקים. פרא אנג'ליקו, נזיר דומיניקני, צייר את המזבח לכנסיית המנזר שלו בפייזולה, ליד פירנצה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010064473"],["Wikipedia","https://en.wikipedia.org/wiki/Coronation_of_the_Virgin_(Fra_Angelico,_Louvre)"]],"more":["מדרגות השיש בפרספקטיבה מובילות את העין אל הכס.","נסו לזהות קדושים לפי הסמלים שלהם, למשל הגלגל של קתרינה והכבש של אגנס.","בפרדלה מסופרים חיי דומיניקוס הקדוש, מייסד המסדר של הצייר.","ההכתרה לא מופיעה בברית החדשה. זו מסורת כנסייתית מאוחרת."],"msrc":"אתר הלובר, Wikipedia"},"mantegna_crucifixion":{"t":"הצליבה (מנטניה)","sub":["La Crucifixion","Andrea Mantegna, after 1456–1459","חדר 710","INV 368"],"p":"שלושה צלובים על גולגותא. מתחתם חיילים רומאים מטילים גורל על בגדי ישו, ומרים מתמוטטת בין הנשים. זה הלוח המרכזי בפרדלה של מזבח סן זנו בוורונה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010064446"],["Wikipedia","https://en.wikipedia.org/wiki/Crucifixion_(Mantegna)"]],"b":"מתי כז:33–56","more":["ההר מרוצף באבנים כמו כיכר. מנטניה משתמש בריצוף כדי לבנות פרספקטיבה.","החיילים מטילים קובייה על הגלימה, כמו ביוחנן יט:23–24.","הגולגולת בבסיס הצלב: \"גולגותא\" פירושו מקום הגולגולת, ולפי המסורת זו גולגולתו של אדם הראשון.","נפוליאון לקח את המזבח. הלוח הראשי חזר לוורונה, ושני לוחות אחרים מהפרדלה נמצאים בטור."],"msrc":"אתר הלובר, Wikipedia"},"mantegna_sebastian":{"t":"סבסטיאנוס הקדוש (מנטניה)","sub":["Saint Sébastien","Andrea Mantegna, 1475–1500","חדר 710","RF 1766"],"p":"סבסטיאנוס, חייל רומי שהוצא להורג בחיצים בגלל אמונתו, קשור לעמוד של קשת רומית הרוסה. מנטניה, שאהב עתיקות, הפך את הקדוש לפסל קלאסי חי.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010064796"],["Wikipedia","https://en.wikipedia.org/wiki/Saint_Sebastian_(Mantegna)"]],"more":["ליד רגליו מונחים שברי פסלים רומיים: הנצרות מנצחת את העולם האלילי.","בפינה הימנית התחתונה רואים ראשים של שני קשתים, חתוכים במסגרת, כאילו הם עומדים בינינו לבין הקדוש.","הפנים מופנות למעלה, כמעט בלי סבל.","הציור היה במשך מאות שנים בכנסייה באיגפרס שבמרכז צרפת."],"msrc":"אתר הלובר, Wikipedia"},"virgin_of_the_rocks":{"t":"הבתולה בין הסלעים","sub":["La Vierge, l'Enfant Jésus, saint Jean Baptiste et un ange, dit La Vierge aux rochers","Leonardo da Vinci, c. 1483–1494","חדר 710","INV 777"],"p":"מרים, ישו התינוק, יוחנן המטביל התינוק ומלאך, במערה סלעית. זו הגרסה הראשונה מתוך שתיים, והשנייה בנשיונל גלרי בלונדון. כאן רואים את הספומטו של לאונרדו, המעבר העמום בין אור לצל.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062373"],["ויקיפדיה","https://he.wikipedia.org/wiki/המדונה_בין_הסלעים"],["Wikipedia","https://en.wikipedia.org/wiki/Virgin_of_the_Rocks"]],"star":1,"more":["הסצנה לא מופיעה בברית החדשה. היא מבוססת על מסורת על מפגש של ישו ויוחנן כתינוקות בזמן הבריחה למצרים.","עקבו אחרי הידיים: המלאך מצביע על יוחנן, ויד של מרים מרחפת מעל ישו. כך כל הדמויות מחוברות.","בגרסה הלונדונית יש הילות, ויוחנן מחזיק צלב. כאן אין הילות, והמלאך מצביע.","הצמחים בחזית מצוירים בדיוק של בוטנאי.","המזמינים במילאנו התווכחו עם לאונרדו על התשלום, וזו כנראה הסיבה שיש שתי גרסאות."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"st_anne":{"t":"הבתולה והילד עם אנה הקדושה","sub":["La Vierge, l'Enfant Jésus et sainte Anne, dit La Sainte Anne","Leonardo da Vinci, c. 1503–1519","חדר 710","INV 776"],"p":"שלושה דורות: אנה, סבתו של ישו, בתה מרים שיושבת על ברכיה, וישו הילד שתופס כבש. לאונרדו עבד על הציור כ-15 שנה ולא סיים אותו.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010066107"],["ויקיפדיה","https://he.wikipedia.org/wiki/אנה_הקדושה,_הבתולה_וישו_הילד_(דה_וינצ'י)"],["Wikipedia","https://en.wikipedia.org/wiki/The_Virgin_and_Child_with_Saint_Anne_(Leonardo)"]],"more":["הכבש מסמל את הקורבן. מרים מנסה למשוך את הילד ממנו, ואנה מחייכת כאילו כבר יודעת שהגורל בלתי נמנע.","הקומפוזיציה בנויה כפירמידה. השוו לגננת היפה של רפאל באותו חדר.","הנוף הכחול ברקע דומה לנוף שמאחורי המונה ליזה.","השחזור ב-2011–2012 עורר מחלוקת חריפה, ושני מומחים התפטרו מוועדת הליווי.","פרויד טען שהוא רואה בגלימה של מרים צורת עוף דורס. הפירוש שלו נשען על טעות תרגום."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"st_john_baptist":{"t":"יוחנן המטביל (לאונרדו)","sub":["Saint Jean Baptiste","Leonardo da Vinci, c. 1508–1519","חדר 710","INV 775"],"p":"יוחנן המטביל מגיח מחושך מוחלט, מחייך חיוך מסתורי ומצביע למעלה. כנראה זה הציור האחרון של לאונרדו, והוא שמר אותו אצלו עד מותו בצרפת.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062374"],["ויקיפדיה","https://he.wikipedia.org/wiki/יוחנן_המטביל_(דה_וינצ'י)"],["Wikipedia","https://en.wikipedia.org/wiki/Saint_John_the_Baptist_(Leonardo)"]],"b":"יוחנן א:29","more":["האצבע שמצביעה לשמיים: המטביל מבשר על ביאת ישו.","בידו השמאלית צלב דק מקנה, כמעט בלתי נראה בחושך.","הפרווה על כתפיו רומזת ללבוש שלו במדבר (מתי ג:4).","השוו את החיוך לחיוך של המונה ליזה."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"belle_jardiniere":{"t":"הגננת היפה","sub":["La Vierge à l'Enfant avec le petit saint Jean Baptiste","Raphael, 1507","חדר 710","INV 602"],"p":"מרים יושבת בנוף כפרי, ישו הילד נשען על ברכיה, ויוחנן המטביל הקטן כורע מימין. את השם \"הגננת היפה\" קיבל הציור במאה ה-18, בגלל הצמחייה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010060754"],["Wikipedia","https://en.wikipedia.org/wiki/La_belle_jardinière"]],"more":["פירמידה מושלמת: רפאל למד את המבנה מלאונרדו בפירנצה. השוו לאנה הקדושה באותו חדר.","ההילות דקות כחוט ובקושי רואים אותן.","יוחנן מחזיק מקל עם צלב, רמז לצליבה.","החתימה והשנה (1507) מופיעות בשולי הגלימה של מרים."],"msrc":"אתר הלובר, Wikipedia"},"raphael_st_michael":{"t":"מיכאל המלאך מכניע את השטן","sub":["Saint Michel terrassant le démon, dit Le Grand Saint Michel","Raphael, 1518","חדר 710","INV 610"],"p":"המלאך מיכאל מנחית חנית על השטן שמתחת לרגליו. זו הייתה מתנה מהאפיפיור לאו העשירי למלך צרפת פרנסואה הראשון.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010060771"],["Wikipedia","https://en.wikipedia.org/wiki/Saint_Michael_Vanquishing_Satan"]],"b":"התגלות יב:7–9","more":["מיכאל כמעט לא נוגע בקרקע. הוא מרחף, והניצחון נראה קל.","השטן הוא חצי אדם וחצי דרקון, עם כנפי עטלף.","פרנסואה הראשון עמד בראש מסדר סן מישל, כך שהנושא היה מחמאה למלך.","שימו לב לשריון המבריק ולהשתקפויות האור עליו."],"msrc":"אתר הלובר, Wikipedia"},"mona_lisa":{"t":"המונה ליזה (לה ג'וקונדה)","sub":["Portrait de Lisa Gherardini, épouse de Francesco del Giocondo, dit La Joconde ou Monna Lisa","Leonardo da Vinci, 1503–1519","חדר 711","INV 779"],"p":"דיוקן של ליזה גרארדיני, אשת סוחר בדים מפירנצה. לאונרדו לא מסר את הציור למזמין ולקח אותו איתו לצרפת, שם נפטר. היום הוא תלוי מאחורי זכוכית מוגנת בחדר הגדול במוזיאון, סאל דז אטה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062370"],["ויקיפדיה","https://he.wikipedia.org/wiki/מונה_ליזה"],["Wikipedia","https://en.wikipedia.org/wiki/Mona_Lisa"]],"star":1,"more":["ספומטו: אין קווי מתאר, במיוחד בזוויות הפה והעיניים. לכן נדמה שהחיוך משתנה.","האופק משמאל נמוך מהאופק מימין. הנוף לא סימטרי בכוונה.","אין לה כמעט גבות וריסים. ייתכן שהם נמחקו בניקויים.","ב-1911 גנב אותה פועל איטלקי, והיא נמצאה אחרי שנתיים. הגניבה הפכה אותה לציור המפורסם בעולם.","טיפ: אחרי התור הסתובבו לאחור. מולה תלוי \"החתונה בקנה\".","בעתיד מתוכנן לה חדר נפרד במסגרת שיפוץ הלובר. כרגע היא עדיין בחדר 711."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"wedding_cana":{"t":"החתונה בקנה","sub":["Les Noces de Cana","Paolo Veronese, 1562–1563","חדר 711","INV 142"],"p":"נס הפיכת המים ליין בחתונה בקנה שבגליל, מצויר כמשתה ונציאני ענק עם כ-130 דמויות. זה הציור הגדול ביותר בלובר, כ-6.8 על 10 מטרים, והוא תלוי מול המונה ליזה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010064382"],["ויקיפדיה","https://he.wikipedia.org/wiki/החתונה_בקנה_(ורונזה)"],["Wikipedia","https://en.wikipedia.org/wiki/The_Wedding_at_Cana_(Veronese)"]],"star":1,"b":"יוחנן ב:1–11","more":["ישו יושב בדיוק במרכז ומביט אלינו. מעליו, על המרפסת, חותכים בשר: רמז לקורבן שיבוא.","לפי המסורת, הנגנים בחזית הם ציירי ונציה: ורונזה עצמו בלבן, וטיציאן באדום עם הוויולה הגדולה.","על השולחן לפני הנגנים עומד שעון חול. זה רמז לדברי ישו \"עוד לא באה שעתי\" (יוחנן ב:4).","הנס קורה בשוליים: מימין משרת מוזג את היין מהכדים.","נפוליאון לקח את הציור ממנזר סן ג'ורג'ו מאג'ורה בוונציה ב-1797. כדי להעביר אותו חתכו את הבד לחלקים."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"titian_entombment":{"t":"ההובלה אל הקבר (טיציאן)","sub":["La Mise au tombeau ou Le Transport du Christ vers le tombeau","Titian, c. 1520","חדר 711","INV 749"],"p":"יוסף מארמתיה וניקודימוס נושאים את גופת ישו אל הקבר, ואחריהם מרים ויוחנן. הפנים של ישו בצל, באור דמדומים אחרי הצליבה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062279"],["Wikipedia","https://en.wikipedia.org/wiki/The_Entombment_of_Christ_(Titian)"]],"b":"יוחנן יט:38–42","more":["הגוף כמעט נוגע בקרקע, ומורגש בו כובד המוות.","מרים המגדלית תומכת במרים האם, ששבורה מצער.","שימו לב לצבעים החמים של טיציאן: האדום של יוחנן מול הגוף החיוור.","הציור עבר מאוסף גונזגה במנטובה לצ'ארלס הראשון מאנגליה, ומשם ללואי ה-14.","הוא תלוי בפרוזדור (Vestibule) של סאל דז אטה."],"msrc":"אתר הלובר, Wikipedia"},"castiglione":{"t":"דיוקן בלדסרה קסטיליונה","sub":["Balthazar Castiglione (1478-1529), écrivain et diplomate","Raphael, c. 1514–1515","חדר 712","INV 611"],"p":"דיוקן של הדיפלומט והסופר בלדסרה קסטיליונה, חברו של רפאל ומחבר \"ספר החצרן\". רפאל השתמש בפלטה מצומצמת של אפור, שחור ולבן, והמבט הישיר של קסטיליונה השפיע על רמברנדט, רובנס ומאטיס.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010066418"],["Wikipedia","https://en.wikipedia.org/wiki/Portrait_of_Baldassare_Castiglione"]],"more":["רמברנדט ראה את הציור במכירה פומבית באמסטרדם ב-1639, שרטט אותו, ואחר כך צייר את עצמו בתנוחה דומה.","הידיים חתוכות בתחתית התמונה, וזה מקרב אותנו אליו.","הכובע והפרווה הם תרגיל בגווני אפור.","\"ספר החצרן\" קבע את דמות הג'נטלמן האירופי."],"msrc":"אתר הלובר, Wikipedia"},"caravaggio_death_virgin":{"t":"מות הבתולה (קאראווג'ו)","sub":["La Mort de la Vierge","Caravaggio, c. 1601–1606","חדר 712","INV 54"],"p":"מרים מתה ושוכבת על מיטה פשוטה, יחפה ונפוחה. סביבה השליחים בוכים, ומרים המגדלית מכונסת בעצמה. הכנסייה ברומא שהזמינה את הציור דחתה אותו כלא ראוי.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062304"],["Wikipedia","https://en.wikipedia.org/wiki/Death_of_the_Virgin_(Caravaggio)"]],"star":1,"more":["לפי שמועה עקשנית, המודל הייתה אישה שטבעה בטיבר. מכאן הגוף הנפוח.","יש רק הילה דקה מאוד מעל ראשה. אין מלאכים ואין עלייה השמימה. זה מוות אנושי לגמרי.","את מקום המלאכים תופס וילון אדום ענק, כמו בתיאטרון.","רובנס המליץ לדוכס מנטובה לקנות את הציור. אחר כך הוא עבר לצ'ארלס הראשון ולואי ה-14.","מות מרים לא מתואר בברית החדשה. הנושא בא מהמסורת."],"msrc":"אתר הלובר, Wikipedia"},"caravaggio_fortune_teller":{"t":"מגדת העתידות","sub":["La diseuse de bonne aventure","Caravaggio, c. 1595–1598","חדר 712","INV 55"],"p":"צוענייה צעירה קוראת בכף ידו של צעיר מגונדר, ובאותו זמן מחליקה את הטבעת מאצבעו. זו סצנה יומיומית שהפכה ללהיט, ודורות של ציירים חיקו אותה.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062329"],["ויקיפדיה","https://he.wikipedia.org/wiki/מגדת_העתידות_(קאראווג'ו)"],["Wikipedia","https://en.wikipedia.org/wiki/The_Fortune_Teller_(Caravaggio)"]],"more":["הסתכלו על האצבעות של הצוענייה. הטבעת כבר בדרך החוצה.","הצעיר מביט בעיניה ולא שם לב למה שקורה בידו.","אין רקע, רק קיר ואור שנופל באלכסון.","גרסה מוקדמת של הציור נמצאת במוזיאון הקפיטוליני ברומא."],"msrc":"אתר הלובר, Wikipedia, ויקיפדיה"},"napoleon3_apartments":{"t":"דירות נפוליאון השלישי","sub":["Appartements Napoléon III","Second Empire decor (Hector Lefuel), 1852–1870","חדר 544"],"p":"דירת הייצוג של שר המדינה בתקופת הקיסרות השנייה: זהב, קטיפה אדומה ונברשות ענק. כאן אפשר לראות איך נראה הלובר כשהיה ארמון ולא מוזיאון.","l":[["Wikipedia","https://en.wikipedia.org/wiki/Napoleon_III's_Louvre_expansion"]],"star":1,"note":"Not a collection object; room numbers from louvre.fr 'Splendour of the Second Empire' page. Listed open in Nov 2026 schedule.","more":["הסלון הגדול (חדר 544) הפך לפי הצורך לתיאטרון של כ-250 מקומות, עם במה לנגנים.","חדר האוכל הגדול ערוך כאילו האורחים עומדים להגיע.","משרד האוצר ישב כאן עד 1989. הדירות פתוחות לקהל מ-1993, ושופצו לאחרונה ב-2024.","נפוליאון השלישי, אחיינו של נפוליאון, השלים את בניין הלובר וחיבר אותו לארמון הטווילרי."],"msrc":"louvre.fr, Wikipedia"},"holbein_erasmus":{"t":"דיוקן ארסמוס כותב","sub":["Portrait d'Érasme (1467-1536) écrivant","Hans Holbein the Younger, 1523","חדר 809","INV 1345"],"p":"ההומניסט ארסמוס מרוטרדם, בפרופיל, שקוע בכתיבה. הולביין צייר כמה גרסאות שארסמוס שלח לחבריו ברחבי אירופה, מעין כרטיס ביקור.","l":[["Louvre","https://collections.louvre.fr/ark:/53355/cl010062617"],["Wikipedia","https://en.wikipedia.org/wiki/Hans_Holbein_the_Younger"]],"note":"Record date string reads '1e quart du XVIe siècle (1528)', which is self-contradictory; 1523 is the commonly given date.","more":["הפרופיל המדויק והעיניים המושפלות אל הדף משדרים ריכוז שקט.","ארסמוס הוציא ב-1516 את המהדורה המודפסת הראשונה של הברית החדשה ביוונית.","בזכות מכתב המלצה של ארסמו const INFO_HTML="<div class=\"info\" style=\"display:flex;flex-direction:column;gap:12px\">\n<h3>שעות וכניסה</h3>\n<dl class=\"kv\">\n<dt>שעות</dt><dd>9:00–18:00. ברביעי ובשישי עד 21:00. כניסה אחרונה שעה לפני הסגירה; פינוי האולמות מתחיל חצי שעה לפני.</dd>\n<dt>סגור</dt><dd>כל יום שלישי, וב-1.1, 1.5 ו-25.12.</dd>\n<dt>קומה 2</dt><dd>ברביעי ובשישי חדרי קומה 2 (ריבלייה 800, סולי 900) נפתחים רק ב-10:30.</dd>\n<dt>כרטיס</dt><dd>‏32 € למי שאינו אזרח האיחוד (כולל ישראלים). מומלץ להזמין שעת כניסה ב-<a href=\"https://ticket.louvre.fr/en\" target=\"_blank\" rel=\"noopener\">ticket.louvre.fr</a>; בין 19.12 ל-4.1 זו חובה. להיזהר מאתרי מכירה חוזרת.</dd>\n<dt>חינם</dt><dd>מתחת לגיל 18. ביום שישי הראשון בחודש אחרי 18:00 (למשל 4.12) הכניסה חינם לכולם.</dd>\n<dt>כניסות</dt><dd>הפירמידה (הראשית). <span class=\"ltr\">Porte des Lions</span>: לבעלי כרטיס בלבד, בדרך כלל התור הקצר ביותר, נסגרת ב-18:00. מעבר ריבלייה: לקבוצות בלבד.</dd>\n<dt>תחבורה</dt><dd>מטרו <span class=\"ltr\">Palais-Royal / Musée du Louvre</span> (קווים 1, 7), עם גישה תת-קרקעית דרך הקרוסל.</dd>\n<dt>תיקים</dt><dd>לוקרים חינם מתחת לפירמידה (עד ‎55×35×20 ס\"מ). מזוודות אסורות.</dd>\n<dt>צילום</dt><dd>מותר לשימוש אישי, בלי פלאש ובלי מקל סלפי.</dd>\n<dt>אוכל</dt><dd>Café Mollien (דנון 1, ליד חדר 700), Café Richelieu-Angelina (ריבלייה 1), בתי הקפה באולם נפוליאון.</dd>\n<dt>אודיוגייד</dt><dd>‏6 € ובלי עברית. אין אפליקציית ביקור רשמית; יש <a href=\"https://collections.louvre.fr/plan\" target=\"_blank\" rel=\"noopener\">מפה אינטראקטיבית</a>.</dd>\n</dl>\n<h3>סגור עכשיו (לפי אתר הלובר, 21.11.2026)</h3>\n<ul>\n<li>אמנות האסלאם (דנון ‎-1/‎-2), עתיקות רומיות (דנון 0), גלריית קמפאנה (סולי 1), גלריית מדיצ'י של רובנס (ריבלייה 2), הציור הספרדי 720–734, חדרים 400–402.</li>\n<li>חדר 709 סגור עד סוף נובמבר. <b>חדר 700</b> (רפסודת המדוזה, החירות) סגור 1–15 בדצמבר.</li>\n<li>גלריית אפולו (705) נפתחה מחדש ביולי 2026, אבל תכשיטי הכתר לא מוצגים מאז השוד באוקטובר 2025. אפשר להציץ בה בדרך מהניקה (703).</li>\n<li>המונה ליזה עדיין בחדר 711. ההעברה לאולם חדש מתוכננת רק לסביבות 2031.</li>\n<li>אין עדיין לוח סגירות לדצמבר. לבדוק שבוע לפני ב<a href=\"https://www.louvre.fr/en/visit/list-of-available-galleries\" target=\"_blank\" rel=\"noopener\">רשימת האולמות הפתוחים</a>.</li>\n</ul>\n<h3>לא מוצגים כרגע</h3>\n<ul><li>יהלום הרג'נט ותכשיטי הכתר – <a href=\"https://collections.louvre.fr/ark:/53355/cl010103121\" target=\"_blank\" rel=\"noopener\">Louvre</a>: לא מוצג: גלריית אפולו פתוחה (לפי לוח החדרים לנובמבר 2026) אך בלי תכשיטים; היהלום מסומן 'לא מוצג' באתר האוסף.</li><li>'האגן הטבילה של סן לואי' – <a href=\"https://collections.louvre.fr/ark:/53355/cl010318774\" target=\"_blank\" rel=\"noopener\">Louvre</a>: לא מוצג: מחלקת האמנות האסלאמית סגורה לשיפוץ; האגן כנראה מושאל לתערוכה בארה\"ב.</li><li>ארון 'צדן מלכתא' מקברי המלכים בירושלים – <a href=\"https://collections.louvre.fr/ark:/53355/cl010165751\" target=\"_blank\" rel=\"noopener\">Louvre</a>: לא מוצג לפי אתר האוסף.</li><li>כנסיית באוויט – אמנות קופטית – <a href=\"https://collections.louvre.fr/ark:/53355/cl010045191\" target=\"_blank\" rel=\"noopener\">Louvre</a>: לא מאומת: רכיבי באוויט שנבדקו מסומנים 'לא מוצג'; חדר הכנסייה המשוחזרת לא אומת.</li><li>לה בל פרונייר – <a href=\"https://collections.louvre.fr/ark:/53355/cl010062372\" target=\"_blank\" rel=\"noopener\">Louvre</a>: Collection record: 'non exposé' (not on display). Reason not stated.</li><li>הקונצרט הכפרי – <a href=\"https://collections.louvre.fr/ark:/53355/cl010062281\" target=\"_blank\" rel=\"noopener\">Louvre</a>: Collection record: 'non exposé' (not on display).</li><li>מחזור מארי דה מדיצ'י – הנחיתה במרסיי – <a href=\"https://collections.louvre.fr/ark:/53355/cl010060820\" target=\"_blank\" rel=\"noopener\">Louvre</a>: Record: Salle 801 Galerie Médicis, but Louvre 'list of available galleries' (2 Nov–1 Dec 2026) marks Galerie Médicis 'Currently closed'.</li><li>טריפטיך משפחת בראק – <a href=\"https://collections.louvre.fr/ark:/53355/cl010061888\" target=\"_blank\" rel=\"noopener\">Louvre</a>: Collection record: 'non exposé'. Was in the Schongauer exhibition (Sully room 130) until 20 Jul 2026.</li><li>דיוקן עצמי עם קוץ (דירר) – <a href=\"https://collections.louvre.fr/ark:/53355/cl010065609\" target=\"_blank\" rel=\"noopener\">Louvre</a>: Collection record: 'non exposé'.</li></ul>\n<h3>רקע: המקרא בלובר</h3>\n<p><b>המזרח הקדום (ריבלייה וסולי 0):</b> חמורבי (המאה ה-18 לפנה\"ס) ומשפט \"עין תחת עין\"; סרגון השני, שכבש את שומרון (ישעיהו כ); תגלת-פלאסר השלישי, שהגלה את צפון ישראל (מלכים ב טו); מישע מלך מואב (מלכים ב ג) – המצבה עם השם יהוה ואולי \"בית דוד\".</p>\n<p><b>פרס:</b> ארמון דריווש בשושן – הרקע לסיפורי אסתר, נחמיה (\"ואני הייתי בשושן הבירה\") ודניאל.</p>\n<p><b>מצרים:</b> שישק (הספינקס של טניס), רעמסס השני ופיתום ורעמסס, תהרקה מלך כוש שיצא נגד סנחריב (מלכים ב יט:9).</p>\n<p><b>הברית החדשה בציור:</b> החתונה בקנה (יוחנן ב), יוחנן המטביל, הצליבה וההובלה לקבר, הסעודה באמאוס (לוקס כד), מות הבתולה.</p>\n<p><b>התנ\"ך בציור:</b> בת שבע של רמברנדט (שמואל ב יא), ארבע העונות של פוסן (גן עדן, רות ובועז, אשכול המרגלים, המבול), משפט שלמה, המן במדבר, אליעזר ורבקה.</p>\n<p><b>נפוליאון וארץ ישראל:</b> \"בונפרטה מבקר את חולי המגפה ביפו\" (חדר 700) – תעמולה על המצור על יפו ב-1799.</p>\n<h3>הסתייגויות</h3>\n<ul><li>מספרי החדרים והסטטוס לקוחים מרשומת כל פריט באתר האוסף של הלובר. הסיכות על המפה מסמנות את אזור החדר בקירוב.</li><li>המפה: תוכנית המוזיאון הרשמית, מאי 2026 (Dream On / Service de la médiation graphique et numérique, musée du Louvre), לשימוש אישי.</li><li>הקשרים המקראיים לפי הדעה המחקרית המקובלת. הקריאה \"בית דוד\" במצבת מישע שנויה במחלוקת.</li></ul>\n</div>";
